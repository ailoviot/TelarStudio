      filas.map(f => `<div style="flex:1;display:flex;gap:4px">${f.map(x =>
      `<div style="flex:1;background:${AZ};border-radius:4px;color:${SOBRE};font-size:${TX()}px;
       display:flex;align-items:center;justify-content:center;overflow:hidden">${T(x)}</div>`).join('')}</div>`).join('')}</div>`;
  }
  case 'textarea': return `<div style="${caja(GR,6)};border:1px solid ${BR};padding:6px;color:${BL};
      font-size:${TX()}px">${T(w.texto||'Escribe aqui...')}</div>`;
  case 'keyboard': {
    const filas = [10,9,7,3];
    return `<div style="${caja(GR,7)};padding:4px;display:flex;flex-direction:column;gap:3px">${
      filas.map((n,fi)=>`<div style="flex:1;display:flex;gap:3px">${Array.from({length:n},()=>
      `<div style="flex:1;background:${fi===3?AZ:BR};border-radius:3px"></div>`).join('')}</div>`).join('')}</div>`;
  }

  case 'bar': { const g = geometria(w);
    return `<div style="width:${g.w}px;height:${g.h}px;background:${GR};border-radius:99px;overflow:hidden">
      <div style="width:${PCT(62)}%;height:100%;background:${V && V.color || AZ}"></div></div>`; }
  /* El radio y el grosor salen de geometria(): el generador emite ESTOS
     mismos numeros. La formula esta en datos.js, comentada. */
  case 'arc-gauge': {
    const g = geometria(w), r = g.r, C = 2*Math.PI*r;
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <circle cx="${W/2}" cy="${H/2}" r="${r}" fill="none" stroke="${GR}" stroke-width="${g.grosor}"
        stroke-dasharray="${C*.75} ${C}" transform="rotate(135 ${W/2} ${H/2})" stroke-linecap="round"/>
      <circle cx="${W/2}" cy="${H/2}" r="${r}" fill="none" stroke="${V && V.color || AZ}" stroke-width="${g.grosor}"
        stroke-dasharray="${V ? C*.75*PCT(0)/100 : C*.45} ${C}" transform="rotate(135 ${W/2} ${H/2})" stroke-linecap="round"/>
      </svg>`;
  }
  case 'semicircle-gauge': {
    /* Se apoya en la base de la caja, y el objeto que emite el generador
       se mueve para que su centro caiga justo aqui. Ver datos.js. */
    const g = geometria(w), r = g.r, base = H - g.grosor/2;
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <path d="M ${W/2-r} ${base} A ${r} ${r} 0 0 1 ${W/2+r} ${base}" fill="none" stroke="${GR}" stroke-width="${g.grosor}" stroke-linecap="round"/>
      <path d="M ${W/2-r} ${base} A ${r} ${r} 0 0 1 ${V ? (W/2 - r*Math.cos(Math.PI*PCT(0)/100)).toFixed(2) : W/2+r*.2} ${V ? (base - r*Math.sin(Math.PI*PCT(0)/100)).toFixed(2) : base-r*.95}" fill="none" stroke="${V && V.color || AZ}" stroke-width="${g.grosor}" stroke-linecap="round"/>
      </svg>`;
  }
  case 'chart': {
    if (V && V.series){
      /* las series de verdad: 60 puntos, con el rango de la primera, como lv_chart */
      const v0 = (V.series[0] && V.series[0].v) || {}, lo = Math.round(v0.min ?? 0), hi = Math.round(v0.max ?? 100);
      const linea = d => d.map((y, k) => `${k ? 'L' : 'M'}${(6 + k*(W-12)/59).toFixed(1)},${(H - 4 - (Math.min(hi, Math.max(lo, y)) - lo) / ((hi - lo) || 1) * (H - 8)).toFixed(1)}`).join('');
      return `<svg width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${GR}" rx="5"/>
      ${[.25,.5,.75].map(f=>`<line x1="6" y1="${H*f}" x2="${W-6}" y2="${H*f}" stroke="${BR}"/>`).join('')}
      ${V.series.map((s, i) => s.datos.length > 1 ? `<path d="${linea(s.datos)}" fill="none" stroke="${i ? VE : AZ}" stroke-width="2"/>` : '').join('')}</svg>`;
    }
    let a='',b='';
    for (let i=0;i<=22;i++){ const x=6+i*(W-12)/22;
      a += `${i?'L':'M'}${x.toFixed(1)},${(H*.68-Math.sin(i/2.6)*H*.20).toFixed(1)}`;
      b += `${i?'L':'M'}${x.toFixed(1)},${(H*.52-Math.cos(i/3.4)*H*.13).toFixed(1)}`; }
    return `<svg width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${GR}" rx="5"/>
      ${[.25,.5,.75].map(f=>`<line x1="6" y1="${H*f}" x2="${W-6}" y2="${H*f}" stroke="${BR}"/>`).join('')}
      <path d="${a}" fill="none" stroke="${AZ}" stroke-width="2"/>
      <path d="${b}" fill="none" stroke="${VE}" stroke-width="2"/></svg>`;
  }
  case 'scale': {
    const n = Math.max(5, Math.floor(W/40));
    return `<svg width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${GR}" rx="4"/>
      <line x1="4" y1="${H*.55}" x2="${W-4}" y2="${H*.55}" stroke="${AZ}" stroke-width="2"/>
      ${Array.from({length:n+1},(_,i)=>{const x=4+i*(W-8)/n;const g=i%2===0;
        return `<line x1="${x}" y1="${H*.55}" x2="${x}" y2="${H*(g?.15:.35)}" stroke="${g?AZ:TE}" stroke-width="${g?2:1}"/>`
        + (g?`<text x="${x}" y="${H*.95}" text-anchor="middle" fill="${TE}" font-size="${FT}" font-family="system-ui">${i*10}</text>`:'');
      }).join('')}</svg>`;
  }
  case 'led': { const d = Math.min(W,H);
    return `<div style="width:${d}px;height:${d}px;border-radius:50%;background:${V && !V.on ? GR : (V && V.color || AZ)};
      box-shadow:${V && !V.on ? 'none' : `0 0 ${d*.4}px ${V && V.color || AZ}`}"></div>`; }
  case 'spinner': { const d = Math.min(W,H), r = d/2-4;
    return `<svg width="${d}" height="${d}"><circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none"
      stroke="${BR}" stroke-width="${r*.28}"/><circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none"
      stroke="${AZ}" stroke-width="${r*.28}" stroke-linecap="round"
      stroke-dasharray="${2*Math.PI*r*.28} ${2*Math.PI*r}"/></svg>`; }
  case 'qrcode': { const d = Math.min(W,H), n = 9;
    let c=''; for(let y=0;y<n;y++) for(let x=0;x<n;x++){
      const esq=(x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);
      if (esq ? (x%2===0||y%2===0) : ((x*7+y*13)%3===0))
        c += `<rect x="${4+x*(d-8)/n}" y="${4+y*(d-8)/n}" width="${(d-8)/n}" height="${(d-8)/n}" fill="#111"/>`; }
    return `<svg width="${d}" height="${d}"><rect width="${d}" height="${d}" fill="#fff" rx="3"/>${c}</svg>`; }
  case 'state-strip': {
    const st = V && V.estados ? V.estados : (E.estados.length ? E.estados : ['ESTADO_A','ESTADO_B']);
    return `<div style="display:flex;gap:6px;width:100%;padding:0 6px">${st.map((s,i)=>
      `<div style="flex:1;text-align:center;padding:${H*.16}px 0;border-radius:5px;
       background:${(V ? i !== V.idx : i)?GR:AZ};color:${(V ? i !== V.idx : i)?'#9aa3b2':'#04121f'};font-weight:600;
       font-size:${TX()}px">${T(s)}</div>`).join('')}</div>`;
  }
  case 'button': { const CB = colorBoton(w);
    return `<div style="${caja(V && V.color || CB.fondo, radioBoton(w))};border:1px solid ${V && V.color || CB.borde}${V && V.presionado ? ';filter:brightness(.78)' : ''};display:flex;align-items:center;justify-content:center;
      color:${V && V.colorTexto || CB.texto};font:${LETRA()};${ESTT}">${esc(rotulo(V && V.texto !== undefined ? { ...w, texto: V.texto } : w, x => fuenteEsPropia(FT, VAR) ? x : comoEnPlaca(x)))}</div>`; }
  }
  return '';
}

/* =====================================================================
 * INTERACCION CON EL LIENZO
 * ===================================================================== */
/**
 * Marca la seleccion sin recrear ningun nodo.
 *
 * pintar() reconstruye el lienzo entero, y si eso pasa entre los dos
 * clics de un doble clic el navegador ya no lo dispara: exige que los
 * dos caigan sobre el MISMO elemento. Por eso seleccionar solo cambia
 * clases y, como mucho, el dibujo de dentro.
 */
function refrescarSeleccion(){
  for (const nodo of document.querySelectorAll('.pantalla .w')){
    const dentro = (E.seleccion||[]).includes(nodo.dataset.id);
    const antes  = nodo.classList.contains('sel');
    nodo.classList.toggle('sel', dentro);
    nodo.classList.toggle('multi', dentro && E.seleccion.length > 1);
    /* El Numero grande ensena su enlace solo al estar seleccionado */
    if (antes !== dentro){
      const w = pantalla().widgets.find(x => x.id === nodo.dataset.id);
      if (w) nodo.querySelector('.w-int').innerHTML = dibujo(w);
    }
  }
}

function actualizarNodo(id){
  const w = pantalla().widgets.find(x => x.id === id);
  const n = document.querySelector(`.w[data-id="${id}"]`);
  if (!w || !n) return;
  n.style.left = w.x+'px'; n.style.top = w.y+'px';
  n.style.width = w.w+'px'; n.style.height = w.h+'px';
  n.querySelector('.w-int').innerHTML = dibujo(w);
  const res = n.querySelector('.w-reserva'), nueva = reservaHTML(w);
  if (res) res.outerHTML = nueva || '<i hidden></i>';
  else if (nueva) n.querySelector('.w-int').insertAdjacentHTML('afterend', nueva);
  for (const [c,k] of [['wX','x'],['wY','y'],['wW','w'],['wH','h']]){
    const caja = document.getElementById(c); if (caja) caja.value = w[k];
  }
}

document.getElementById('pantalla').addEventListener('pointerdown', ev => {
  const P = placa();
  const n0 = ev.target.closest('.w');

  /* --- fondo: arrastrar dibuja un rectangulo de seleccion --- */
  if (!n0){
    if (!(ev.ctrlKey || ev.metaKey || ev.shiftKey)){
      limpiarSeleccion(); refrescarSeleccion(); pintarPanel(); pintarCabecera();
    }
    const pant = document.getElementById('pantalla');
    const r0 = pant.getBoundingClientRect();
    const ax = (ev.clientX - r0.x) / escala, ay = (ev.clientY - r0.y) / escala;
    const caja = document.createElement('div');
    caja.className = 'marquesina';
    pant.appendChild(caja);

    const dibujar = e => {
      const bx = (e.clientX - r0.x) / escala, by = (e.clientY - r0.y) / escala;
      const x = Math.min(ax, bx), y = Math.min(ay, by);
      caja.style.cssText += `;left:${x}px;top:${y}px;width:${Math.abs(bx-ax)}px;height:${Math.abs(by-ay)}px`;
      caja._r = { x, y, w: Math.abs(bx-ax), h: Math.abs(by-ay) };
    };
    const soltar = e => {
      document.removeEventListener('pointermove', dibujar);
      document.removeEventListener('pointerup', soltar);
      const r = caja._r; caja.remove();
      let cambio = false;
      if (r && (r.w > 4 || r.h > 4)){
        /* Todo lo que toque el rectangulo, no solo lo que quepa entero:
           es lo que espera cualquiera que venga de un editor de dibujo. */
        for (const w of pantalla().widgets)
          if (w.x < r.x + r.w && w.x + w.w > r.x && w.y < r.y + r.h && w.y + w.h > r.y)
            if (!E.seleccion.includes(w.id)){ seleccionar(w.id, true); cambio = true; }
      }
      /* Un clic suelto en el fondo NO debe repintar: reconstruiria los
         nodos y mataria el doble clic del siguiente widget que toques. */
      if (cambio){ refrescarSeleccion(); pintarPanel(); pintarCabecera(); }
    };
    document.addEventListener('pointermove', dibujar);
    document.addEventListener('pointerup', soltar);
    return;
  }

  /* --- la unidad de un Numero ya seleccionado: se arrastra ella sola ---
     El primer clic selecciona el widget, como siempre; con el widget ya
     seleccionado, pinchar en la unidad y arrastrar la mueve a ella. Lo que
     se mueve son unidadDx / unidadDy: los mismos campos del panel, asi que
     la placa la pone exactamente donde se solto. */
  const parte = ev.target.closest('[data-parte="uni"],[data-parte="rot"]');
  const wUni = parte && pantalla().widgets.find(x => x.id === n0.dataset.id);
  /* la unidad o el rotulo: cada uno con su pareja de campos */
  const [kx, ky] = parte && parte.dataset.parte === 'rot' ? ['rotuloDx', 'rotuloDy'] : ['unidadDx', 'unidadDy'];
  if (wUni && (E.seleccion || []).length === 1 && E.seleccion[0] === wUni.id){
    ev.preventDefault(); ev.stopPropagation();
    HIST.iniciar();
    const C = COMPONENTES[wUni.tipo];
    const dx0 = Number(wUni[kx]) || 0, dy0 = Number(wUni[ky]) || 0, sx = ev.clientX, sy = ev.clientY;
    /* cuanto corre la disposicion todo para que la unidad no se salga */
    const corrimiento = () => { if (!C.disposicion) return { x: 0, y: 0 };   /* la tarjeta no se corre: su rotulo va dentro */
      const D = C.disposicion(wUni, C.partes(wUni), C.muestra(wUni)); return { x: D.offX, y: D.offY }; };
    let movido = false, off = corrimiento();
    const mover = e => {
      const ddx = Math.round((e.clientX - sx) / escala), ddy = Math.round((e.clientY - sy) / escala);
      if (!movido && Math.abs(ddx) + Math.abs(ddy) < 3) return;   /* un clic que tiembla no es un arrastre */
      movido = true;
      wUni[kx] = dx0 + ddx; wUni[ky] = dy0 + ddy;
      /* Si la unidad sale por la izquierda o por arriba, todo se corre para
         que quepa: en una caja cenida se mueve la caja lo mismo al reves,
         y el numero se queda quieto en la pantalla mientras arrastras. */
      const o = corrimiento();
      if (wUni.auto){ wUni.x -= o.x - off.x; wUni.y -= o.y - off.y; }
      off = o;
      if (wUni.auto) normalizarAuto();
      pintarLienzo();
    };
    const soltar = () => {
      document.removeEventListener('pointermove', mover);
      document.removeEventListener('pointerup', soltar);
      if (!movido) return;
      if (!wUni[kx]) delete wUni[kx];
      if (!wUni[ky]) delete wUni[ky];
      pintar();                 /* ahora si: el panel ensena los numeros nuevos */
    };
    document.addEventListener('pointermove', mover);
    document.addEventListener('pointerup', soltar);
    return;
  }

  const id = n0.dataset.id;
  const dir = ev.target.classList.contains('tirador') ? ev.target.dataset.dir : null;
  const w = pantalla().widgets.find(x => x.id === id);
  const x0 = ev.clientX, y0 = ev.clientY, W0 = {...w};
  /* una linea puede ser tan fina como se quiera: 1 px es una linea */
  const MIN_W = w && w.tipo === 'line' ? 1 : 24, MIN_H = w && w.tipo === 'line' ? 1 : 20;
  /* y su grosor va de pixel en pixel: con la rejilla saltaria de 1 a 4 */
  const aj = w && w.tipo === 'line' ? Math.round : ajusta;

  /* pintar() reconstruye el lienzo y destruye n0, asi que va ANTES de
     montar el arrastre. Nada de setPointerCapture: sobre un nodo ya
     desconectado lanza y se lleva por delante el resto del manejador. */
  HIST.iniciar();          /* un solo paso para todo el gesto */
  const aditivo = ev.ctrlKey || ev.metaKey || ev.shiftKey;
  const yaDentro = (E.seleccion||[]).includes(id);
  if (aditivo || !yaDentro){
    seleccionar(id, aditivo);
    refrescarSeleccion();   /* NO pintar(): destruiria el nodo del doble clic */
    pintarPanel();          /* el panel si puede reconstruirse, esta fuera */
    pintarCabecera();
  }
  /* Si ya estaba dentro de una seleccion multiple, NO se colapsa: se
     arrastra el grupo entero, que es justo para lo que se selecciono. */

  /* Se mueve todo el grupo; se redimensiona solo el principal */
  const grupo = widgetsSel().map(g => ({ g, x0: g.x, y0: g.y }));

  /* Un clic simple tambien pasa por aqui. Hasta que el puntero no se
     aleja del UMBRAL no es un arrastre: un raton real tiembla uno o dos
     pixeles al pulsar, y sin este margen cada clic contaria como
     arrastre, repintaria el lienzo y se cargaria el doble clic. */
  const UMBRAL = 4;
  let hubo = false;

  const mover = e => {
    if (!hubo && Math.abs(e.clientX-x0) < UMBRAL && Math.abs(e.clientY-y0) < UMBRAL) return;
    hubo = true;
    const dx = (e.clientX-x0)/escala, dy = (e.clientY-y0)/escala;

    if (!dir){
      /* El tope se calcula sobre el grupo entero, para que al chocar con
         un borde no se deforme la figura: se para todo a la vez. */
      const ddx = ajusta(dx), ddy = ajusta(dy);
      let lim_dx = ddx, lim_dy = ddy;
      for (const {g, x0:gx, y0:gy} of grupo){
        lim_dx = Math.max(Math.min(lim_dx, P.ancho - g.w - gx), -gx);
        lim_dy = Math.max(Math.min(lim_dy, P.alto  - g.h - gy), -gy);
      }
      for (const {g, x0:gx, y0:gy} of grupo){
        g.x = gx + lim_dx; g.y = gy + lim_dy;
        actualizarNodo(g.id);
      }
      return;
    }

    /* Redimensionar. Los lados norte y oeste mueven el origen ademas del
       tamano: al tirar del borde izquierdo, x baja y w sube. El tope no
       es solo el minimo, tambien el borde opuesto, para que el widget no
       se de la vuelta al pasarte. */
    /* Caja ceñida: el tirador no estira la caja, elige el tamano de
       letra. La caja viene detras sola, que es la unica forma de que
       siga pegada al texto mientras la arrastras. */
    if (w.auto && AUTOAJUSTABLES.has(w.tipo)){
      const vert = dir.includes('n') || dir.includes('s');
      const libre = tipoLibre(varianteFuente(w));
      const alto = Math.max(8, dir.includes('s') ? W0.h + dy : W0.h - dy);
      const px = vert
        ? (libre ? fuenteLibrePorAlto(w, alto) : fuentePorAlto(alto))
        : fuentePorAncho(w, Math.max(8, dir.includes('e') ? W0.w + dx : W0.w - dx));
      w.estilo = w.estilo || {};
      w.estilo.fuente = px;
      const t = tamanoAuto(w);
      w.w = Math.min(t.w, P.ancho); w.h = Math.min(t.h, P.alto);
      /* Anclar el borde contrario al que arrastras, o el widget se
         escapa hacia arriba o hacia la izquierda al crecer. */
      w.x = Math.max(0, Math.min(dir.includes('w') ? W0.x + W0.w - w.w : W0.x, P.ancho - w.w));
      w.y = Math.max(0, Math.min(dir.includes('n') ? W0.y + W0.h - w.h : W0.y, P.alto  - w.h));
      actualizarNodo(id);
      const pie = document.getElementById('pieMarco');
      pie.textContent = `${w.nombre} · Montserrat ${px} px · ${w.w}×${w.h}`;
      return;
    }

    if (dir.includes('e'))
      w.w = Math.max(MIN_W, Math.min(aj(W0.w+dx), P.ancho-W0.x));
    if (dir.includes('s'))
      w.h = Math.max(MIN_H, Math.min(aj(W0.h+dy), P.alto -W0.y));
    if (dir.includes('w')){
      const nx = Math.max(0, Math.min(aj(W0.x+dx), W0.x+W0.w-MIN_W));
      w.w = W0.x + W0.w - nx; w.x = nx;
    }
    if (dir.includes('n')){
      const ny = Math.max(0, Math.min(aj(W0.y+dy), W0.y+W0.h-MIN_H));
      w.h = W0.y + W0.h - ny; w.y = ny;
    }
    /* Proporción fija: el otro lado sigue al que arrastras. En una
       esquina manda el que más ha cambiado. */
    const R = PROPORCION[w.tipo];
    if (R){
      const hor = dir.includes('e') || dir.includes('w'), ver = dir.includes('n') || dir.includes('s');
      if (hor && (!ver || w.w / W0.w >= w.h / W0.h)) w.h = Math.max(MIN_H, Math.round(w.w / R));
      else w.w = Math.max(MIN_W, Math.round(w.h * R));
      const k = Math.min(1, P.ancho / w.w, P.alto / w.h);
      if (k < 1){ w.w = Math.floor(w.w * k); w.h = Math.floor(w.h * k); }
      w.x = Math.max(0, Math.min(dir.includes('w') ? W0.x + W0.w - w.w : W0.x, P.ancho - w.w));
      w.y = Math.max(0, Math.min(dir.includes('n') ? W0.y + W0.h - w.h : W0.y, P.alto  - w.h));
    }
    actualizarNodo(id);
  };
  const soltar = () => {
    document.removeEventListener('pointermove', mover);
    document.removeEventListener('pointerup', soltar);
    HIST.confirmar();
    /* Repintar aqui tras un clic simple destruye el nodo entre los dos
       clics de un doble clic, y el navegador exige el MISMO elemento en
       los dos para dispararlo. Resultado: el doble clic deja de existir
       y no hay ningun error que lo delate. Solo se repinta si hubo
       arrastre de verdad. */
    if (hubo){ pintarLienzo(); pintarPanel(); }
  };
  document.addEventListener('pointermove', mover);
  document.addEventListener('pointerup', soltar);
});

/* =====================================================================
 * EDICION DEL TEXTO SOBRE EL PROPIO LIENZO
 *
 * Doble clic sobre un widget con texto y se escribe ahi mismo, en vez de
 * ir al panel de la derecha. La caja se monta DENTRO de .pantalla, asi
 * que hereda el mismo scale() y cae justo encima del widget.
 * ===================================================================== */
const EDITABLES = new Set(['label','button','checkbox','dropdown','textarea','value','lectura','tiempo']);

/**
 * Un unico sitio donde se aplica un cambio de estilo a un widget.
 *
 * Lo usan las tres entradas: el panel de Diseno, la pestana Estilo y el
 * menu del boton derecho. Si cada una lo hiciera por su cuenta acabarian
 * divergiendo.
 */
function aplicarEstilo(w, clave, valor){
  if (!w) return;
  HIST.iniciar();
  w.estilo = w.estilo || {};
  if (clave === 'fuente'){
    if (valor) w.estilo.fuente = +valor; else delete w.estilo.fuente;
  } else w.estilo[clave] = valor;
  pintarLienzo();
}

/* Etiquetas y valor heredado de cada ajuste, para pintar los controles */
/* El selector de iconos: una rejilla por temas con buscador. Devuelve la
   clave elegida, '' para quitarlo, o null si se cancela. */
async function elegirIcono(actual, quitable = true){
  const celda = (k, cp, et) => `<button type="button" class="ico-celda${k === actual ? ' activo' : ''}" data-dlg-valor="${k}"
      data-busca="${esc((et + ' ' + k).toLowerCase())}" title="${esc(et)}"><b>${String.fromCodePoint(cp)}</b>${esc(et)}</button>`;
  const grupos = [...new Set(ICONOS_FA.map(i => i.g))];
  const lvgl = Object.entries(SIMBOLOS).filter(([k]) => k && CP_SIMBOLO_LVGL[k]);
  const cuerpo = `<input class="ico-busca" type="search" placeholder="${t('Buscar: temperatura, presión, gota…')}">`
    + `<div class="ico-grupo">${t('Los de LVGL (no hace falta generar fuente)')}</div><div class="ico-rejilla">${
        lvgl.map(([k, v]) => celda(k, CP_SIMBOLO_LVGL[k], t(v.et))).join('')}</div>`
    + grupos.map(g => `<div class="ico-grupo">${esc(t(g))}</div><div class="ico-rejilla">${
        ICONOS_FA.filter(i => i.g === g).map(i => celda(i.k, i.cp, t(i.et))).join('')}</div>`).join('');
  return dialogo({ titulo: t('Elige un icono'), tipo: 'info', ancho: 640, cuerpo,
    botones: [...(quitable ? [{ et: t('Sin icono'), valor: '' }] : []), { et: t('Cancelar'), valor: null, cancela: true }],
    alAbrir: f => {
      const q = f.querySelector('.ico-busca');
      q.addEventListener('input', () => {
        const v = q.value.trim().toLowerCase();
        f.querySelectorAll('.ico-celda').forEach(c => { c.style.display = !v || c.dataset.busca.includes(v) ? '' : 'none'; });
        f.querySelectorAll('.ico-rejilla').forEach(r => { const hay = [...r.children].some(c => c.style.display !== 'none');
          r.style.display = hay ? '' : 'none'; r.previousElementSibling.style.display = hay ? '' : 'none'; });
      });
      setTimeout(() => (f.querySelector('.ico-celda.activo') || q).scrollIntoView({ block: 'center' }), 0);
    } });
}

/* El radio de las esquinas de un boton: el suyo, o el del tema */
const radioBoton = w => { const r = ((w && w.estilo) || {}).radio; return (r === undefined || r === '') ? (E.tema.radio ?? 6) : Math.max(0, +r); };

/* LA lista de colores que se le pueden cambiar a un elemento. La usan el
   panel de Estilo y el menu del boton derecho; no hay otra. Cada campo
   dice de que color del tema hereda (de), para que se vea la relacion:
   si no se toca aqui, manda ese color del tema. */
function camposEstilo(w){
  const comp = COLORES_COMPONENTE[w.tipo];
  const aviso = CON_CONSIGNA.has(w.tipo) && w.marca === false ? t('oculta (se muestra en Diseño)') : '';
  const e0 = w.estilo || {};
  if (comp) return comp.map(([k, et, base]) => ({ k, et, her: base ? (e0[base] || E.tema[base]) : E.tema[k], de: nombreColorTema(base || k),
    aviso: k === 'ok' ? aviso : '' }));
  const S = est(w), b = w.tipo === 'button' ? colorBoton({ ...w, estilo: {} }) : null;
  /* en un boton, "color" es su fondo y el de partida es el de su clase */
  const et  = { color: b ? 'Fondo' : 'Acento', fondo:'Fondo', borde:'Borde', texto:'Texto' };
  const her = { color: b ? b.fondo : S.acento, fondo:S.sup, borde:S.borde, texto: b ? b.texto : S.texto };
  const de  = { color: b ? t('su clase de botón') : nombreColorTema('acento'), fondo: nombreColorTema('superficie'),
                borde: nombreColorTema('borde'), texto: b ? t('su clase de botón') : nombreColorTema('texto') };
  return estilosDe(w.tipo).filter(k => k !== 'fuente').map(k => ({ k, et:et[k], her:her[k], de:de[k] }));
}
/* "Pista", "Acento"...: como se llama ese color en la pestana Estilo */
function nombreColorTema(k){
  const f = GRUPOS_TEMA.flatMap(([, l]) => l).find(([c]) => c === k);
  return f ? t(f[1]) : k;
}
/* Una fila de color de un elemento: el selector, su nombre, de donde
   hereda y el hexadecimal. Igual en el panel y en el menu contextual. */
function filaColorWidget(c, e, attr){
  return `<div class="color-fila"><input type="color" data-${attr}="${c.k}" value="${e[c.k] || c.her}">
    <span class="et">${esc(t(c.et))}<small${c.aviso ? ' class="aviso"' : ''}>${c.aviso ? esc(c.aviso) : e[c.k] ? t('propio de este elemento') : t('del tema') + ': ' + esc(c.de)}</small></span>
    <input type="text" data-${attr}hex="${c.k}" value="${e[c.k] || ''}" placeholder="${c.her}" spellcheck="false"></div>`;
}

/* =====================================================================
 * MENU DEL BOTON DERECHO
 * ===================================================================== */
function cerrarMenuCtx(){
  const m = document.querySelector('.menu-ctx');
  if (m) m.remove();
}

/* ORDEN DE CAPAS: lo que va despues en la lista se dibuja encima, en el
   lienzo y en la placa (LVGL crea los objetos en ese orden). Con varios
   seleccionados se mueven juntos y sin cambiar su orden entre ellos. */
function ordenarCapas(ids, modo){
  const L = pantalla().widgets, S = new Set(ids);
  if (!L.some(w => S.has(w.id))) return;
  HIST.iniciar();
  if (modo === 'frente' || modo === 'fondo'){
    const dentro = L.filter(w => S.has(w.id)), fuera = L.filter(w => !S.has(w.id));
    pantalla().widgets = modo === 'frente' ? [...fuera, ...dentro] : [...dentro, ...fuera];
  } else if (modo === 'subir'){
    for (let i = L.length - 2; i >= 0; i--) if (S.has(L[i].id) && !S.has(L[i + 1].id)) [L[i], L[i + 1]] = [L[i + 1], L[i]];
  } else {
    for (let i = 1; i < L.length; i++) if (S.has(L[i].id) && !S.has(L[i - 1].id)) [L[i], L[i - 1]] = [L[i - 1], L[i]];
  }
  pintar();
}
/* Hasta donde puede ir: si ya esta arriba del todo, "traer" no hace nada */
function capasPosibles(ids){
  const L = pantalla().widgets, S = new Set(ids), n = L.filter(w => S.has(w.id)).length;
  const i = L.map(w => S.has(w.id));
  return { arriba: i.slice(L.length - n).some(x => !x), abajo: i.slice(0, n).some(x => !x) };
}

/* Letra y tamano de una parte de un componente (el rotulo, la unidad):
   vacio = la de siempre, que sale del tema y del numero */
function letraDeParte(w, k, papel){
  const e = w.estilo || {}, C = COMPONENTES[w.tipo], P = C.partes(w)[k];
  const delTema = (E.tema.tipografia || {})[papel] || 'medium';
  return `<div class="fila">
      <label class="campo"><span>${t('Letra')}</span><select data-letraparte="tipo_${k}">
        <option value="">${t('La del tema')} (${esc(t((TIPOS[delTema] || TIPOS.medium).nombre))})</option>${
        Object.entries(TIPOS).map(([v, T]) => `<option value="${v}"${e['tipo_' + k] === v ? ' selected' : ''}>${esc(t(T.nombre))}</option>`).join('')}</select></label>
      <label class="campo" style="max-width:90px"><span>${t('Tamaño')}</span><input type="number" data-letraparte="fuente_${k}" min="8" max="360" step="1"
        value="${e['fuente_' + k] ?? ''}" placeholder="${P.px}"></label>
    </div>`;
}

function abrirMenuCtx(w, x, y){
  cerrarMenuCtx();
  const m = document.createElement('div');
  m.className = 'menu-ctx';

  const campos = camposEstilo(w);
  const e = w.estilo || {};
  /* el orden se aplica a toda la seleccion si el clic cae en ella */
  const idsCapa = (E.seleccion || []).includes(w.id) ? E.seleccion.slice() : [w.id];
  const capas = capasPosibles(idsCapa);
  m.innerHTML =
    `<h4>Estilo de <b>${esc(w.nombre)}</b></h4>` +
    (campos.length
      ? `<div class="colores">${campos.map(c => filaColorWidget(c, e, 'ctx')).join('')}</div>`
      : `<div class="vacio">Este widget no tiene colores propios.</div>`) +
    (estilosDe(w.tipo).includes('fuente')
      ? `<label class="campo" style="margin-top:9px"><span>${t('Tamaño de letra')}</span>
          <select data-ctx="fuente"><option value="">Heredado (${E.tema.fuente} px)</option>${
            TODAS_FUENTES.map(f => `<option value="${f}"${e.fuente===f?' selected':''}>Montserrat ${f} px</option>`).join('')
          }</select></label>`
      : '') +
    `<div class="sep"></div>` +
    (Object.keys(e).length ? `<button class="acc" data-ctxacc="heredar">Volver a heredar del tema</button>` : '') +
    (EDITABLES.has(w.tipo) ? `<button class="acc" data-ctxacc="texto">Editar el texto…</button>` : '') +
    (HOLGURA[w.tipo] ? `<button class="acc" data-ctxacc="ajustar">Ajustar al texto</button>` : '') +
    `<div class="sep"></div><div class="capas">` +
      `<button class="acc" data-ctxacc="frente"${capas.arriba ? '' : ' disabled'}><i>⤒</i>${t('Traer al frente')}</button>` +
      `<button class="acc" data-ctxacc="fondo"${capas.abajo ? '' : ' disabled'}><i>⤓</i>${t('Enviar al fondo')}</button>` +
      `<button class="acc" data-ctxacc="subir"${capas.arriba ? '' : ' disabled'}><i>↑</i>${t('Traer adelante')}</button>` +
      `<button class="acc" data-ctxacc="bajar"${capas.abajo ? '' : ' disabled'}><i>↓</i>${t('Enviar atrás')}</button>` +
    `</div><div class="sep"></div>` +
    `<button class="acc" data-ctxacc="duplicar">Duplicar</button>` +
    `<button class="acc peligro" data-ctxacc="borrar">Borrar</button>`;

  document.body.appendChild(m);

  /* Que no se salga de la ventana */
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth  - r.width  - 8) + 'px';
  m.style.top  = Math.min(y, innerHeight - r.height - 8) + 'px';

  /* Los input de color disparan 'input' sin parar mientras se arrastra;
     aqui solo se refresca el lienzo, nunca se reconstruye este menu. */
  m.querySelectorAll('[data-ctx]').forEach(i => i.addEventListener('input', () => {
    aplicarEstilo(w, i.dataset.ctx, i.value);
    const hex = m.querySelector(`[data-ctxhex="${i.dataset.ctx}"]`);
    if (hex) hex.value = i.value;
  }));
  m.querySelectorAll('[data-ctxhex]').forEach(i => i.addEventListener('change', () => {
    const k = i.dataset.ctxhex, v = i.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)){
      aplicarEstilo(w, k, v.toLowerCase());
      const col = m.querySelector(`[data-ctx="${k}"]`);
      if (col) col.value = v.toLowerCase();
    } else i.value = (w.estilo && w.estilo[k]) || '';
  }));

  m.querySelectorAll('[data-ctxacc]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.ctxacc;
    cerrarMenuCtx();
    if (a === 'heredar'){ delete w.estilo; pintar(); }
    if (a === 'texto')   editarTextoEnSitio(w);
    if (a === 'ajustar'){ HIST.iniciar(); ajustarAlTexto(w); pintar(); }
    if (a === 'duplicar'){ portapapeles = JSON.parse(JSON.stringify(w)); pegar(); }
    if (['frente', 'fondo', 'subir', 'bajar'].includes(a)) ordenarCapas(idsCapa, a);
    if (a === 'borrar'){
      pantalla().widgets = pantalla().widgets.filter(x => x.id !== w.id);
      limpiarSeleccion(); pintar();
    }
  }));

  /* Cerrar al pinchar fuera o con Escape */
  setTimeout(() => {
    const fuera = ev => { if (!m.contains(ev.target)){ cerrarMenuCtx(); document.removeEventListener('pointerdown', fuera); } };
    document.addEventListener('pointerdown', fuera);
  }, 0);
}

/* ZOOM: los botones de la barra y Ctrl+rueda sobre el lienzo */
document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.zoom === 'ajustar'){ ZOOM = null; pintarLienzo(); }
  else pasoZoom(b.dataset.zoom === '+' ? 1 : -1);
}));
document.getElementById('zona').addEventListener('wheel', ev => {
  if (!ev.ctrlKey) return;
  ev.preventDefault();
  pasoZoom(ev.deltaY < 0 ? 1 : -1);
}, { passive: false });

/* SOLTAR DESDE LA PALETA. Durante el arrastre solo se mueve el recuadro
   (.fantasma-drop): nada de pintar() hasta soltar. */
let arrastrandoTipo = null;
function puntoEnPantalla(ev){
  const r = document.getElementById('pantalla').getBoundingClientRect(), P = placa();
  return { x: Math.max(0, Math.min(P.ancho, (ev.clientX - r.left) / escala)),
           y: Math.max(0, Math.min(P.alto,  (ev.clientY - r.top)  / escala)) };
}
function quitarFantasma(){
  document.getElementById('fantasmaDrop')?.remove();
  document.getElementById('zona').classList.remove('soltando');
}
document.getElementById('zona').addEventListener('dragover', ev => {
  if (!arrastrandoTipo || E.pestana !== 'diseno') return;
  ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy';
  const pant = document.getElementById('pantalla'), P = placa(), tm = tamanoNuevo(arrastrandoTipo), c = puntoEnPantalla(ev);
  let g = document.getElementById('fantasmaDrop');
  if (!g){ g = document.createElement('div'); g.id = 'fantasmaDrop'; g.className = 'fantasma-drop'; pant.appendChild(g); }
  g.style.left = ajusta(Math.max(0, Math.min(P.ancho - tm.w, c.x - tm.w / 2))) + 'px';
  g.style.top  = ajusta(Math.max(0, Math.min(P.alto  - tm.h, c.y - tm.h / 2))) + 'px';
  g.style.width = tm.w + 'px'; g.style.height = tm.h + 'px';
  document.getElementById('zona').classList.add('soltando');
});
document.getElementById('zona').addEventListener('dragleave', ev => {
  if (!ev.relatedTarget || !document.getElementById('zona').contains(ev.relatedTarget)) quitarFantasma();
});
document.getElementById('zona').addEventListener('drop', ev => {
  if (!arrastrandoTipo) return;
  ev.preventDefault();
  const tipo = arrastrandoTipo, c = puntoEnPantalla(ev);
  arrastrandoTipo = null; quitarFantasma();
  anadirWidget(tipo, c);
});

document.getElementById('pantalla').addEventListener('contextmenu', ev => {
  const nodo = ev.target.closest('.w');
  if (!nodo) return;
  ev.preventDefault();
  const w = pantalla().widgets.find(x => x.id === nodo.dataset.id);
  if (!w) return;
  if (!E.seleccion.includes(w.id)) seleccionar(w.id, false);
  pintar();
  abrirMenuCtx(w, ev.clientX, ev.clientY);
});

function editarTextoEnSitio(w){
  if (document.querySelector('.editor-texto')) return;

  /* La caja se pone EXACTAMENTE donde y como esta el widget, con su
     misma letra: asi se escribe sobre el diseno en vez de sobre un
     cuadro flotante que tapa lo de al lado. */
  const px = fuenteEfectiva(w);
  const caja = document.createElement('input');
  caja.className = 'editor-texto';
  /* Un Numero grande no guarda texto: guarda el valor de ejemplo. Se
     edita ese, que es lo unico suyo que se puede escribir. */
  const editaValor = w.tipo === 'value' || ((w.tipo === 'lectura' || w.tipo === 'tiempo') && !w.texto);
  caja.value = editaValor ? muestraTexto(w) : (w.texto || '');
  caja.style.left   = w.x + 'px';
  caja.style.top    = w.y + 'px';
  caja.style.width  = Math.max(60, w.w) + 'px';
  caja.style.height = Math.max(altoLineaDe(px, varianteFuente(w)), w.h) + 'px';
  caja.style.font   = letraCSS(varianteFuente(w), px);
  caja.style.color  = est(w).texto;
  document.getElementById('pantalla').appendChild(caja);
  caja.focus(); caja.select();

  let cerrado = false;
  const cerrar = guardar => {
    if (cerrado) return;        /* blur + Enter llegan los dos */
    cerrado = true;
    if (guardar){
      if (editaValor && w.tipo === 'tiempo'){
        /* mm:ss (o solo segundos) */
        const m = caja.value.trim().match(/^(\d+)(?::(\d{1,2}))?$/);
        if (m){ HIST.iniciar(); w.ejemplo = m[2] !== undefined ? (+m[1]) * 60 + (+m[2]) : +m[1]; }
      } else if (editaValor){
        /* Lo que escribas MANDA: el numero es el ejemplo y las cifras que
           pongas detras del punto fijan los decimales. Asi lo que tecleas
           es literalmente lo que se ve, sin tener que tocar otro campo. */
        const txt = caja.value.trim().replace(',', '.');
        const num = parseFloat(txt);
        if (isFinite(num)){
          const pt = txt.indexOf('.');
          const dec = pt >= 0 ? Math.min(3, txt.length - pt - 1) : 0;
          if (num !== (w.ejemplo ?? 0) || dec !== (w.decimales ?? 1)){
            HIST.iniciar(); w.ejemplo = num; w.decimales = dec;
          }
        }
      } else if (caja.value !== (w.texto || '')){
        HIST.iniciar(); w.texto = caja.value;
      }
    }
    caja.remove();
    pintar();
  };

  /* stopPropagation es imprescindible: si no, el Supr de dentro de la
     caja borraria el widget, y el clic empezaria un arrastre. */
  caja.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter'){  e.preventDefault(); cerrar(true);  }
    if (e.key === 'Escape'){ e.preventDefault(); cerrar(false); }
  });
  caja.addEventListener('pointerdown', e => e.stopPropagation());
  caja.addEventListener('blur', () => cerrar(true));
}

document.getElementById('pantalla').addEventListener('dblclick', ev => {
  const nodo = ev.target.closest('.w');
  if (!nodo) return;
  const w = pantalla().widgets.find(x => x.id === nodo.dataset.id);
  if (!w) return;
  /* Avisar UNA vez de que en un Numero grande lo que se edita es el
     ejemplo, no lo que se vera en la placa. */
  if (w.tipo === 'value' || ((w.tipo === 'lectura' || w.tipo === 'tiempo') && !w.texto)){
    const pie = document.getElementById('pieMarco'), antes = pie.textContent;
    pie.textContent = 'Estás editando el valor de EJEMPLO. En la placa lo escribe la variable enlazada.';
    setTimeout(() => { pie.textContent = antes; }, 4000);
  }

  if (!EDITABLES.has(w.tipo)){
    /* No tiene texto propio, asi que el doble clic hace lo otro que uno
       espera de el: abrir su paleta. */
    E.pestana = 'estilo';
    document.querySelectorAll('.pestanas button').forEach(x => x.classList.toggle('activa', x.dataset.t === 'estilo'));
    pintarPanel();
    document.getElementById('panel').scrollTop = 0;
    return;
  }
  editarTextoEnSitio(w);
});

/* =====================================================================
 * PORTAPAPELES Y TECLADO
 * ===================================================================== */
let portapapeles = null;

/* Un nombre que no choque con ninguno de ninguna pantalla: los nombres
   acaban siendo identificadores C, y dos iguales no compilan. */
function nombreLibre(base){
  const usados = new Set(E.pantallas.flatMap(s => s.widgets.map(w => w.nombre)));
  const raiz = base.replace(/_\d+$/, '');
  if (!usados.has(base)) return base;
  let i = 2;
  while (usados.has(raiz + '_' + i)) i++;
  return raiz + '_' + i;
}

/* =====================================================================
 * ALINEAR
 *
 * Con varios seleccionados, es lo que uno quiere hacer el 90 % de las
 * veces. `principal` (el ultimo tocado) manda: los demas se le alinean,
 * que es mas predecible que usar el borde del conjunto.
 * ===================================================================== */
function alinear(modo){
  const sel = widgetsSel();
  if (sel.length < 2) return;
  HIST.iniciar();
  const ref = widgetSel();
  for (const w of sel){
    if (w === ref) continue;
    if (modo === 'izq')    w.x = ref.x;
    if (modo === 'der')    w.x = ref.x + ref.w - w.w;
    if (modo === 'centro') w.x = ajusta(ref.x + ref.w/2 - w.w/2);
    if (modo === 'arriba') w.y = ref.y;
    if (modo === 'abajo')  w.y = ref.y + ref.h - w.h;
    if (modo === 'medio')  w.y = ajusta(ref.y + ref.h/2 - w.h/2);
  }
  pintar();
}

/* Repartir el hueco a partes iguales entre el primero y el ultimo */
function distribuir(eje){
  const sel = widgetsSel();
  if (sel.length < 3) return;
  HIST.iniciar();
  const k = eje === 'h' ? 'x' : 'y', t = eje === 'h' ? 'w' : 'h';
  const o = [...sel].sort((a,b) => a[k] - b[k]);
  const ini = o[0][k], fin = o[o.length-1][k] + o[o.length-1][t];
  const ocupado = o.reduce((n,w) => n + w[t], 0);
  const hueco = (fin - ini - ocupado) / (o.length - 1);
  let cur = ini;
  for (const w of o){ w[k] = ajusta(cur); cur += w[t] + hueco; }
  pintar();
}

function copiarSel(){
  const sel = widgetsSel();
  if (!sel.length) return false;
  portapapeles = JSON.parse(JSON.stringify(sel));
  return true;
}

function pegar(){
  if (!portapapeles || !portapapeles.length) return;
  HIST.iniciar();
  const P = placa();
  const nuevos = [];
  for (const orig of portapapeles){
    const w = JSON.parse(JSON.stringify(orig));
    w.id = 'w' + (E.contador++);
    w.nombre = nombreLibre(orig.nombre);
    w.w = Math.min(w.w, P.ancho); w.h = Math.min(w.h, P.alto);
    /* Todos se desplazan lo mismo: la figura del grupo se conserva */
    w.x = Math.max(0, Math.min(ajusta(w.x + 16), P.ancho - w.w));
    w.y = Math.max(0, Math.min(ajusta(w.y + 16), P.alto  - w.h));
    pantalla().widgets.push(w);
    nuevos.push(w.id);
    orig.x = w.x; orig.y = w.y;   /* para que pegar otra vez escalone */
  }
  E.seleccion = nuevos;
  E.sel = nuevos[nuevos.length-1];
  pintar();
}

function mover(dx, dy){
  const sel = widgetsSel();
  if (!sel.length) return;
  const P = placa();
  /* Igual que al arrastrar: el tope es del grupo, no de cada uno */
  let ldx = dx, ldy = dy;
  for (const w of sel){
    ldx = Math.max(Math.min(ldx, P.ancho - w.w - w.x), -w.x);
    ldy = Math.max(Math.min(ldy, P.alto  - w.h - w.y), -w.y);
  }
  for (const w of sel){ w.x += ldx; w.y += ldy; actualizarNodo(w.id); }
}

document.addEventListener('keydown', e => {
  /* ?. porque el destino puede ser el propio document, que no tiene matches() */
  if (e.target?.matches?.('input,select,textarea')) return;
  const ctrl = e.ctrlKey || e.metaKey;

  if (ctrl && e.key.toLowerCase() === 'z' && !e.shiftKey){ HIST.deshacer(); e.preventDefault(); return; }
  if (ctrl && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))){
    HIST.rehacer(); e.preventDefault(); return;
  }
  if (ctrl && e.key.toLowerCase() === 'c'){ if (copiarSel()) e.preventDefault(); return; }
  if (ctrl && e.key.toLowerCase() === 'v'){ pegar(); e.preventDefault(); return; }
  if (ctrl && e.key.toLowerCase() === 'd'){ if (copiarSel()) pegar(); e.preventDefault(); return; }

  if (ctrl && e.key.toLowerCase() === 'a'){
    E.seleccion = pantalla().widgets.map(w => w.id);
    E.sel = E.seleccion[E.seleccion.length-1] || null;
    pintar(); e.preventDefault(); return;
  }

  if ((e.key === 'Delete' || e.key === 'Backspace') && E.seleccion.length){
    HIST.iniciar();
    const fuera = new Set(E.seleccion);
    pantalla().widgets = pantalla().widgets.filter(w => !fuera.has(w.id));
    limpiarSeleccion(); pintar(); e.preventDefault(); return;
  }

  /* Flechas: colocar al pixel sin pelearse con el raton */
  if (E.seleccion.length && e.key.startsWith('Arrow')){
    HIST.iniciar();
    const paso = e.shiftKey ? 1 : REJ;
    if (e.key === 'ArrowLeft')  mover(-paso, 0);
    if (e.key === 'ArrowRight') mover( paso, 0);
    if (e.key === 'ArrowUp')    mover(0, -paso);
    if (e.key === 'ArrowDown')  mover(0,  paso);
    HIST.confirmarLuego();    /* pulsaciones seguidas = un solo paso */
    e.preventDefault();
  }

  /* F2 tambien abre la edicion en sitio, como en un explorador */
  if (e.key === 'F2' && E.sel){
    const w = widgetSel();
    if (w && EDITABLES.has(w.tipo)){ editarTextoEnSitio(w); e.preventDefault(); }
  }
});

/* Lo largo se resume a dos lineas con «Ver más». No se quita nada: se
   abre en su sitio, sin repintar, y se recuerda por su comienzo (el panel
   se repinta a menudo). Los errores no se resumen: tienen que leerse.
   Tampoco lo que lleva campos o bloques dentro: ya tiene su estructura. */
const TEXTOS_ABIERTOS = new Set();
function resumirTextos(){
  for (const el of document.querySelectorAll('#panel .nota:not(.error), #panel .regla, #inspector .nota:not(.error), #inspector .regla, #simBanco .sim-nota')){
    if (el.classList.contains('resumible')) continue;
    if (el.querySelector('input,select,textarea,button,div,ul,ol,p,table,pre')) continue;
    const txt = (el.textContent || '').trim();
    if (txt.length < 150) continue;
    const clave = txt.slice(0, 80);
    el.classList.add('resumible');
    /* en una nota se recorta su texto, no la caja (el relleno dejaria ver
       media linea mas), y el boton queda dentro */
    if (el.classList.contains('nota')){
      const sp = document.createElement('span'); sp.className = 'nota-txt';
      while (el.firstChild) sp.appendChild(el.firstChild);
      el.appendChild(sp);
    }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mas';
    const poner = ab => { el.classList.toggle('abierto', ab); b.textContent = ab ? t('Ver menos') : t('Ver más'); b.setAttribute('aria-expanded', ab); };
    poner(TEXTOS_ABIERTOS.has(clave));
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      const ab = !el.classList.contains('abierto');
      if (ab) TEXTOS_ABIERTOS.add(clave); else TEXTOS_ABIERTOS.delete(clave);
      poner(ab);
    });
    if (el.classList.contains('nota')) el.appendChild(b); else el.after(b);
  }
}

/* Las secciones plegables recuerdan si estaban abiertas. Es estado de la
   interfaz (como accAbierto): no va en E, ni en el .json, ni en deshacer.
   Las de esta lista empiezan cerradas. */
const SEC_CERRADAS = new Set(['plantillas', 'proyecto-sel', 'est-botones', 'est-tipo', 'est-export', 'hw-ide', 'lg-recetas']);
const abierta = id => SEC_CERRADAS.has(id) ? '' : ' open';
const seccion = (id, titulo, cuerpo, cuenta) =>
  `<details class="sec" data-sec="${id}"${abierta(id)}><summary>${titulo}${cuenta !== undefined ? `<span class="cuenta">${cuenta}</span>` : ''}</summary>${cuerpo}</details>`;

function pintarPanel(){
  const panel = document.getElementById('panel'), insp = document.getElementById('inspector');
  if (E.pestana === 'diseno'){
    const d = panelDiseno();
    panel.classList.add('cols');
    panel.innerHTML = d.izq;
    insp.innerHTML = d.der;
    insp.hidden = false;
  } else {
    panel.classList.remove('cols');
    /* fuera de Diseño el inspector se vacia: ni ids repetidos ni campos viejos */
    insp.hidden = true; insp.innerHTML = '';
    panel.innerHTML =
      E.pestana === 'estilo' ? panelEstilo()
    : E.pestana === 'hard'   ? panelHardware()
    : E.pestana === 'logica' ? panelLogica()
    :                          panelManifiesto();
  }
  resumirTextos();
  /* abrir o cerrar una seccion no repinta nada: solo se apunta */
  document.querySelectorAll('details.sec[data-sec]').forEach(dt => dt.addEventListener('toggle', () => {
    if (dt.open) SEC_CERRADAS.delete(dt.dataset.sec); else SEC_CERRADAS.add(dt.dataset.sec);
  }));
  /* En Lógica la zona grande es el editor de código, no el lienzo */
  escenaLogica(E.pestana === 'logica');
  marcarEscenaNodo();
  conectarPanel();
}

/* Leer y escribir "boton.fondo" dentro del tema */
const temaLee = k => k.split('.').reduce((o, p) => (o || {})[p], E.tema);
function temaPon(k, v){
  const p = k.split('.'); let o = E.tema;
  for (const x of p.slice(0, -1)) o = (o[x] = o[x] || {});
  o[p[p.length - 1]] = v;
  E.tema.base = null;        /* ya no es el tema de fabrica tal cual */
}

/* Una fila de color: el selector, el nombre y el hexadecimal */
const filaColorTema = (k, et, ayuda) =>
  `<div class="color-fila"${ayuda ? ` title="${esc(t(ayuda))}"` : ''}><input type="color" data-tema="${k}" value="${temaLee(k)}">
    <span class="et">${esc(t(et))}${ayuda ? `<small>${esc(t(ayuda))}</small>` : ''}</span>
    <input type="text" data-temahex="${k}" value="${temaLee(k)}" spellcheck="false"></div>`;

/* Un tema de fabrica en pequeno: su tira de colores y su nombre. La
   descripcion va debajo de la fila, solo la del tema elegido. */
function tarjetaTema(id){
  const T = TEMAS[id], activo = E.tema.base === id;
  const c = x => `<i style="background:${x}"></i>`;
  return `<button type="button" class="tema-mini${activo ? ' activo' : ''}" data-tema-base="${id}" title="${esc(t(T.desc))}">
    <span class="tira" style="background:${T.fondo}">${c(T.superficie)}${c(T.acento)}${c(T.ok)}${c(T.alarma)}</span>
    ${esc(t(T.nombre))}</button>`;
}

/* Que se esta mirando en la pestana: el color de la paleta, la clase de
   boton abierta y el color del widget. Estado de la interfaz, fuera de E. */
const ESTILO_UI = { color: 'acento', boton: null, wcolor: null, ultimo: 'color' };

/* La letra de un tipo, para escribir con ella en el panel */
const fuenteCss = (tipo, px) => { const T = TIPOS[tipo] || TIPOS.medium;
  return `${T.cursiva ? 'italic ' : ''}${T.peso} ${px}px '${T.familia}', system-ui, sans-serif`; };

/* Los colores de un widget, como la paleta del proyecto: circulos y una
   ficha. Con uno o dos colores no hace falta: van en filas. */
function paletaWidget(campos, e){
  if (campos.length <= 2) return `<div class="colores">${campos.map(c => filaColorWidget(c, e, 'west')).join('')}</div>`;
  const el = campos.some(c => c.k === ESTILO_UI.wcolor) ? ESTILO_UI.wcolor : campos[0].k;
  return `<div class="sw-fila">${campos.map(c => `<button type="button" class="sw${c.k === el ? ' on' : ''}${e[c.k] ? '' : ' hereda'}"
      data-swwest="${c.k}" style="background:${e[c.k] || c.her}" title="${esc(t(c.et))}" aria-label="${esc(t(c.et))}"></button>`).join('')}</div>
    <div class="ficha-w">${campos.map(c => `<div class="fc${c.k === el ? ' elegida' : ''}" data-fcw="${c.k}">${filaColorWidget(c, e, 'west')}</div>`).join('')}</div>`;
}

function panelEstilo(){
  const tm = E.tema;
  let h = '';

  /* Lo primero, lo que el usuario acaba de seleccionar. Buscar los
     colores de un widget en la pestana que se llama Estilo es lo que
     hace cualquiera; esconderlos en Diseno era un error. */
  const sel = widgetSel();
  if (sel){
    const campos = camposEstilo(sel), e = sel.estilo || {};
    h += `<div class="bloque"><h3>${t('Estilo de')} ${esc(sel.nombre)}</h3>
      <div class="regla" style="margin-bottom:10px">${esc(nom(WIDGETS[sel.tipo]))} · ${t('estilo:hereda')}</div>`;
    h += campos.length
      ? paletaWidget(campos, e)
      : `<div class="vacio">${sel.tipo === 'pildora'
          ? t('Sus colores salen de looks, en la Lógica: uno por estado.')
          : t('Este widget no tiene colores propios.')}</div>`;
    if (sel.tipo === 'pasos')
      h += `<div class="regla" style="margin-top:6px">${t('El paso actual se pinta con la clase de botón Seleccionado del tema.')}</div>`;
    /* La clase de un boton: de ella salen sus tres colores */
    if (sel.tipo === 'button')
      h += `<label class="campo" style="margin-top:10px"><span>${t('Clase de botón')}</span>
        <select data-west="clase">${Object.entries(CLASES_BOTON).map(([k, et]) =>
          `<option value="${k === 'boton' ? '' : k}"${(e.clase || '') === (k === 'boton' ? '' : k) ? ' selected' : ''}>${esc(t(et))}</option>`).join('')}</select></label>
        <div class="regla">${t('La acción principal va en Marcha; lo que detiene o borra, en Paro. El resto, Normal.')}</div>`;
    /* La letra: la del papel del widget en el tema, o una elegida a mano */
    if (papelDe(sel) || TEXTO_ESTILABLE.has(sel.tipo)){
      const papel = e.papel || papelDe(sel) || 'texto';
      const delTema = (tm.tipografia || {})[papel] || 'medium';
      h += `<label class="campo" style="margin-top:10px"><span>${t('Tipografía')}</span>
        <select data-west="tipo"><option value="">${t('La del tema')} (${esc(t(PAPELES_TEXTO[papel]))}: ${esc(t(TIPOS[delTema].nombre))})</option>${
          Object.entries(TIPOS).map(([k, T]) => `<option value="${k}"${e.tipo === k ? ' selected' : ''}>${esc(t(T.nombre))}</option>`).join('')}</select></label>`;
      /* una letra con juego limitado (el display de 7 segmentos) no tiene coma */
      const vSel = COMPONENTES[sel.tipo] && PARTE_FUENTE[sel.tipo] ? (COMPONENTES[sel.tipo].partes(sel)[PARTE_FUENTE[sel.tipo]] || {}).v : varianteFuente(sel);
      if (TIPOS[vSel] && TIPOS[vSel].solo)
        h += `<div class="regla" style="margin-top:4px">${t('Esta letra solo tiene cifras, punto, dos puntos, guion y letras simples: nada de tildes')}${
          tm.coma ? ' ' + t('ni coma: en este elemento los decimales salen con punto, en el lienzo y en la placa.') : '.'}</div>`;
    }
    h += controlesTexto(sel);
    h += Object.keys(e).length
      ? `<button class="btn" id="westReset" style="width:100%;margin-top:8px">Volver a heredar del tema</button>`
      : `<div class="hereda" style="margin-top:8px">${t('Ahora mismo hereda todo del tema.')}</div>`;
    h += `</div>`;
  } else {
    h += `<div class="nota info">Selecciona un widget del lienzo y aquí saldrá su paleta propia,
      encima de la del proyecto. Con el <b>botón derecho</b> sobre él la tienes sin cambiar de pestaña.</div>`;
  }

  /* --- tema: los cuatro en una fila; debajo, de cual se parte --- */
  const partida = TEMAS[tm.base] ? tm.base : (TEMAS[tm._partida] ? tm._partida : null);
  h += `<div class="bloque"><h3>${t('Tema')}</h3>
    <div class="temas4">${Object.keys(TEMAS).map(tarjetaTema).join('')}</div>
    ${partida ? `<div class="tema-sobre">${TEMAS[tm.base]
      ? `<b>${esc(t(TEMAS[partida].nombre))}</b> · ${esc(t(TEMAS[partida].desc))}`
      : `${t('Retocado a partir de')} <b>${esc(t(TEMAS[partida].nombre))}</b>`}</div>` : ''}
  </div>`;

  /* --- la vista previa se toca: cada parte lleva al color que la pinta --- */
  h += `<div class="bloque"><h3>${t('Vista previa')}<span class="h3-pista">${t('Toca una parte para ver su color')}</span></h3>
    <div id="previoTema">${previoTema()}</div></div>`;

  /* --- la paleta: circulos por grupos y una sola ficha, la del elegido --- */
  const el = ESTILO_UI.color;
  h += `<div class="bloque"><h3>${t('Paleta')}</h3>
    <div class="paleta-sw">${GRUPOS_TEMA.map(([g, l]) => `<span class="sw-grupo">${esc(t(g))}</span>
      <div class="sw-fila">${l.map(([k, et]) => `<button type="button" class="sw${k === el ? ' on' : ''}" data-swk="${k}"
        style="background:${temaLee(k)}" title="${esc(t(et))}" aria-label="${esc(t(et))}"></button>`).join('')}</div>`).join('')}</div>
    <div class="ficha-colores">${COLORES_TEMA.map(([k, et, ay]) =>
      `<div class="fc${k === el ? ' elegida' : ''}" data-fc="${k}">${filaColorTema(k, et, ay)}</div>`).join('')}</div>
    <div class="regla" style="margin-top:8px">${t('Valen para todo el proyecto. Para cambiar un solo widget, selecciónalo en el lienzo.')}</div>
    <button class="enlace-mini" id="temaReset">${t('Volver a los colores de origen')}</button>
  </div>`;

  /* --- botones: una fila por clase con su muestra; al abrirla, sus tres colores --- */
  const mini = c => `<i class="mini" style="background:${c}"></i>`;
  h += seccion('est-botones', t('Botones'), `
    <div class="clases-btn">${CLASES_BOTON_TEMA.map(([k, et, ay]) => `<div class="cb${ESTILO_UI.boton === k ? ' elegida' : ''}" data-cb="${k}">
      <button type="button" class="cb-cab" data-cbsel="${k}" aria-expanded="${ESTILO_UI.boton === k}">
        <span class="boton-muestra" style="background:${tm[k].fondo};border-color:${tm[k].borde};color:${tm[k].texto};border-radius:${Math.min(tm.radio ?? 6, 8)}px">${esc(t(et)).toUpperCase()}</span>
        <span class="cb-desc">${esc(t(ay))}</span></button>
      <div class="cb-cuerpo colores">${filaColorTema(k + '.fondo', 'Fondo', '')}${filaColorTema(k + '.borde', 'Borde', '')}${filaColorTema(k + '.texto', 'Texto', '')}</div>
    </div>`).join('')}</div>
    <label class="campo" style="margin-top:12px"><span>${t('Radio de las esquinas (px)')}</span>
      <input type="number" id="temaRadio" value="${tm.radio ?? 6}" min="0" max="24" step="1"></label>`,
    CLASES_BOTON_TEMA.map(([k]) => mini(tm[k].fondo)).join(''));

  /* --- tipografia: cada papel escrito con su letra, y su lista al lado --- */
  const selTipo = (id, val) => `<select id="${id}">${Object.entries(TIPOS).map(([k, T]) =>
    `<option value="${k}"${k === val ? ' selected' : ''}>${esc(t(T.nombre))}</option>`).join('')}</select>`;
  const MUESTRA = { numero: tm.coma ? '24,7' : '24.7', titulo: t('Marcha'), dato: '12:30', rotulo: t('TENSIÓN'), texto: t('Listo') };
  const tipoDe = p => (tm.tipografia || {})[p] || 'medium';
  const familias = [...new Set(Object.keys(PAPELES_TEXTO).map(p => (TIPOS[tipoDe(p)] || TIPOS.medium).familia.split(' ')[0]))];
  h += seccion('est-tipo', t('Tipografía'), `
    ${Object.entries(PAPELES_TEXTO).map(([p, et]) => `<label class="tipo-fila"><span>${esc(t(et))}</span>
      <b class="tf-muestra" style="font:${fuenteCss(tipoDe(p), 19)}">${esc(MUESTRA[p] || 'Aa')}</b>${selTipo('temaTipo_' + p, tipoDe(p))}</label>`).join('')}
    <label class="campo"><span>${t('Tamaño base')}</span><select id="temaFuente">${
      TODAS_FUENTES.map(f => `<option value="${f}"${f===tm.fuente?' selected':''}>Montserrat ${f} px</option>`).join('')
    }</select></label>
    <label class="campo" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="temaComa"${tm.coma ? ' checked' : ''}>
      <span style="margin:0">${t('Coma decimal (33,3 en vez de 33.3)')}</span></label>`,
    esc(familias.join(' · ')));

  /* --- lo que pide la placa al exportar: plegado, no borrado --- */
  PLAN = planFuentes();
  const compiladas = PLAN.filter(f => !f.propia), propias = PLAN.filter(f => f.propia);
  let hx = `<div class="nota info">${t('estilo:montserrat')}</div>`;
  { let h = '';

  if (compiladas.length)
    h += `<div class="nota aviso">${t('estilo:lvconf')}<br><br>${compiladas.map(f =>
        `<code style="font:11px var(--mono)">#define LV_FONT_MONTSERRAT_${f.px} 1</code>`).join('<br>')}</div>`;

  if (propias.length){
    const total = propias.reduce((a,f) => a + f.bytes, 0);
    h += `<div class="nota info"><b>Fuentes propias.</b> Estos tamaños LVGL no los trae
      —pasan de 48 px o llevan tildes—, así que se generan a partir de la Montserrat que
      viene con la librería, con <b>sólo los glifos que usas</b>:<br><br>${
        propias.map(f => `· <b>${f.px} px${NOMBRE_VARIANTE[f.variante || 'medium'] ? ' ' + NOMBRE_VARIANTE[f.variante] : ''}</b> — ${f.glifos.length} glifos, ~${Math.round(f.bytes/1024)} KB`).join('<br>')
      }${propias.some(montVariante) ? '<br><br>La <b>negrita</b> y la <b>cursiva</b> salen de Montserrat Bold e Italic, que no vienen con LVGL: se descargan una vez (fuentes/LEEME.txt dice de dónde y adónde).' : ''}<br><br>Total aproximado: <b>${Math.round(total/1024)} KB</b> de flash.
      ${propias.some(montVariante)
        ? 'Telar las genera al exportar y las deja en <code>src/ui/</code>, salvo la negrita y la cursiva de Montserrat: esas, con <code>fuentes/generar.cmd</code>.'
        : 'Telar las genera al exportar y las deja en <code>src/ui/</code>: no hay que ejecutar nada. <code>fuentes/generar.cmd</code> queda por si quieres rehacerlas a mano.'}</div>`;
  }
  hx += h; }
  h += seccion('est-export', t('Para exportar'), hx, `${PLAN.length} ${t('fuentes')}`);
  return h;
}

/**
 * La vista previa, aparte.
 *
 * Tiene que poder refrescarse SIN reconstruir el panel: mientras
 * arrastras por el selector de color del sistema, si se repinta el panel
 * el propio input desaparece a media maniobra y el color deja de
 * aplicarse. Es el mismo fallo que tenia el arrastre de widgets.
 */
function previoTema(){
  const tm = E.tema, U = ESTILO_UI, tip = tm.tipografia || {};
  /* cada parte dice que color la pinta (data-swk) y se marca si es el elegido */
  const m = (k, cls) => `data-swk="${k}" title="${esc(nombreColorTema(k))}" class="${cls || ''}${U.ultimo === 'color' && U.color === k ? ' hl' : ''}"`;
  const r = Math.min(tm.radio ?? 6, 8);
  const coma = x => tm.coma ? x.replace('.', ',') : x;
  const boton = k => { const [, et] = CLASES_BOTON_TEMA.find(([c]) => c === k);
    return `<span data-swbtn="${k}" title="${esc(t(et))}" class="${U.ultimo === 'boton' && U.boton === k ? 'hl' : ''}"
      style="background:${tm[k].fondo};border-color:${tm[k].borde};color:${tm[k].texto};border-radius:${r}px;font:${fuenteCss(tip.titulo, 10.5)}">${esc(t(et))}</span>`; };
  return `<div ${m('fondo', 'pv')} style="background:${tm.fondo}">
    <div ${m('superficie', 'pv-cab')} style="background:${tm.superficie};border-radius:${r}px">
      <span ${m('tenue')} style="color:${tm.tenue};font:${fuenteCss(tip.rotulo, 9.5)}">${t('PRINCIPAL')}</span>
      <span ${m('ok', 'pv-pill')} style="background:${tm.ok};color:${tm.fondo}">${t('LISTO')}</span></div>
    <div ${m('borde', 'pv-linea')}><i style="background:${tm.borde}"></i></div>
    <div ${m('superficie', 'pv-panel')} style="background:${tm.superficie};border-color:${tm.borde};border-radius:${r}px">
      <div ${m('tenue')} style="color:${tm.tenue};font:${fuenteCss(tip.rotulo, 9.5)};letter-spacing:.08em">${t('TENSIÓN')} · kV</div>
      <div ${m('texto', 'pv-num')} style="color:${tm.texto};font:${fuenteCss(tip.numero, 30)}">${coma('24.7')}</div>
      <div ${m('pista', 'pv-pista')} style="background:${tm.pista}"><div ${m('acento')} style="width:62%;background:${tm.acento}"></div></div>
      <div class="pv-fila">
        <div ${m('sub', 'pv-hueco')} style="background:${tm.sub};border-radius:${Math.min(r, 5)}px;font:${fuenteCss(tip.dato, 10)}">
          <span ${m('texto')} style="color:${tm.texto}">✓ ${t('Paso')} 1</span>
          <span ${m('tinta3')} style="color:${tm.tinta3}">${t('Paso')} 2</span>
          <span class="pv-chips"><span ${m('aviso')} style="background:${tm.aviso};color:${tm.fondo}">${t('SUBE')}</span><span ${m('alarma')} style="background:${tm.alarma};color:#fff">${t('FALLO')}</span></span>
        </div>
        <svg ${m('rejilla', 'pv-curva')} viewBox="0 0 100 50" preserveAspectRatio="none">
          ${[12, 25, 38].map(y => `<line x1="0" x2="100" y1="${y}" y2="${y}" stroke="${tm.rejilla}" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
          ${[33, 66].map(x => `<line y1="0" y2="50" x1="${x}" x2="${x}" stroke="${tm.rejilla}" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
          <polyline ${m('acento')} points="0,40 15,34 30,36 45,22 60,26 75,14 100,10" fill="none" stroke="${tm.acento}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="pv-botones">${CLASES_BOTON_TEMA.map(([k]) => boton(k)).join('')}</div>
  </div>`;
}

function refrescarPrevio(){
  const n = document.getElementById('previoTema');
  if (n) n.innerHTML = previoTema();
}

/* ---------- Diseño ---------- */
function panelDiseno(){
  /* h: el inspector (derecha). izq: la columna de la izquierda. */
  const w = widgetSel(); let h = '', aviso = '';

  const malos = textosConProblema();
  if (malos.length){
    aviso += `<div class="bloque" style="margin-top:12px"><div class="nota error">
      <b>La placa no puede dibujar estos caracteres.</b><br>
      Las fuentes Montserrat que trae LVGL sólo llevan ASCII, el grado y el bullet:
      ni tildes, ni eñes, ni signos de apertura. En pantalla salen como <b>□</b>,
      y por eso el lienzo también los pinta así.<br><br>
      ${malos.slice(0,6).map(m => `· <b>${esc(m.texto)}</b> (${esc(m.malos.join(' '))})`).join('<br>')}
      ${malos.length > 6 ? `<br>· y ${malos.length-6} más` : ''}
      </div>
      <button class="btn" id="quitarTildes" style="width:100%">Quitar tildes de todos los textos</button>
      <div class="regla" style="margin-top:6px">La alternativa es una <b>fuente propia</b>, con las
      tildes dentro: elige un tamaño de letra que no traiga LVGL (más de 48 px) o cámbiala en Estilo, y
      al exportar sale la carpeta <b>fuentes\\</b> con el script que la convierte. El LEEME del proyecto
      lo explica paso a paso.</div>
    </div>`;
  }

  const bloqueProyecto = `
    <label class="campo"><span>${t('Nombre')}</span><input type="text" id="fProyecto" value="${esc(E.proyecto)}"></label>
    <label class="campo"><span>${t('Placa de la pantalla')}</span><select id="fPlaca">
      <optgroup label="${t('Con pantalla integrada')}">${
        Object.entries(placasTodas()).filter(([,v]) => !v.sin_pantalla).map(([k,v]) =>
          `<option value="${k}"${k===nodoHMI().placa?' selected':''}>${esc(v.corto)} · ${v.ancho}×${v.alto}</option>`).join('')}
      </optgroup>
      <optgroup label="${t('Con una pantalla aparte, por SPI o I2C')}">${
        Object.entries(placasTodas()).filter(([,v]) => v.sin_pantalla && v.familia !== 'avr' && v.familia !== 'linux')
          .map(([k,v]) => `<option value="${k}"${k===nodoHMI().placa?' selected':''}>${esc(v.corto)} + ${t('pantalla aparte')}</option>`).join('')}
      </optgroup>
    </select></label>
    ${bloquePantallaExterna()}
    <label class="campo"><span>${t('Refresco de pantalla')}</span><select id="fRefresco">${
      [[100,'10 por segundo \u00b7 recomendado'],
       [200,'5 por segundo \u00b7 el m\u00e1s estable'],
       [50,'20 por segundo \u00b7 puede parpadear'],
       [33,'30 por segundo \u00b7 parpadea casi seguro']].map(([ms,et]) =>
      `<option value="${ms}"${(E.refresco_ms ?? 100) === ms ? ' selected' : ''}>${esc(t(et))}</option>`).join('')
    }</select></label>
    <div class="regla">${t('ayuda:refresco')}</div>`;

  /* En una pantalla de un color solo se ofrece lo que se ve en ella: lo
     que necesita color o no cabe en 128 px ni aparece en la paleta. */
  const mono = esMono(placa()), serie = esSerie(placa());
  const grupos = {};
  for (const [k,v] of Object.entries(WIDGETS)){
    if (v.oculto) continue;                       /* lo cubre otro: ver OCULTOS_POR */
    if (mono && !WIDGETS_MONO.has(k)) continue;
    if (serie && !WIDGETS_SERIE.has(k)) continue;
    (grupos[v.grupo] = grupos[v.grupo] || []).push([k,v]);
  }
  let hPaleta = `<input type="search" class="buscar-pal" id="buscarWidget" placeholder="${esc(t('Buscar widget…'))}" aria-label="${esc(t('Buscar widget…'))}">
    <div class="pista-pal">${t('Arrástralo al lienzo, o haz clic para ponerlo en el centro.')}</div>${mono ? `
    <div class="regla" style="margin-bottom:8px">${t('Pantalla de un color: solo aparecen los widgets que se leen en blanco y negro.')}</div>` : ''}${serie ? `
    <div class="regla" style="margin-bottom:8px">${t('Pantalla por puerto serie: solo aparecen los widgets que tienen equivalente en ella.')}</div>` : ''}`;
  for (const [g, lista] of Object.entries(grupos))
    hPaleta += `<div class="grupo-pal">${esc(t(g))}</div><div class="paleta tiles">${lista.map(([k,v]) =>
      `<button class="wbtn" draggable="true" data-add="${k}" data-buscar="${esc((nom(v) + ' ' + t(g) + ' ' + k).toLowerCase())}" title="${esc(t(v.ayuda))}"><i>${miniWidget(k)}</i><span>${esc(nom(v))}</span></button>`).join('')}</div>`;
  hPaleta += `<div class="pal-vacia" id="palVacia" hidden>${t('Ningún widget se llama así.')}</div>`;

  /* La columna izquierda: pantallas, añadir, capas y plantillas */
  const P = pantalla();
  const capas = P.widgets.slice().reverse().map(x => {
    const c = WIDGETS[x.tipo] || {};
    return `<button type="button" class="capa${(E.seleccion || []).includes(x.id) ? ' sel' : ''}" data-capa="${x.id}" title="${esc(x.nombre)} · ${esc(nom(c) || x.tipo)}">
      <i>${icoWidget(x.tipo)}</i><span>${esc(x.nombre)}</span><small>${esc(nom(c) || x.tipo)}</small></button>`;
  }).join('');
  const listaPantallas = E.pantallas.map((sc,i) =>
    `<div class="item${i===E.iPantalla?' activo':''}" data-pant="${i}">
      <span class="nom">${esc(sc.nombre)}</span><span class="sub">${sc.widgets.length}</span>
      ${E.pantallas.length>1?`<button class="x" data-delpant="${i}">×</button>`:''}</div>`).join('')
    + `<button class="btn" id="addPant" style="width:100%;margin-top:6px">${t('+ Nueva pantalla')}</button>`;
  const izq = aviso
    + seccion('pantallas', t('Pantallas'), listaPantallas, E.pantallas.length)
    + seccion('widgets', t('Añadir widget'), hPaleta)
    + seccion('capas', t('Capas'), P.widgets.length
        ? `<div class="capas-lista">${capas}</div><div class="regla" style="margin-top:8px">${t('El de arriba se dibuja encima. Clic para seleccionar; Ctrl+clic añade o quita.')}</div>`
        : `<div class="regla">${t('Esta pantalla todavía está vacía: añade un widget arriba.')}</div>`, P.widgets.length)
    + seccion('plantillas', t('Plantillas'), bloquePlantillas());

  /* La cabecera del inspector: qué se está mirando */
  const cabecera = (ico, titulo, sub) => `<div class="insp-cab"><span class="ico">${ico}</span>
    <div class="que"><b>${titulo}</b><small>${sub}</small></div></div>`;

  const varios = widgetsSel();
  if (varios.length > 1){
    /* Con un grupo seleccionado lo urgente es alinearlo, no anadir mas
       widgets: la paleta baja al final. */
    h += seccion('seleccion', `${varios.length} ${t('widgets seleccionados')}`,
      `<div class="regla" style="margin-bottom:10px">${varios.map(x => esc(x.nombre)).join(', ')}</div>
      <div class="nota info">Se mueven juntos, con el ratón o con las flechas.
      <b>Ctrl+clic</b> añade o quita uno.</div>`);

    h += `<details class="sec" data-sec="alinear"${abierta('alinear')}><summary>${t('Alinear con')} ${esc(w.nombre)}</summary>
      <div class="regla" style="margin-bottom:8px">Manda el último que tocaste; los demás se le alinean.</div>
      <div class="alinea" style="margin-bottom:6px">
        <button data-alinea="izq">Izquierda</button>
        <button data-alinea="centro">Centrar ↔</button>
        <button data-alinea="der">Derecha</button>
        <button data-alinea="arriba">Arriba</button>
        <button data-alinea="medio">Centrar ↕</button>
        <button data-alinea="abajo">Abajo</button>
      </div>`;
    if (varios.length > 2)
      h += `<div class="fila" style="margin-top:8px">
        <button class="btn" data-distrib="h">Repartir ↔</button>
        <button class="btn" data-distrib="v">Repartir ↕</button></div>`;
    h += `</details>`;

    /* Estilo en bloque: lo que valga para todos los tipos seleccionados */
    const comunes = varios.map(x => new Set(estilosDe(x.tipo)))
      .reduce((a,b) => new Set([...a].filter(k => b.has(k))));
    const cols = [...comunes].filter(k => ['color', 'fondo', 'borde', 'texto'].includes(k));   /* los que tienen nombre y valor comun */
    if (cols.length){
      const et = { color:t('Acento'), fondo:t('Fondo'), borde:t('Borde'), texto:t('Texto') };
      h += seccion('colores', `${t('Color a los')} ${varios.length} ${t('a la vez')}`,
        `<div class="colores">${cols.map(k =>
          `<div class="color-fila"><input type="color" data-todos="${k}" value="${est(w)[k==='color'?'acento':k==='fondo'?'sup':k==='borde'?'borde':'texto']}">
