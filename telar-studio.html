/* =====================================================================
 * UNA PLACA QUE NO ESTA EN EL CATALOGO
 *
 * El catalogo nunca las va a tener todas. Aqui se describe la que sea
 * —una Pico, una STM32, una Jetson— con lo poco que hace falta para
 * repartir pines y escribir su codigo, y se guarda en el proyecto.
 * ===================================================================== */
function formularioPlaca(){
  const f = E.placaEdit, lin = f.familia === 'linux';
  const campo = (id, et, val, ph = '') =>
    `<label class="campo"><span>${et}</span><input type="text" id="${id}" value="${esc(val ?? '')}" placeholder="${esc(ph)}"></label>`;
  const area = (id, et, val, ph = '') =>
    `<label class="campo"><span>${et}</span><textarea id="${id}" rows="3" placeholder="${esc(ph)}"
       style="width:100%;resize:vertical;font:12.5px var(--mono);background:var(--panel2);color:var(--texto);
              border:1px solid var(--borde);border-radius:6px;padding:6px 8px">${esc(val ?? '')}</textarea></label>`;

  return `<div class="bloque"><h3>${t('Placa a medida')}</h3>
    <div class="nota info">${t('Describe la placa una vez y queda guardada dentro del proyecto. Vale como <b>nodo de control</b>: lee sensores, mueve salidas y habla con la pantalla. Si además quieres que tenga pantalla, elígela como placa de la pantalla con «+ pantalla aparte» en Diseño.')}</div>

    <div class="fila">${campo('pfNombre', t('Nombre'), f.nombre, 'Raspberry Pi Pico')}${campo('pfCorto', t('Nombre corto'), f.corto, 'Pico')}</div>
    <label class="campo"><span>${t('Familia de código')}</span><select id="pfFamilia">${
      Object.entries(FAMILIAS).map(([k, v]) => `<option value="${k}"${f.familia === k ? ' selected' : ''}>${esc(v.et)}</option>`).join('')
    }</select></label>
    <div class="regla" style="margin-bottom:10px">${esc(FAMILIAS[f.familia].ayuda)}</div>

    ${lin ? campo('pfFqbn', t('Cómo se ejecuta'), f.fqbn, 'python3 control.py')
          : campo('pfFqbn', 'FQBN', f.fqbn, 'rp2040:rp2040:rpipico')}
    ${campo('pfMcu', t('Micro y memoria'), f.mcu, 'RP2040 · 2 MB flash · 264 KB RAM')}

    <h3 style="margin-top:16px">${t('Pines')}</h3>
    <div class="regla" style="margin-bottom:8px">${t('Números separados por comas; vale poner rangos: <b>2-13, 26-28</b>.')}</div>
    ${campo('pfLibres', t('Libres para usar'), textoDePines(f.libres), '2-13, 26-28')}
    ${lin ? '' : campo('pfAdc', t('Con convertidor (ADC)'), textoDePines(f.adc1), '26, 27, 28')}
    ${campo('pfPwm', t('Con PWM (vacío = todos)'), f.pwm ? textoDePines(f.pwm) : '', lin ? '18' : '')}
    ${campo('pfSoloEntrada', t('Sólo entrada'), textoDePines(f.solo_entrada))}
    ${area('pfReservados', t('Ocupados, uno por línea: pin: motivo'), Object.entries(f.pines || {}).map(([k, v]) => `${k}: ${v}`).join('\n'), '0: UART0 TX (consola)\n1: UART0 RX (consola)')}
    ${area('pfTrampas', t('Trampas, uno por línea: pin: por qué engaña'), Object.entries(f.trampas || {}).map(([k, v]) => `${k}: ${v}`).join('\n'), '15: parece libre y va al LED')}

    ${lin ? '' : `<div class="fila">
      <label class="campo"><span>${t('Bits del ADC')}</span><select id="pfBitsAdc">${
        [10, 12, 16].map(b => `<option value="${b}"${f.bits_adc === b ? ' selected' : ''}>${b}</option>`).join('')}</select></label>
      <label class="campo"><span>${t('Bits del PWM')}</span><select id="pfBitsPwm">${
        [8, 10, 12, 16].map(b => `<option value="${b}"${f.bits_pwm === b ? ' selected' : ''}>${b}</option>`).join('')}</select></label>
    </div>`}

    <h3 style="margin-top:16px">${t('Buses')}</h3>
    <div class="fila">${campo('pfSda', 'I2C SDA', f.bus_i2c?.sda ?? '')}${campo('pfScl', 'I2C SCL', f.bus_i2c?.scl ?? '')}</div>
    <div class="fila">
      ${campo('pfPuerto', lin ? t('Puerto serie') : t('Puerto del enlace'), f.uart2?.puerto ?? '', lin ? '/dev/ttyS0' : 'Serial1')}
      ${campo('pfRx', 'RX', f.uart2?.rx ?? '')}${campo('pfTx', 'TX', f.uart2?.tx ?? '')}
    </div>
    ${area('pfQuirks', t('Cosas que hay que saber, una por línea'), (f.quirks || []).join('\n'), 'El LED de la placa enciende con nivel bajo')}

    <div class="fila" style="margin-top:14px">
      <button class="btn primario" id="pfGuardar" style="flex:1">${t('Guardar la placa')}</button>
      <button class="btn" id="pfCancelar" style="flex:1">${t('Cancelar')}</button>
    </div>
    ${E.placaEdit._error ? `<div class="nota error" style="margin-top:8px">${esc(E.placaEdit._error)}</div>` : ''}
  </div>`;
}

/* Del formulario a la ficha. Se guarda con un id propio para que no
   choque nunca con una del catalogo. */
function guardarPlacaPropia(){
  const $ = s => document.getElementById(s);
  const f = E.placaEdit;
  const pares = txt => Object.fromEntries(String(txt || '').split('\n').map(l => l.split(/:(.*)/s))
    .filter(p => p.length > 1 && p[0].trim() && p[1].trim()).map(p => [Number(p[0].trim()) || p[0].trim(), p[1].trim()]));

  f.nombre = $('pfNombre').value.trim();
  f.corto  = $('pfCorto').value.trim() || f.nombre;
  f.familia = $('pfFamilia').value;
  f.fqbn = $('pfFqbn').value.trim();
  f.mcu = $('pfMcu').value.trim();
  f.libres = pinesDeTexto($('pfLibres').value);
  f.adc1 = $('pfAdc') ? pinesDeTexto($('pfAdc').value) : [];
  const pwm = pinesDeTexto($('pfPwm').value);
  f.pwm = pwm.length ? pwm : null;
  f.solo_entrada = pinesDeTexto($('pfSoloEntrada').value);
  f.pines = pares($('pfReservados').value);
  f.trampas = pares($('pfTrampas').value);
  if ($('pfBitsAdc')) f.bits_adc = Number($('pfBitsAdc').value);
  if ($('pfBitsPwm')) f.bits_pwm = Number($('pfBitsPwm').value);
  const sda = Number($('pfSda').value), scl = Number($('pfScl').value);
  f.bus_i2c = Number.isFinite(sda) && $('pfSda').value.trim() ? { sda, scl, existe: false, nota: t('Bus declarado en la ficha de esta placa.') } : null;
  const puerto = $('pfPuerto').value.trim();
  f.uart2 = puerto ? { puerto, rx: Number($('pfRx').value) || 0, tx: Number($('pfTx').value) || 0, nota: '' } : null;
  f.quirks = String($('pfQuirks').value || '').split('\n').map(x => x.trim()).filter(Boolean);
  f.sin_pantalla = true; f.ancho = 0; f.alto = 0; f.propia = true;
  f.adc2 = []; f.arranque = f.arranque || [];

  if (!f.nombre){ f._error = t('Ponle un nombre a la placa.'); pintar(); return; }
  if (!f.libres.length){ f._error = t('Sin pines libres no hay nada que repartir: escribe al menos uno.'); pintar(); return; }
  if (f.familia !== 'linux' && !f.fqbn){ f._error = t('Falta el FQBN: es lo que le dice al compilador qué placa es.'); pintar(); return; }
  delete f._error;

  HIST.iniciar();
  f.id = f.id || 'propia-' + cid(f.corto || f.nombre).toLowerCase() + '-' + Math.random().toString(36).slice(2, 6);
  E.placas_propias = E.placas_propias || {};
  E.placas_propias[f.id] = JSON.parse(JSON.stringify(f));
  nodo().placa = f.id;
  for (const p of nodo().conexiones) p.pinForzado = null;
  E.placaEdit = null;
  pintar();
}

/* Los pines con los que vienen cableadas casi todas las TFT de los
   tutoriales. Si el primero no esta libre en esta placa, se prueba el
   siguiente, y si ninguno, el primer libre que quede. */
const PINES_TIPICOS = {
  sck:  [18, 12, 14], mosi: [23, 11, 13], miso: [19, 13, 12],
  dc:   [2, 9, 16],   cs:   [15, 10, 5],  rst:  [4, 14, 17], bl: [21, 45, 22]
};

function pantallaPorDefecto(base){
  const malos = new Set([...(base.solo_entrada || []), ...(base.arranque || [])]);
  const libres = (base.libres || []).filter(x => !malos.has(x));
  const usados = new Set();
  const elige = clave => {
    const pref = (PINES_TIPICOS[clave] || []).find(x => libres.includes(x) && !usados.has(x));
    const pin = pref ?? libres.find(x => !usados.has(x)) ?? -1;
    if (pin >= 0) usados.add(pin);
    return pin;
  };
  return {
    controlador: 'ILI9341',
    rotacion: 1,
    spi: { host:'SPI2_HOST', modo:0, freq:40000000,
           sck: elige('sck'), mosi: elige('mosi'), miso: elige('miso'),
           dc: elige('dc'), cs: elige('cs'), rst: elige('rst') },
    luz: { pin: elige('bl'), invertida:false, canal:7, freq:44100 },
    tactil: { controlador:'ninguno' }
  };
}

/* ---------------------------------------------------------------------
 * LA PANTALLA ENCHUFADA
 *
 * Solo aparece cuando la placa elegida no trae pantalla. Es la ficha que

function bloquePantallaExterna(){

      <optgroup label="${t('De un color (OLED), por I2C')}">${
        Object.entries(PANELES).filter(([,v]) => v.bus === 'i2c').map(([k,v]) =>
          `<option value="${k}"${k===pa.controlador?' selected':''}>${esc(v.nombre)}${v.propia ? ' · ' + t('tuya') : ''}</option>`).join('')}</optgroup>
      <optgroup label="${t('Que se dibujan solas, por puerto serie')}">${
        Object.entries(PANELES).filter(([,v]) => v.bus === 'uart').map(([k,v]) =>
          `<option value="${k}"${k===pa.controlador?' selected':''}>${esc(v.nombre)}${v.propia ? ' · ' + t('tuya') : ''}</option>`).join('')}</optgroup>
    </select></label>
    <div class="fila" style="margin-bottom:10px">
      <button class="btn" id="nuevaPantalla" style="flex:1">${t('+ Pantalla a medida')}</button>
      ${PANELES[pa.controlador]?.propia ? `<button class="btn" id="editarPantalla" style="flex:1">${t('Editar esta ficha')}</button>` : ''}
    </div>

    ${esUart ? '' : `<label class="campo"><span>${t('Giro')}</span><select data-pan="rotacion">${

        return `<option value="${rr}"${rr===(pa.rotacion??0)?' selected':''}>${rr*90}° · ${m.ancho}×${m.alto}</option>`; }).join('')}
    </select></label>`}

    <div class="regla" style="margin-bottom:8px">${t('El lienzo se dibuja a')} <b>${med.ancho}×${med.alto}</b>.
      ${t('Estos pines se descuentan de los libres: el asignador ya no los reparte a los sensores.')}</div>

    ${esUart ? `

            + pin('spi.miso', 'MISO', pa.spi?.miso) + pin('spi.dc', 'DC', pa.spi?.dc)
            + pin('spi.cs',   'CS', pa.spi?.cs) + pin('spi.rst', 'RESET', pa.spi?.rst))}

    ${rejilla(pin('luz.pin', t('Pin'), pa.luz ? pa.luz.pin : -1))}

    <div class="acc-sec">${t('Táctil')}</div>
    <label class="campo"><span>${t('Controlador')}</span><select data-pan="tactil.controlador">${

        `<option value="${k}"${k===tac.controlador?' selected':''}>${esc(v.nombre)}</option>`).join('')}
    </select></label>
    ${T.bus === 'spi' ? `
      ${rejilla(pin('tactil.sck', 'SCK', tac.sck) + pin('tactil.mosi', 'MOSI', tac.mosi)
              + pin('tactil.miso', 'MISO', tac.miso) + pin('tactil.cs', 'CS', tac.cs)
              + pin('tactil.irq', 'IRQ', tac.irq))}
      <div class="regla">${t('El XPT2046 puede ir en su propio bus SPI o compartir el de la pantalla; con pines propios es lo más seguro.')}</div>` : ''}
    ${T.bus === 'i2c' ? `
      ${rejilla(pin('tactil.sda', 'SDA', tac.sda) + pin('tactil.scl', 'SCL', tac.scl)
              + pin('tactil.irq', 'IRQ', tac.irq) + pin('tactil.rst', 'RESET', tac.rst))}
      <div class="regla">${t('Si el dedo cae desplazado, lo que hay que tocar es el giro, no los pines.')}</div>` : ''}
    `}
  </div>`;
}

/* Los dos pines de una OLED por I2C: los del bus que la placa declara si
   estan libres y no son de arranque, y si no, los primeros libres. Los
   que ya tenga y sigan siendo validos EN ESTA PLACA se respetan. */
function proponerPinesI2c(pa, base){
  const malos = new Set([...(base.solo_entrada || []), ...(base.arranque || [])]);
  const libres = (base.libres || []).filter(x => !malos.has(x));
  const vale = p => p !== undefined && p !== null && p >= 0 && libres.includes(p);
  const b = base.bus_i2c || {};
  pa.i2c = pa.i2c || {};
  const usados = new Set();
  const toma = pref => {
    const p = vale(pref) && !usados.has(pref) ? pref : libres.find(x => !usados.has(x)) ?? -1;
    usados.add(p); return p;
  };
  pa.i2c.sda = vale(pa.i2c.sda) ? pa.i2c.sda : toma(b.sda); usados.add(pa.i2c.sda);
  pa.i2c.scl = vale(pa.i2c.scl) && pa.i2c.scl !== pa.i2c.sda ? pa.i2c.scl : toma(b.scl);
  if (!(pa.i2c.rst >= 0) || !vale(pa.i2c.rst)) pa.i2c.rst = -1;
  pa.i2c.direccion = pa.i2c.direccion || (PANELES[pa.controlador] || {}).direccion || '0x3C';
  pa.i2c.freq = pa.i2c.freq || 400000;
}

/* TX y RX de una pantalla serie. Se evitan los del UART2 de la ficha:
   son los que coge el enlace con el otro nodo, y dos cosas en el mismo
   puerto serie no se entienden. El RX puede ser un pin de solo entrada. */
function proponerPinesUart(pa, base){
  const reservados = new Set([base.uart2?.rx, base.uart2?.tx].filter(x => x !== undefined));
  const malos = new Set(base.arranque || []);
  const libres = (base.libres || []).filter(x => !malos.has(x) && !reservados.has(x));
  const salida = libres.filter(x => !(base.solo_entrada || []).includes(x));
  pa.uart = pa.uart || {};
  const vale = (p, lista) => p !== undefined && p !== null && p >= 0 && lista.includes(p);
  if (!vale(pa.uart.tx, salida)) pa.uart.tx = salida.find(x => x !== pa.uart.rx) ?? -1;
  const paraRx = [...libres.filter(x => (base.solo_entrada || []).includes(x)), ...libres];
  if (!vale(pa.uart.rx, libres) || pa.uart.rx === pa.uart.tx) pa.uart.rx = paraRx.find(x => x !== pa.uart.tx) ?? -1;
  pa.uart.baudios = pa.uart.baudios || (PANELES[pa.controlador] || {}).baudios || 9600;
}

/* Al cambiar de placa, la pantalla se conserva (controlador, giro,
   tactil) pero sus pines se revisan: un pin que no existe en la placa
   nueva no puede quedarse, y un SDA en el 21 no significa nada en una C3. */
function reubicarPantalla(pa, base){
  if (!pa) return pantallaPorDefecto(base);
  const libres = new Set(base.libres || []);
  if ((PANELES[pa.controlador] || {}).bus === 'i2c'){ proponerPinesI2c(pa, base); return pa; }
  if ((PANELES[pa.controlador] || {}).bus === 'uart'){ proponerPinesUart(pa, base); return pa; }
  const todosValen = Object.keys(pinesDePantalla(pa)).map(Number).every(p => libres.has(p));
  if (todosValen) return pa;
  const nueva = pantallaPorDefecto(base);
  nueva.controlador = pa.controlador; nueva.rotacion = pa.rotacion;
  if (pa.tactil && pa.tactil.controlador !== 'ninguno'){
    nueva.tactil = { controlador: pa.tactil.controlador };
    proponerPinesTactil(nueva, base);
  }
  return nueva;
}

/* Pines sugeridos para el tactil: los que quedan libres despues de la
   pantalla, y para el I2C los del bus que la placa ya declara. */
function proponerPinesTactil(pa, base){
  const T = TACTILES[pa.tactil.controlador] || TACTILES['ninguno'];
  const ocupados = new Set(Object.keys(pinesDePantalla({ ...pa, tactil:null })).map(Number));
  const malos = new Set([...(base.solo_entrada || []), ...(base.arranque || [])]);
  const libres = (base.libres || []).filter(x => !ocupados.has(x) && !malos.has(x));
  const toma = () => libres.shift() ?? -1;
  const falta = k => pa.tactil[k] === undefined || pa.tactil[k] === null || pa.tactil[k] < 0;

  if (T.bus === 'spi'){
    pa.tactil.host = pa.tactil.host || 'SPI3_HOST';
    pa.tactil.freq = pa.tactil.freq || 1000000;
    for (const k of ['sck', 'mosi', 'miso', 'cs', 'irq']) if (falta(k)) pa.tactil[k] = toma();
    /* La calibracion de fabrica de casi todos los XPT2046 */
    pa.tactil.x_min ??= 300; pa.tactil.x_max ??= 3900;
    pa.tactil.y_min ??= 200; pa.tactil.y_max ??= 3700;
    pa.tactil.rotacion ??= 0;
  } else if (T.bus === 'i2c'){
    /* El bus que la placa ya declara, salvo que la pantalla se haya
       quedado con ese pin: proponer un pin ya ocupado es peor que no
       proponer nada, porque parece correcto. */
    const bus = base.bus_i2c || {};
    const libre = pin => pin !== undefined && pin !== null && pin >= 0 && !ocupados.has(pin);
    if (falta('sda')) pa.tactil.sda = libre(bus.sda) ? bus.sda : toma();
    if (falta('scl')) pa.tactil.scl = libre(bus.scl) ? bus.scl : toma();
    if (falta('irq')) pa.tactil.irq = toma();
    pa.tactil.rst ??= -1;
    pa.tactil.direccion ??= pa.tactil.controlador === 'GT911' ? '0x5D' : '0x38';
    pa.tactil.freq ??= 400000;
  }
}

/* ---------------------------------------------------------------------
 * EL FORMULARIO DE PANTALLA A MEDIDA
 * ------------------------------------------------------------------- */
function plantillaPantalla(){
  return { nombre:'', bus:'spi', clase:'Panel_ILI9341', ancho:240, alto:320,
           offset_x:0, offset_y:0, invertir:false, orden_rgb:false, freq_mhz:40,
           direccion:'0x3C', protocolo:'nextion', baudios:9600 };
}

function formularioPantalla(){
  const p = E.pantallaEdit;
  const campo = (k, et, tipo = 'text', extra = '') =>
    `<label class="campo"><span>${et}</span><input type="${tipo}" data-pn="${k}" value="${esc(p[k] ?? '')}" ${extra}></label>`;
  const sel = (k, et, ops) =>
    `<label class="campo"><span>${et}</span><select data-pn="${k}">${
      ops.map(([v, txt]) => `<option value="${esc(v)}"${String(p[k]) === String(v) ? ' selected' : ''}>${esc(txt)}</option>`).join('')}</select></label>`;
  const clases = Object.entries(CLASES_LGFX).filter(([, c]) => c.buses.includes(p.bus));
  return `<div class="bloque">
    <h3>${t('Pantalla a medida')}</h3>
    <div class="regla" style="margin-bottom:10px">${t('Para una pantalla que no está en la lista. Se describe una vez y queda guardada dentro del proyecto.')}</div>
    ${campo('nombre', t('Nombre'), 'text', 'placeholder="p. ej. Redonda 1,28"')}
    ${sel('bus', t('Cómo se conecta'), [['spi', t('SPI (pantalla en color o monocromo)')], ['i2c', t('I2C (OLED)')], ['uart', t('Puerto serie (se dibuja sola)')]])}
    ${p.bus === 'uart' ? `
      ${sel('protocolo', t('Qué habla'), [['nextion', 'Nextion / TJC'], ['lineas', t('Texto por líneas (SET / EVT)')]])}
      ${campo('ancho', t('Ancho (px)'), 'number')}
      ${campo('alto', t('Alto (px)'), 'number')}
      ${sel('baudios', t('Velocidad'), [9600, 19200, 38400, 57600, 115200].map(b => [b, b + ' baudios']))}
    ` : `
      ${sel('clase', t('Controlador'), clases.map(([k, c]) => [k, c.nombre]))}
      <div class="regla" style="margin-bottom:8px">${t('Es el chip de la pantalla: viene en el anuncio o impreso en el cable plano. El tamaño es el del panel en vertical, antes de girarlo.')}</div>
      ${campo('ancho', t('Ancho del panel (px)'), 'number')}
      ${campo('alto', t('Alto del panel (px)'), 'number')}
      ${campo('offset_x', t('Desplazamiento X'), 'number')}
      ${campo('offset_y', t('Desplazamiento Y'), 'number')}
      <div class="regla" style="margin-bottom:8px">${t('Solo si el dibujo sale corrido: hay pantallas cuyo cristal no empieza en la primera columna de la memoria del chip.')}</div>
      ${sel('invertir', t('Colores invertidos'), [['false', t('No')], ['true', t('Sí (el negro sale blanco)')]])}
      ${sel('orden_rgb', t('Orden de color'), [['false', 'RGB'], ['true', t('BGR (el rojo sale azul)')]])}
      ${p.bus === 'i2c'
        ? sel('direccion', t('Dirección I2C'), [['0x3C', '0x3C'], ['0x3D', '0x3D']])
        : campo('freq_mhz', t('Velocidad del SPI (MHz)'), 'number', 'step="1" min="1" max="80"')}
    `}
    <div class="fila" style="margin-top:10px">
      <button class="btn primario" id="pnGuardar" style="flex:1">${t('Guardar la pantalla')}</button>
      <button class="btn" id="pnCancelar" style="flex:1">${t('Cancelar')}</button>
    </div>
  </div>`;
}

/* Un campo del formulario. Cambiar el bus o el controlador trae los
   valores tipicos de ese controlador: el alumno sabe que chip tiene,
   no cuantos pixeles de memoria usa. */
function ponEnFormPantalla(k, v){
  const p = E.pantallaEdit;
  if (['ancho', 'alto', 'offset_x', 'offset_y', 'freq_mhz', 'baudios'].includes(k)) v = Number(v);
  if (['invertir', 'orden_rgb'].includes(k)) v = v === 'true';
  p[k] = v;
  if (k === 'bus'){
    if (v === 'uart'){ p.ancho = 480; p.alto = 320; p.baudios = p.protocolo === 'lineas' ? 115200 : 9600; }
    else if (!(CLASES_LGFX[p.clase] || { buses: [] }).buses.includes(v))
      return ponEnFormPantalla('clase', Object.keys(CLASES_LGFX).find(c => CLASES_LGFX[c].buses.includes(v)));
  }
  if (k === 'clase'){
    const C = CLASES_LGFX[v] || {};
    p.ancho = C.ancho; p.alto = C.alto; p.invertir = !!C.invertir;
  }
  if (k === 'protocolo') p.baudios = v === 'lineas' ? 115200 : 9600;
  pintar();
}

function guardarPantallaPropia(){
  const p = E.pantallaEdit;
  if (!String(p.nombre || '').trim()) { avisar(t('Falta el nombre'), t('Ponle un nombre a la pantalla.'), 'aviso'); return; }
  if (!(p.ancho > 0) || !(p.alto > 0)) { avisar(t('Falta el tamaño'), t('Escribe el ancho y el alto en píxeles.'), 'aviso'); return; }
  HIST.iniciar();
  const id = p.id || ('propia-' + cid(p.nombre));
  E.pantallas_propias = E.pantallas_propias || {};
  E.pantallas_propias[id] = { ...p, id };
  registrarPantallasPropias(E.pantallas_propias);
  E.pantallaEdit = null;
  ponEnPantalla('controlador', id);      /* la elige, propone sus pines y repinta */
}

/* Escribe un campo del formulario de pantalla, con su ruta con puntos */
function ponEnPantalla(ruta, valor){
  const n = nodoHMI();
  const pa = n.pantalla_externa || (n.pantalla_externa = pantallaPorDefecto(placaBase(n)));
  const antes = medidaPantalla(pa);
  const eraI2c = (PANELES[pa.controlador] || {}).bus === 'i2c';
  const partes = ruta.split('.');
  let o = pa;
  for (const p of partes.slice(0, -1)) o = (o[p] = o[p] || {});
  o[partes[partes.length - 1]] = valor;
  /* El pin de la luz a -1 es "no hay retroiluminacion que controlar" */
  if (ruta === 'luz.pin' && valor < 0) pa.luz = null;

  /* Cambiar entre TFT y OLED cambia de bus: la OLED nace apaisada con el
     giro 0 (con el 1 de las TFT se quedaria en 64x128) y necesita sus
     dos pines de I2C. */
  if (ruta === 'controlador'){
    const base = placaBase(n);
    const i2c = (PANELES[valor] || {}).bus === 'i2c';
    if ((PANELES[valor] || {}).bus === 'uart'){
      pa.rotacion = 0;
      /* cada protocolo nace a su velocidad: la Nextion de fabrica a 9600 */
      pa.uart = pa.uart || {};
      pa.uart.baudios = PANELES[valor].baudios;
      proponerPinesUart(pa, base);
    } else if (i2c){
      if (!eraI2c) pa.rotacion = 0;
      proponerPinesI2c(pa, base);
    } else {
      if (eraI2c) pa.rotacion = 1;
      /* los pines SPI que traiga de otra placa (o de ninguna) se revisan */
      const libres = new Set(base.libres || []);
      const spiOk = pa.spi && ['sck', 'mosi', 'dc', 'cs'].every(k => libres.has(pa.spi[k]));
      if (!spiOk){ const def = pantallaPorDefecto(base); pa.spi = def.spi; pa.luz = def.luz; }
    }
  }

  /* Al elegir tactil, se proponen pines libres: dejarlos todos en -1
     obliga a rellenar cinco huecos a mano antes de poder exportar. */
  if (ruta === 'tactil.controlador' && valor !== 'ninguno') proponerPinesTactil(pa, placaBase(n));
  /* Cambiar de controlador o de giro cambia el tamano del lienzo */
  if (ruta === 'controlador' || ruta === 'rotacion') reescalarDiseno(antes, medidaPantalla(pa));
  pintar();
}

/* Reescalar el diseno a un lienzo de otro tamano: sin esto, pasar de
   800x480 a 128x64 deja todo fuera de la pantalla y parece que el
   trabajo se ha perdido. El minimo baja en las pantallas pequenas: un
   widget de 24 px de ancho minimo no cabe dos veces en una OLED. */
function reescalarDiseno(antes, ahora){
  if (!antes.ancho || !ahora.ancho || (antes.ancho === ahora.ancho && antes.alto === ahora.alto)) return;
  const fx = ahora.ancho/antes.ancho, fy = ahora.alto/antes.alto;
  const minW = ahora.ancho < 200 ? 8 : 24, minH = ahora.alto < 120 ? 8 : 20;
  for (const s of E.pantallas) for (const w of s.widgets){
    w.x = ajusta(w.x*fx); w.y = ajusta(w.y*fy);
    w.w = Math.max(minW, ajusta(w.w*fx)); w.h = Math.max(minH, ajusta(w.h*fy));
    w.w = Math.min(w.w, ahora.ancho); w.h = Math.min(w.h, ahora.alto);
    w.x = Math.max(0, Math.min(w.x, ahora.ancho-w.w)); w.y = Math.max(0, Math.min(w.y, ahora.alto-w.h));
  }
}

function cambiarPlaca(n, id){
  HIST.iniciar();
  const antes = placaDe(n);
  n.placa = id;
  /* El nodo de la pantalla siempre tiene que tener donde pintar: si la
     placa nueva no trae pantalla, se le enchufa una por defecto; si la
     trae, sobra la de antes. */
  if (n === nodoHMI()){
    if (placaBase(n).sin_pantalla) n.pantalla_externa = reubicarPantalla(n.pantalla_externa, placaBase(n));
    else delete n.pantalla_externa;
  }
  const ahora = placaDe(n);
  /* Reescalar el diseno: sin esto, pasar de 800x480 a 320x240 deja todo
     fuera de la pantalla y parece que el trabajo se ha perdido. */
  if (n === nodoHMI()) reescalarDiseno(antes, ahora);
  for (const p of n.conexiones) p.pinForzado = null;
  pintar();
}

function anadirNodo(){

  E.nodos.push({ id:'control', nombre:'Control', placa:'esp32-devkit-v1', conexiones:[] });

  E.iNodo = E.nodos.length-1;
  pintar();
}

/* El tamano con que nace un widget en esta pantalla (lo usa tambien el
   recuadro que se ve al arrastrarlo desde la paleta) */
function tamanoNuevo(tipo){
  const cat = WIDGETS[tipo], P = placa(), f = P.ancho/800;
  const w = ajusta(Math.min(cat.w*f, P.ancho));
  let h = ajusta(Math.min(cat.h*f, P.alto));
  if (PROPORCION[tipo]) h = Math.round(w / PROPORCION[tipo]);
  return { w, h };
}

/* donde: {x, y} en pixeles de la pantalla, el centro donde se solto al
   arrastrarlo. Sin donde, al centro (escalonado para que no se tapen). */
function anadirWidget(tipo, donde){
  HIST.iniciar();
  const cat = WIDGETS[tipo], P = placa(), f = P.ancho/800, k = pantalla().widgets.length % 5;
  const w = { id:'w'+(E.contador++), tipo,
    nombre: tipo.replace(/-/g,'_')+'_'+E.contador,
    x: ajusta(Math.max(0, Math.min(P.ancho-cat.w*f, P.ancho*.5-cat.w*f*.5+k*16))),
    y: ajusta(Math.max(0, Math.min(P.alto -cat.h*f, P.alto *.5-cat.h*f*.5+k*16))),
    w: ajusta(Math.min(cat.w*f, P.ancho)), h: ajusta(Math.min(cat.h*f, P.alto)),
    bind:'', series:[], texto: (COMPONENTES[tipo] && COMPONENTES[tipo].textoPorDefecto) || '', evento:'', destino:'' };
  if (GEOMETRIA_ANTERIOR[tipo] || PROPORCION[tipo]){
    w.caja = CAJA_VERSION;                                   /* nace ya ceñido */
    if (PROPORCION[tipo]) w.h = Math.round(w.w / PROPORCION[tipo]);
  }
  if (donde){
    w.x = ajusta(Math.max(0, Math.min(P.ancho - w.w, donde.x - w.w / 2)));
    w.y = ajusta(Math.max(0, Math.min(P.alto  - w.h, donde.y - w.h / 2)));
  }
  const o = varsPara(cat.acepta);
  if (o.length && (cat.acepta==='lectura'||cat.acepta==='escritura')) w.bind = o[0].nombre;
  if (cat.acepta==='series') w.series = o.slice(0,2).map(v => v.nombre);
  if (AUTOAJUSTABLES.has(tipo) && !COMPONENTES[tipo]){
    w.auto = true;
    /* Una letra que se lea de lejos: el tamano del tema (14) es de nota
       al pie, no de un numero que hay que leer desde el otro lado. */
    w.estilo = { fuente: tipo === 'value' || tipo === 'timer' ? 32 : Math.max(E.tema.fuente, 16) };
  }
  if (tipo==='label') w.texto = 'Texto';
  if (tipo==='button') w.texto = 'Pulsar';
  if (tipo==='checkbox') w.texto = 'Opción';
  /* nace con su consigna: sin ella la marca no se dibuja y parecia que al
     componente le faltaba una parte */
  if (CON_CONSIGNA.has(tipo)){ const sp = consignaPropuesta(w.bind); if (sp) w.consigna = sp; }
  /* el Numero nace cenido a su contenido: la caja es lo que ocupa */
  if (tipo === 'lectura' || tipo === 'tiempo'){ w.auto = true; w.estilo = { fuente: 48 }; }
  if (tipo === 'icono') w.icono = 'fa-bolt';
  pantalla().widgets.push(w); seleccionar(w.id, false); pintar();
}

function anadirPieza(tipo){
  HIST.iniciar();
  const n = nodo();
  const base = tipo.replace(/-/g,'_');
  let i = 1, clave = base;
  const todas = () => [...E.nodos.flatMap(x => x.conexiones)];
  while (todas().some(p => p.clave === clave)) clave = base+'_'+(++i);
  n.conexiones.push({ clave, tipo, pinForzado:null, params:{} });
  pintar();
}

function quitarPieza(lista, i){
  HIST.iniciar();
  const n = nodo();
  const p = n[lista][i];
  const muertas = new Set(variables().filter(v => v.ref === p.clave || v.ref?.startsWith(p.clave+'.')).map(v => v.nombre));
  n[lista].splice(i,1);
  for (const s of E.pantallas) for (const w of s.widgets){
    if (muertas.has(w.bind)) w.bind = '';
    if (w.series) w.series = w.series.filter(x => !muertas.has(x));
  }
  pintar();
}

/* Si desaparece un nodo, los widgets que apuntaban a sus variables
   quedarian enlazados a la nada. Se limpian. */
function limpiarEnlacesRotos(){
  const vivas = new Set(variables().map(v => v.nombre));
  for (const s of E.pantallas) for (const w of s.widgets){
    if (w.bind && !vivas.has(w.bind)) w.bind = '';
    if (w.series) w.series = w.series.filter(x => vivas.has(x));
  }
}

/* Un aviso abajo que se va solo. tipo: ok | aviso | error */
function toast(html, tipo = 'ok', ms = 3800){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
  el.className = 'toast ' + tipo; el.innerHTML = html;
  requestAnimationFrame(() => el.classList.add('ver'));
  clearTimeout(el.__t); el.__t = setTimeout(() => el.classList.remove('ver'), ms);
}

/* ¿Hay cambios sin guardar? Se compara el proyecto con como estaba al
   guardarlo o abrirlo. Lo que solo es de la vista (la pestana, lo
   seleccionado, la pantalla o el nodo que se mira, lo que se esta
   editando en un dialogo) no cuenta. */
const VISTA = ['seleccion', 'sel', 'pestana', 'iNodo', 'iPantalla'];
function huellaProyecto(){
  try { return JSON.stringify(E, function (k, v){ return this === E && (VISTA.includes(k) || /Edit$/.test(k)) ? undefined : v; }); }
  catch { return ''; }
}
let huellaGuardada = null, ultimoGuardado = null;
const hayCambios = () => huellaGuardada !== null && huellaProyecto() !== huellaGuardada;
const horaCorta = d => d.toLocaleTimeString(IDIOMA.actual === 'en' ? 'en-GB' : 'es', { hour: '2-digit', minute: '2-digit' });
function estadoGuardado(){
  const b = document.getElementById('btnGuardar'); if (!b) return;
  const c = hayCambios();
  b.classList.toggle('sin-guardar', c);
  b.title = c ? `${t('Hay cambios sin guardar')} (Ctrl+S)`
    : ultimoGuardado ? `${t('Guardado a las')} ${horaCorta(ultimoGuardado.cuando)}: ${ultimoGuardado.nombre}` : `${t('Guardar el proyecto')} (Ctrl+S)`;
}
function marcarGuardado(nombre){
  huellaGuardada = huellaProyecto();
  if (nombre) ultimoGuardado = { nombre, cuando: new Date() };
  estadoGuardado();
}
setInterval(estadoGuardado, 1000);
/* Cerrar la pestana con cambios: el navegador pregunta (su propio aviso) */
addEventListener('beforeunload', e => { if (hayCambios()){ e.preventDefault(); e.returnValue = ''; } });

/* El .telar.json de esta sesion: el que se abrio o donde se guardo la
   primera vez. escribible: si ya hay permiso para escribir en el. */
let archivoProyecto = null;
const TIPO_TELAR = [{ description: 'Proyecto de Telar Studio', accept: { 'application/json': ['.json'] } }];

let guardando = false;
async function guardarProyecto(){
  if (guardando) return false;
  const nombre = E.proyecto + '.telar.json';
  const texto  = JSON.stringify(E, null, 2);
  const b = document.getElementById('btnGuardar');
  guardando = true; if (b) b.disabled = true;
  try {
    /* Sin la API (Firefox, Safari): se descarga, como siempre, y se dice */
    if (!window.showSaveFilePicker){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([texto], { type: 'application/json' }));
      a.download = nombre; a.click(); URL.revokeObjectURL(a.href);
      marcarGuardado(nombre);
      toast(`✓ ${t('Descargado como')} <code>${escDlg(nombre)}</code>: ${t('está en tu carpeta de Descargas.')}`);
      return true;
    }
    /* Lo que se abrio: se escribe encima (Chrome pide permiso una vez) */
    if (archivoProyecto && !archivoProyecto.escribible){
      let p = 'denied';
      try { p = await archivoProyecto.h.requestPermission({ mode: 'readwrite' }); } catch {}
      if (p === 'granted') archivoProyecto.escribible = true;
    }
    /* La primera vez (o sin permiso): Guardar como, empezando junto al que se abrio */
    if (!archivoProyecto || !archivoProyecto.escribible){
      let h;
      try {
        h = await window.showSaveFilePicker({ suggestedName: nombre, types: TIPO_TELAR, id: 'telar-proyectos',
                                             ...(archivoProyecto ? { startIn: archivoProyecto.h } : {}) });
      } catch (e){
        if (e && e.name === 'AbortError'){ toast(t('No se guardó: cerraste la ventana sin elegir dónde.'), 'aviso'); return false; }
        throw e;
      }
      archivoProyecto = { h, escribible: true };
    }
    const w = await archivoProyecto.h.createWritable();
    await w.write(texto);
    await w.close();
    marcarGuardado(archivoProyecto.h.name);
    toast(`✓ ${t('Guardado')}: <code>${escDlg(archivoProyecto.h.name)}</code> · ${horaCorta(ultimoGuardado.cuando)}`);
    return true;
  } catch (err){
    toast(`${t('No se pudo guardar')}: ${escDlg((err && (err.message || err.name)) || String(err))}`, 'error', 7000);
    return false;
  } finally {
    guardando = false; if (b) b.disabled = false;
  }
}
document.getElementById('btnGuardar').addEventListener('click', guardarProyecto);
/* Ctrl+S guarda, tambien desde el editor de la logica (por eso en captura) */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 's'){ e.preventDefault(); guardarProyecto(); }
}, true);

/* ========================================================== ABRIR */
function abrirProyectoDesde(txt, h, nombre){
  try { E = JSON.parse(txt); }
  catch { avisar(t('No es un proyecto de Telar'), t('Ese fichero no se puede abrir: elige un .telar.json guardado con Telar Studio.'), 'error'); return; }
  /* La pestaña que estaba abierta al guardar no es parte del proyecto:
     un proyecto se abre siempre en Diseño, con la pantalla a la vista. */
  E.seleccion = []; E.sel = null; E.iNodo = 0; E.pestana = 'diseno'; migrarDispositivos(); pintar();
  archivoProyecto = h ? { h, escribible: false } : null;
  ultimoGuardado = null; marcarGuardado();
  toast(`${t('Abierto')}: <code>${escDlg(nombre)}</code>`);
}
document.getElementById('btnCargar').addEventListener('click', async () => {
  /* Abrir otro con cambios sin guardar: se pregunta antes de perderlos */
  if (hayCambios()){
    const r = await dialogo({ tipo: 'aviso', ancho: 480,
      titulo: t('Hay cambios sin guardar'),
      cuerpo: `<p>${t('Si abres otro proyecto, los cambios de')} <code>${escDlg(E.proyecto)}</code> ${t('se perderán.')}</p>`,
      botones: [{ et: t('Cancelar'), valor: null, cancela: true }, { et: t('Abrir sin guardar'), valor: 'abrir' }, { et: t('Guardar y abrir'), valor: 'guardar', principal: true }] });
    if (!r) return;
    if (r === 'guardar' && !(await guardarProyecto())) return;
  }
  if (window.showOpenFilePicker){
    let h;
    try { [h] = await window.showOpenFilePicker({ types: TIPO_TELAR, id: 'telar-proyectos' }); }
    catch { return; }                       /* cancelado */
    abrirProyectoDesde(await (await h.getFile()).text(), h, h.name);
    return;
  }
  const i = document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange = () => { const f = i.files[0]; if (!f) return; f.text().then(txt => abrirProyectoDesde(txt, null, f.name)); };
  i.click();
});

/* La zona del lienzo cambia de ancho sin que cambie la ventana (al entrar
   o salir de Diseño aparece o se va el inspector). Si el zoom es el
   ajustado, se reajusta; solo cuando de verdad cambia la escala. */
if (window.ResizeObserver){
  let pend = 0, ultimo = '';
  new ResizeObserver(() => {
    cancelAnimationFrame(pend);
    pend = requestAnimationFrame(() => {
      const z = document.getElementById('zona'), tam = z.clientWidth + 'x' + z.clientHeight;
      if (ZOOM !== null || tam === ultimo || !z.clientWidth) return;
      ultimo = tam;
      const P = placa(), tope = P.ancho < 200 ? 5 : 1.6;
      const ajuste = Math.min(Math.max(320, z.clientWidth-70)/P.ancho, Math.max(240, z.clientHeight-96)/P.alto, tope);
      if (Math.abs(ajuste - escala) > 0.004) pintarLienzo();
    });
  }).observe(document.getElementById('zona'));
}

/** Junta todo lo que hay que escribir en disco: ruta -> contenido. */
/* Los bytes de una TTF de Telar, para copiarla al proyecto exportado */
const bytesDeFuente = fich => Uint8Array.from(atob(FUENTES_TTF[fich]), c => c.charCodeAt(0));

function generarFicheros(){
  /* El codigo tiene que salir del MISMO estado que el lienzo */
  migrarCajas(); migrarTextos(); normalizarAuto();
  const n = cid(E.proyecto);
  const f = {};
  /* Una pantalla por puerto serie no lleva LVGL: ni puerto, ni fuentes,
     ni imagenes. Lleva su capa serie y, si es una Nextion, la hoja con
     lo que hay que crear en su editor. */
  const serie = esSerie(placa());
  f[n + '.ino']                        = serie ? genInoSerie() : genIno();
  f['state.h']                         = genEstado();
  f['control.cpp']                     = genControl();
  f['hal.h']                           = genHal();
  f['plant_sim.cpp']                   = genPlantSim();
  /* Cada puerto de pantalla trae su fichero de configuracion: la
     libreria de Espressif quiere el nombre de la placa; LovyanGFX quiere
     la ficha entera de la pantalla, que vive en el proyecto. */
  if (serie){
    if (protocoloDe(placa()) === 'nextion') f['NEXTION.txt'] = genHojaNextion();
  }
  else if (puertoDe(placa()) === 'lovyan') f['pantalla.h'] = genPantallaH();
  else                                     f['esp_panel_board_supported_conf.h'] = genConfPlaca();
  f['src/ui/ui.h']                     = serie ? genUiSerieH() : genUiH();
  f['src/ui/ui.cpp']                   = serie ? genUiSerieCpp() : genUiCpp();
  /* Un .c por imagen, al lado de la interfaz. Arduino compila src/
     entero y recursivamente, asi que no hay nada que declarar. */
  if (!serie) for (const w of imagenesDelProyecto())
    f['src/ui/img_' + cid(w.nombre) + '.c'] = genImagen(w);
  f['src/logic/reglas.h']              = genReglasH();
  f['src/logic/reglas.cpp']            = genReglasCpp();
  /* La logica del manifiesto, si la hay: generada, se rehace siempre */
  if (logicaModelo()){ f['logica.h'] = genLogicaH(); f['logica.cpp'] = genLogicaCpp(); }
  f['telar.yaml']                      = manifiesto();
  f['LEEME.txt']                       = genLeeme();
  /* Los buses solo si los hay: un proyecto de pines sueltos no tiene por
     qué cargar con un par de ficheros vacíos. */
  Object.assign(f, genBuses(nodoHMI()) || {});

  /* Solo si el proyecto los necesita: un proyecto que se conforme con la
     Montserrat compilada no tiene por que cargar con esto. */
  if (!serie && hayFuentesPropias()){
    f['src/ui/fuentes.h']        = genFuentesH();
    f['fuentes/generar.cmd']     = genScriptFuentes(true);
    f['fuentes/generar.sh']      = genScriptFuentes(false);
    f['fuentes/LEEME.txt']       = genLeemeFuentes();
    /* Chivo y Plex viajan con el proyecto: el script las busca a su lado */
    for (const v of new Set(PLAN.filter(x => x.propia && tipoLibre(x.variante)).map(x => x.variante)))
      f['fuentes/' + TIPOS[v].ttf] = bytesDeFuente(TIPOS[v].ttf);
  }
  /* Del runtime solo van los ficheros del puerto que toca: meter los dos
     obligaria a tener instaladas las dos librerias. */
  const delPuerto = serie ? []
    : puertoDe(placa()) === 'lovyan'
    ? ['lvgl_lgfx_port.h', 'lvgl_lgfx_port.cpp', 'compat.h']
    : ['lvgl_v9_port.h', 'lvgl_v9_port.cpp', 'compat.h'];
  for (const nombre of delPuerto) f[nombre] = RUNTIME[nombre];

  /* --- Un solo nodo: todo suelto, como hasta ahora --- */
  if (E.nodos.length < 2) return f;

  /* --- Dos nodos: cada uno en su carpeta, mas la capa de enlace ---
     Arduino exige que la carpeta se llame igual que el .ino, asi que
     no se pueden dejar los dos sueltos en el mismo sitio. */
  const A = nodoHMI(), B = E.nodos[1];
  const cA = carpetaNodo(A), cB = carpetaNodo(B);
  const dos = {};

  for (const [ruta, txt] of Object.entries(f)){
    /* el .ino se renombra para que coincida con su carpeta */
    const nueva = ruta === n + '.ino' ? cA + '.ino' : ruta;
    dos[cA + '/' + nueva] = txt;
  }
  if (hayEnlace()){
    dos[cA + '/enlace.h']   = genEnlaceRecibeH();
    dos[cA + '/enlace.cpp'] = genEnlaceRecibe(A);
  }

  /* Una placa con Linux no lleva sketch: lleva un programa de Python que
     habla el mismo protocolo. Todo lo demas del proyecto no cambia. */
  if (esLinux(placaDe(B))){
    dos[cB + '/control.py']    = genLinuxPy(B);
    dos[cB + '/telar.service'] = genServicioLinux(B);
    dos[cB + '/LEEME.txt']     = genLeemeLinux(B);
  } else {
  dos[cB + '/' + cB + '.ino'] = genControlIno(B);
  dos[cB + '/config.h']       = genControlConfig(B);
  dos[cB + '/hal.h']          = genControlHal(B);
  dos[cB + '/hal.cpp']        = genControlHalCpp(B);
  dos[cB + '/enlace.h']       = genEnlaceEnviaH();
  dos[cB + '/enlace.cpp']     = genEnlaceEnvia(B);
  dos[cB + '/LEEME.txt']      = genLeemeControl(B);
  for (const [r, t] of Object.entries(genBuses(B) || {})) dos[cB + '/' + r] = t;
  }
  /* Este va suelto, fuera de las dos carpetas, asi que acaba en el
     sketchbook al lado de los demas proyectos. Un "LEEME.txt" a secas
     ahi no dice de quien es. */
  dos['LEEME_' + n + '.txt']  = genLeemeSistema(A, B);

  return dos;
}

/**
 * Escribe la carpeta del sketch donde el usuario diga.
 *
 * Con la File System Access API (Chrome y Edge) se escribe directamente
 * en Documentos\\Arduino y el alumno solo tiene que abrir el IDE. Donde
 * no exista, se cae a descargar los ficheros sueltos, que obliga a
 * recomponer las carpetas a mano.
 */
/* La carpeta donde se exporto la ultima vez. IndexedDB puede guardar el
   "handle" de la carpeta (localStorage no). Si el navegador no deja,
   simplemente no se recuerda y se pregunta como antes. */
function dbCarpetas(){
  return new Promise((ok, mal) => {
    const r = indexedDB.open('telar-carpetas', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('carpetas');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => mal(r.error);
  });
}
async function carpetaRecordada(){
  try {
    const db = await dbCarpetas();
    const h = await new Promise(ok => {
      const q = db.transaction('carpetas').objectStore('carpetas').get('exportar');
      q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null);
    });
    return h && typeof h.queryPermission === 'function' ? h : null;
  } catch { return null; }
}
async function recordarCarpeta(h){
  try {
    const db = await dbCarpetas();
    await new Promise(ok => {
      const tx = db.transaction('carpetas', 'readwrite');
      tx.objectStore('carpetas').put(h, 'exportar');
      tx.oncomplete = ok; tx.onerror = ok; tx.onabort = ok;
    });
  } catch {}
}

/* =====================================================================
 * LAS FUENTES, AL EXPORTAR
 *
 * Antes habia que ejecutar fuentes/generar.cmd (Node + npx) despues de
 * exportar. Ahora Telar las genera con el MISMO lv_font_conv, empaquetado
 * para el navegador en lv-font-conv.js. Las ordenes no se deciden aqui:
 * se leen del generar.cmd que acaba de escribir genScriptFuentes. Un solo
 * sitio decide las opciones, y lo generado es identico byte a byte al del
 * script (salvo la linea "Opts:", que en el script lleva rutas del disco).
 * ===================================================================== */
function cargarConversor(){
  if (window.LvFontConv) return Promise.resolve(window.LvFontConv);
  /* con una etiqueta <script>, que tambien vale abriendo el .html del disco */
  return cargarConversor.p || (cargarConversor.p = new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = 'lv-font-conv.js';
    sc.onload = () => window.LvFontConv ? ok(window.LvFontConv) : mal(new Error(t('lv-font-conv.js no se cargó bien')));
    sc.onerror = () => { cargarConversor.p = null; mal(new Error(t('No encuentro lv-font-conv.js junto a Telar Studio'))); };
    document.head.appendChild(sc);
  }));
}

/* Las ordenes de generar.cmd, listas para lv_font_conv. Cada fuente:
   { nombre, argv, archivos: {fichero: bytes}, falta, minimo }. falta dice
   que TTF no viaja con Telar (la negrita y la cursiva de Montserrat, que
   el usuario descarga): esa se queda para generar.cmd. */
function ordenesFuentes(cmd){
  const bytes = {}, de = (fich, b64) => bytes[fich] || (bytes[fich] = Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
  const set = {};
  for (const m of cmd.matchAll(/^set (TTF_\w+)=%~dp0(.+?)\r?$/gm)) set[m[1]] = { fich: m[2] };
  for (const m of cmd.matchAll(/^set (TTF_\w+)=%USERPROFILE%[^\r\n]*\\([^\\\r\n]+?)\r?$/gm)) set[m[1]] = { fich: m[2], fuera: true };
  const minimos = {};
  for (const m of cmd.matchAll(/\\src\\ui\\(\w+)\.c"\) do if %%~zF LSS (\d+)/g)) minimos[m[1]] = +m[2];
  return [...cmd.matchAll(/lv_font_conv@[\d.]+ ([^\r\n]+)/g)].map(m => {
    const argv = m[1].match(/"[^"]*"|\S+/g).map(x => x.replace(/^"|"$/g, ''));
    const archivos = {}; let falta = '';
    for (let i = 0; i < argv.length; i++){
      if (argv[i] !== '--font') continue;
      const v = argv[i + 1].replace(/^%|%$/g, '');
      let fich = v, b = null;
      if (v === 'TTF'){ fich = 'Montserrat-Medium.ttf'; if (FUENTES_TTF[fich]) b = de(fich, FUENTES_TTF[fich]); }
      else if (v === 'ICONOS'){ fich = TTF_ICONOS; if (typeof ICONOS_WOFF === 'string') b = de(fich, ICONOS_WOFF); }
      else if (set[v]){ fich = set[v].fich; if (!set[v].fuera && FUENTES_TTF[fich]) b = de(fich, FUENTES_TTF[fich]); }
      if (b) archivos[fich] = b; else falta = falta || fich;
      argv[i + 1] = fich;
    }
    const io = argv.indexOf('-o');
    const nombre = argv[io + 1].split(/[\\/]/).pop().replace(/\.c$/, '');
    argv[io + 1] = 'src/ui/' + nombre + '.c';
    return { nombre, argv, archivos, falta, minimo: minimos[nombre] || 0 };
  });
}
/* "Chivo negrita 42 px", para la barra y el aviso final */
function etiquetaFuente(nombre){
  const f = PLAN.find(x => x.propia && nombreFuente(x) === nombre);
  return f ? `${nombreLeeme(f)} ${f.px} px` : nombre;
}

/* El dialogo de progreso: dos filas, las fuentes y los archivos. Solo
   informa; no se puede cerrar a medias (a medio escribir, la carpeta
   quedaria con una mezcla de lo viejo y lo nuevo). */
function progresoExportar(titulo, conFuentes){
  const el = document.createElement('div');
  el.className = 'dlg-fondo exp-fondo';
  const fila = (k, et) => `<div class="exp-fila" data-fila="${k}">
      <div class="exp-et"><span class="exp-marca"></span><b>${et}</b><span class="exp-n"></span></div>
      <div class="exp-barra"><i></i></div><small class="exp-det">&nbsp;</small></div>`;
  el.innerHTML = `<div class="dlg exp-prog" role="dialog" aria-modal="true" aria-live="polite" style="--dlg-ancho:460px">
    <div class="dlg-cab"><div class="dlg-icono" style="--c:var(--acento)">⇩</div><div><h2 class="dlg-titulo">${titulo}</h2></div></div>
    <div class="exp-cuerpo">${conFuentes ? fila('fuentes', t('Generando las fuentes')) : ''}${fila('archivos', t('Escribiendo los archivos'))}</div></div>`;
  document.body.appendChild(el);
  const poner = (k, i, n, det) => {
    const f = el.querySelector(`[data-fila="${k}"]`); if (!f) return;
    f.classList.toggle('activa', i < n); f.classList.toggle('hecha', n > 0 && i >= n);
    f.querySelector('.exp-n').textContent = n ? `${Math.min(i, n)} / ${n}` : '';
    f.querySelector('.exp-barra i').style.width = (n ? Math.round(100 * Math.min(i, n) / n) : 0) + '%';
    if (det !== undefined) f.querySelector('.exp-det').textContent = det || '\u00a0';
  };
  return { fuentes: (i, n, det) => poner('fuentes', i, n, det), archivos: (i, n, det) => poner('archivos', i, n, det),
           cerrar: () => el.remove() };
}
/* deja que se pinte la barra antes de seguir. Con la pestana en segundo
   plano no hay pintado (requestAnimationFrame no llega nunca): por eso
   tambien un temporizador, para que la exportacion no se quede parada. */
const respirar = () => new Promise(ok => {
  let hecho = false; const fin = () => { if (!hecho){ hecho = true; ok(); } };
  requestAnimationFrame(() => setTimeout(fin, 0)); setTimeout(fin, 50);
});

async function exportar(){
  /* Negarse es la unica respuesta honesta: el generador solo sabe
     escribir transportes de tipo puerto serie. Dejar pasar un CAN
     produciria un sketch que compila, arranca y no habla con nadie. */
  /* Una logica con errores no se exporta: el sketch compilaria sin ella
     y el aparato no haria lo que el alumno ha escrito, sin avisar. */
  const lg = logicaValidada();
  if (lg.errors.length){
    const ir = await dialogo({ tipo: 'aviso',
      titulo: `${t('La lógica tiene')} ${lg.errors.length} ${lg.errors.length === 1 ? t('cosa por arreglar') : t('cosas por arreglar')}`,
      cuerpo: `<p>${t('No exporto hasta que esté bien: el sketch compilaría sin esa lógica y el aparato no haría lo que has escrito.')}</p>`
        + listaDlg(lg.errors.slice(0, 5).map(e => String(e.msg || e))) + (lg.errors.length > 5 ? `<p>${t('…y más, en la pestaña Lógica.')}</p>` : ''),
      botones: [{ et: t('Cerrar'), valor: false, cancela: true }, { et: t('Ir a la Lógica'), valor: true, principal: true }] });
    if (ir){ E.pestana = 'logica'; pintar(); }
    return;
  }
  /* Una placa AVR no tiene radio, ni CAN, ni codigo generado para los
     buses. Negarse y decir que falta es mejor que soltar un sketch que
     no compila y dejar al alumno leyendo errores del compilador. */
  const avrMal = [];
  for (const nd of E.nodos){
    const P = placaDe(nd);
    const permitidas = esAvr(P) ? AVR_PIEZAS : esLinux(P) ? LINUX_PIEZAS : null;
    if (!permitidas) continue;
    for (const c of (nd.conexiones || []))
      if (!permitidas.has(c.tipo)) avrMal.push(`${c.clave} — ${CONEXIONES[c.tipo]?.nombre || c.tipo}`);
    if (E.nodos.length > 1 && E.enlace && !(esLinux(P) ? LINUX_ENLACES : AVR_ENLACES).has(E.enlace.tipo))
      avrMal.push(`${t('el enlace')} ${ENLACES[E.enlace.tipo].nombre}`);
  }
  if (avrMal.length){
    await avisar(t('Hay cosas que esta placa no puede hacer'),
      listaDlg(avrMal.map(escDlg))
      + `<p>${t('Estas placas (AVR como UNO o Nano, y las Linux) no tienen radio ni CAN, y Telar todavía no escribe sus buses. Con ellas el enlace entre nodos va por serie: UART o RS485.')}</p>`
      + `<p><b>${t('Quita esas piezas, o pon un ESP32 en ese nodo.')}</b></p>`, 'aviso');
    return;
  }
  const L = E.nodos.length > 1 && E.enlace ? ENLACES[E.enlace.tipo] : null;
  if (L && !L.generado){
    await avisar(`${t('El enlace')} ${L.nombre} ${t('todavía no está hecho')}`,
      `<p>${t('Telar Studio sabe escribir RS485 y UART. Para')} ${escDlg(L.nombre)} ${t('haría falta otro transporte entero, y no quiero darte código de puerto serie con otro nombre encima.')}</p>`
      + `<p><b>${t('Cambia el enlace a RS485 o UART en la pestaña Hardware.')}</b></p>`, 'aviso');
    return;
  }
  const ficheros = generarFicheros();
  const carpeta  = cid(E.proyecto);

  if (!window.showDirectoryPicker){
    await avisar(t('Este navegador no puede escribir carpetas'),
      `<p>${t('Abre Telar Studio con Chrome o Edge: así escribe el sketch directamente en tu carpeta de Arduino.')}</p>`, 'error');
    return;
  }

  /* El aviso "¿Permitir que este sitio edite archivos?" es de Chrome: no
     se puede cambiar de aspecto (a proposito, para que ninguna web lo
     imite). Lo que si se puede es que salga pocas veces: la carpeta se
     recuerda, y mientras la pestana siga abierta Chrome ya no pregunta.
     En una visita nueva ofrece "Permitir en cada visita", y con eso deja
     de preguntar del todo. */
  /* Se elige la carpeta de "mis proyectos" (Musica, Documentos\Arduino...)
     y dentro va UNA carpeta con el nombre del proyecto, con todo dentro.
     Si la elegida ya se llama como el proyecto, se escribe directo en ella:
     asi no sale control_var\control_var, y asi se llega a
     Documentos\control_var, porque Documentos entero Chrome no deja elegirlo. */
  const dondeQueda = nombre => nombre === carpeta
    ? t('Esa carpeta ya es la del proyecto: se pondrá al día tal cual.')
    : `${t('Dentro se creará o se pondrá al día')} <code>${escDlg(carpeta)}</code>, ${t('con todo el proyecto dentro.')}`;
  /* En la app de escritorio los dialogos son los del sistema: ni Chrome
     pregunta nada ni hay carpetas prohibidas. Los avisos, sin eso. */
  const nativo = !!window.telarNativo;
  const notaLogica = `<div class="dlg-nota">${t('Lo tuyo de')} <code>src/logic</code> ${t('nunca se sobrescribe.')}</div>`;
  const previa = await carpetaRecordada();
  let raiz = null;
  if (previa){
    const eleccion = await dialogo({ tipo: 'info', ancho: 540,
      titulo: t('¿Dónde guardo el proyecto?'),
      cuerpo: `<p>${t('La última vez lo guardaste en')} <code>${escDlg(previa.name)}</code>. ${dondeQueda(previa.name)}</p>`
        + (nativo ? notaLogica : `<div class="dlg-nota">${t('Si Chrome pregunta si esta página puede <b>editar archivos</b>, di <b>Permitir</b>. Si te ofrece <b>Permitir en cada visita</b>, elígelo y no volverá a preguntar. Lo tuyo de')} <code>src/logic</code> ${t('nunca se sobrescribe.')}</div>`),
      botones: [{ et: t('Cancelar'), valor: null, cancela: true },
                { et: t('Elegir otra carpeta'), valor: 'otra' },
                { et: t('Guardar en') + ' ' + previa.name, valor: 'misma', principal: true }] });
    if (!eleccion) return;
    if (eleccion === 'misma'){
      let permiso = 'denied';
      try {
        permiso = await previa.queryPermission({ mode: 'readwrite' });
        if (permiso !== 'granted') permiso = await previa.requestPermission({ mode: 'readwrite' });
      } catch {}
      if (permiso !== 'granted'){
        await avisar(t('Sin permiso no puedo escribir'),
          `<p>${t('Chrome no dio permiso para editar')} <code>${escDlg(previa.name)}</code>. ${t('Vuelve a exportar y elige')} <b>${t('Permitir')}</b>, ${t('o elige otra carpeta.')}</p>`, 'aviso');
        return;
      }
      raiz = previa;
    }
  } else {
    /* La primera vez: antes del dialogo de Chrome, que asusta si llega
       sin avisar, que se sepa que carpeta elegir y por que pregunta. */
    const seguir = await dialogo({ tipo: 'info', ancho: 540,
      titulo: t('Elige dónde guardar el proyecto'),
      cuerpo: `<p>${t('Elige la carpeta donde guardas tus proyectos (por ejemplo')} <code>Documentos\\Arduino</code>). ${t('Dentro se creará')} <code>${escDlg(carpeta)}</code>, ${t('con todo el proyecto dentro.')}</p>`
        + (nativo ? notaLogica.replace('</div>', ` ${t('Telar la recordará para la próxima vez.')}</div>`) : `<p class="dlg-nota">${t('Chrome no deja elegir Documentos entero (ni el Escritorio ni Descargas). Si quieres el proyecto en')} <code>Documentos\\${escDlg(carpeta)}</code>, ${t('crea ahí esa carpeta con')} <b>${t('Nueva carpeta')}</b> ${t('y elígela: se guarda directo en ella.')}</p>`
        + `<div class="dlg-nota">${t('Después Chrome te preguntará si esta página puede <b>editar archivos</b> en esa carpeta. Di <b>Permitir</b>: sin ese permiso no puede escribir el sketch. Solo toca esa carpeta, y lo tuyo de')} <code>src/logic</code> ${t('nunca se sobrescribe.')} ${t('Telar la recordará para la próxima vez.')}</div>`),
      botones: [{ et: t('Cancelar'), valor: false, cancela: true }, { et: t('Elegir carpeta'), valor: true, principal: true }] });
    if (!seguir) return;
  }

  if (!raiz){
    /* id: Chrome abre el selector donde se quedo la ultima vez */
    try { raiz = await window.showDirectoryPicker({ mode: 'readwrite', id: 'telar-exportar' }); }
    catch { return; }                     /* el usuario cancelo */
    recordarCarpeta(raiz);
  }

  /* dentro: se crea la carpeta del proyecto; si lo elegido ya es ella, no.
     rel y destino dicen al final por donde queda. */
  const dentro = raiz.name !== carpeta;
  const rel = dentro ? carpeta + '\\' : '';
  const destino = raiz.name + (dentro ? '\\' + carpeta : '');

  /* el fichero que se estaba escribiendo, para decirlo si falla */
  let rutaActual = '';
  /* Las fuentes propias, aqui mismo. Van a ficheros como un .c mas, en el
     src/ui/ del sketch de la pantalla (el mismo sitio donde las dejaba
     generar.cmd). La que no se pueda generar se queda para el script. */
  const claveCmd = Object.keys(ficheros).find(k => /(^|\/)fuentes\/generar\.cmd$/.test(k));
  const prog = progresoExportar(`${t('Exportando')} ${escDlg(carpeta)}`, !!claveCmd);
  const fuentes = { hechas: [], fallos: [] };
  if (claveCmd){
    const pre = claveCmd.replace(/fuentes\/generar\.cmd$/, '');
    const ord = ordenesFuentes(ficheros[claveCmd]);
    prog.fuentes(0, ord.length, t('Preparando el conversor…'));
    await respirar();
    let conv = null;
    try { conv = await cargarConversor(); }
    catch (e){ for (const o of ord) fuentes.fallos.push({ o, err: e.message }); }
    if (conv) for (const [i, o] of ord.entries()){
      prog.fuentes(i, ord.length, etiquetaFuente(o.nombre));
      await respirar();
      if (o.falta){ fuentes.fallos.push({ o, err: `${t('no viene con Telar')}: ${o.falta}` }); continue; }
      try {
        const sal = await conv.convertir(o.argv, o.archivos);
        const txt = sal[o.argv[o.argv.indexOf('-o') + 1]];
        if (typeof txt !== 'string' || txt.length < o.minimo) throw new Error(t('salió casi vacía: no tendría glifos'));
        ficheros[pre + 'src/ui/' + o.nombre + '.c'] = txt;
        fuentes.hechas.push(o);
      } catch (e){ fuentes.fallos.push({ o, err: String(e && e.message || e) }); }
    }
    prog.fuentes(ord.length, ord.length, fuentes.fallos.length
      ? `${fuentes.hechas.length} ${t('generadas')}, ${fuentes.fallos.length} ${t('para generar.cmd')}`
      : `${fuentes.hechas.length} ${t('generadas')}`);
  }
  const totalArchivos = Object.keys(ficheros).length;
  prog.archivos(0, totalArchivos);
  try {
    let escritos = 0, saltados = [];
    /* Chrome da InvalidStateError cuando algo del disco cambio desde que
       leyo la carpeta: OneDrive sincronizandola, el IDE guardando a la
       vez... Suele ser pasajero: se vuelve a buscar la carpeta desde la
       raiz y se reintenta dos veces antes de rendirse. */
    const conReintento = async f => {
      for (let i = 0; ; i++){
        try { return await f(); }
        catch (e){
          if (i >= 2 || !(e && e.name === 'InvalidStateError')) throw e;
          await new Promise(ok => setTimeout(ok, 400));
        }
      }
    };

    for (const [ruta, contenido] of Object.entries(ficheros)){
      rutaActual = ruta;
      prog.archivos(escritos + saltados.length, totalArchivos, ruta);
      const hecho = await conReintento(async () => {
        const partes = ruta.split('/');
        let d = dentro ? await raiz.getDirectoryHandle(carpeta, { create:true }) : raiz;
        for (const sub of partes.slice(0, -1)) d = await d.getDirectoryHandle(sub, { create:true });
        const nombre = partes[partes.length - 1];

        /* src/logic/ es del usuario: si ya existe, NO se pisa. Es la
           promesa entera de la herramienta; romperla una vez y nadie
           vuelve a confiar en el boton Exportar. */
        if (/(^|\/)src\/logic\//.test(ruta)){
          let existe = false;
          try { await d.getFileHandle(nombre); existe = true; } catch {}
          if (existe) return 'saltado';
        }

        const fh = await d.getFileHandle(nombre, { create:true });
        const w  = await fh.createWritable();
        await w.write(contenido);
        await w.close();
        return 'escrito';
      });
      if (hecho === 'saltado') saltados.push(ruta); else escritos++;
    }

    /* OJO: solo los tamanos que LVGL trae compilados van a lv_conf.h.
       Mandar activar ahi un LV_FONT_MONTSERRAT_112 declara un simbolo
       que no define nadie, y el fallo sale en el ENLAZADO, sin decir
       una palabra sobre fuentes. */
    const compiladas = PLAN.filter(f => !f.propia).map(f => f.px);
    const propias    = PLAN.filter(f =>  f.propia).map(f => f.px);

    prog.archivos(totalArchivos, totalArchivos, `${escritos} ${t('escritos')}`);
    await respirar();
    prog.cerrar();

    const nFuente = PLAN.find(f => f.propia);
    const enCarpeta = rel + (E.nodos.length > 1 ? carpetaNodo(nodoHMI()) + '\\' : '') + 'fuentes\\';
    const pasos = [];
    if (compiladas.length) pasos.push(`<li><span class="t">${t('Activa en lv_conf.h las fuentes que trae LVGL')}</span>`
      + codigoDlg(compiladas.map(x => `#define LV_FONT_MONTSERRAT_${x} 1`).join('\n')) + `</li>`);
    /* Las fuentes propias: generadas aqui, ya no hay paso. Solo si alguna
       no se pudo, el paso de siempre, diciendo cuales y por que. */
    const fuentesListas = propias.length && fuentes.hechas.length && !fuentes.fallos.length;
    if (propias.length && !fuentesListas) pasos.push(`<li class="clave"><span class="t">${t('Imprescindible: genera las fuentes propias')} (${[...new Set(propias)].sort((x, y) => x - y).join(', ')} px)</span>`
      + (fuentes.fallos.length ? `<div class="dlg-nota aviso">${t('Telar no pudo generar')} ${fuentes.fallos.map(x => `<b>${escDlg(etiquetaFuente(x.o.nombre))}</b> (${escDlg(x.err)})`).join(', ')}.</div>` : '')
      + `${t('Entra en esta carpeta del proyecto y ejecuta')} <code>generar.cmd</code>. ${t('Los .c van solos a')} <code>src\\ui\\</code>.`
      + codigoDlg(raiz.name + '\\' + enCarpeta + 'generar.cmd')
      + `<div class="dlg-nota aviso">${t('Si te lo saltas, el enlazador dirá')} <code>undefined reference to '${escDlg(nFuente ? nombreFuente(nFuente) : '')}'</code>. ${t('No las pongas en lv_conf.h: LVGL no las tiene.')}</div></li>`);
    pasos.push(`<li><span class="t">${t('En Herramientas del IDE de Arduino')}</span>`
      + codigoDlg(Object.entries(placa().opciones_ide).map(([k, v]) => `${k}: ${v}`).join('\n')) + `</li>`);
    await dialogo({ tipo: 'ok', ancho: 580,
      titulo: `${t('Listo')}: ${escritos} ${t('ficheros en')} ${destino}`,
      cuerpo: (saltados.length ? `<div class="dlg-nota">${t('Respetado, porque es tuyo:')} ${saltados.map(s => `<code>${escDlg(s)}</code>`).join(', ')}</div>` : '')
        + (fuentesListas ? `<div class="dlg-nota ok">✓ ${t('Fuentes generadas')}: <b>${fuentes.hechas.length}</b>, ${t('ya en')} <code>src\\ui\\</code>. ${t('No hay que ejecutar nada.')}</div>` : '')
        + `<p>${t('Antes de subirlo a la placa:')}</p><ol class="dlg-pasos">${pasos.join('')}</ol>`,
      botones: [{ et: t('Entendido'), valor: true, principal: true }] });
  } catch (err){
    prog.cerrar();
    /* InvalidStateError / NotFoundError: la carpeta que se eligio (o una de
       dentro) ya no es la que Chrome leyo. Elegirla de nuevo lo arregla:
       se olvida la recordada y se vuelve a exportar desde el principio. */
    const cambio = err && (err.name === 'InvalidStateError' || err.name === 'NotFoundError');
    const donde = rutaActual ? `<p>${t('Falló al escribir')} <code>${escDlg(destino + '\\' + rutaActual.replace(/\//g, '\\'))}</code>.</p>` : '';
    const otra = await dialogo({ tipo: 'error', ancho: 580,
      titulo: t('No se pudo escribir el proyecto'),
      cuerpo: donde
        + (cambio
          ? `<p>${t('Chrome dice que esa carpeta cambió en el disco desde que la elegiste, y no se fía de escribir en ella. Pasa cuando:')}</p>`
            + listaDlg([t('la carpeta, o una de dentro, se movió, se renombró o se borró después de elegirla;'),
                        t('la está sincronizando OneDrive (Imágenes, Música y Documentos suelen estarlo);'),
                        t('el IDE de Arduino tiene abierto el proyecto y guarda a la vez.')])
            + `<p><b>${t('Cierra el proyecto en el IDE y elige la carpeta de nuevo:')}</b> ${t('así Chrome la vuelve a leer. Ya lo reintenté dos veces.')}</p>`
          : `<p>${t('Suele ser una carpeta de solo lectura o un fichero abierto en otro programa (el IDE de Arduino, por ejemplo). Ciérralo y vuelve a exportar.')}</p>`)
        + `<p>${t('El sistema dijo:')}</p>` + codigoDlg(`${err && err.name ? err.name + ': ' : ''}${err && err.message}`),
      botones: cambio
        ? [{ et: t('Cerrar'), valor: false, cancela: true }, { et: t('Elegir la carpeta de nuevo'), valor: true, principal: true }]
        : [{ et: t('Entendido'), valor: false, principal: true }] });
    if (otra){ await recordarCarpeta(null); return exportar(); }
  }
}

document.getElementById('btnExportar').replaceWith(
  Object.assign(document.getElementById('btnExportar').cloneNode(true), {}));
document.getElementById('btnExportar').addEventListener('click', exportar);

   veia, pero conectarPanel() no llegaba a ejecutarse y ningun boton
   respondia hasta cambiar de pestana y repintar. */
pintar();
marcarGuardado();
</script>
