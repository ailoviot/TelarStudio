<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentación de Telar</title>
<style>
  /* Una sola apariencia, oscura, a propósito: es la del editor, y los
     colores de la sintaxis están pensados para ese fondo. */
  :root{
    --fondo:#14161c; --panel:#1b1e26; --panel2:#222630; --borde:#2e333f;
    --texto:#e6e9ef; --tenue:#9aa3b2; --debil:#6b7280;
    --acento:#3b9dff; --ok:#3ddc97; --aviso:#f5a524; --error:#f45b5b;
    --azul-suave:#7fa6d8;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.6 var(--ui)}
  a{color:var(--acento)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:4px}
  code{font-family:var(--mono);font-size:.92em;background:var(--panel2);border:1px solid var(--borde);border-radius:4px;padding:0 4px}

  /* ------------------------------------------------ marco e índice */
  .marco{display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px;max-width:1320px;margin:0 auto;padding:24px 24px 64px}
  @media (max-width:900px){.marco{grid-template-columns:minmax(0,1fr);gap:20px}.indice{position:static!important;max-height:none!important}}
  .indice{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;font-size:14px;padding-right:4px}
  .cabeza{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .marca{display:block;text-decoration:none;color:var(--texto);font-weight:700;font-size:16px;margin:0 0 2px}
  .marca small{display:block;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--debil);font-weight:400}
  .idioma{display:flex;flex:none;border:1px solid var(--borde);border-radius:7px;overflow:hidden;margin-top:2px}
  .idioma button{background:transparent;border:0;color:var(--tenue);font:600 11px var(--mono);letter-spacing:.06em;padding:5px 8px;cursor:pointer}
  .idioma button[aria-pressed="true"]{background:var(--panel2);color:var(--texto);box-shadow:inset 0 -2px 0 var(--acento)}
  .parte{margin-top:20px}
  .parte > b{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--azul-suave);margin:0 0 6px}
  .indice a.cap{display:flex;gap:8px;color:var(--tenue);text-decoration:none;padding:4px 8px;border-radius:6px;line-height:1.35}
  .indice a.cap span{flex:none;width:18px;font:12px/1.6 var(--mono);color:var(--debil);text-align:right}
  .indice a.cap:hover{color:var(--texto);background:var(--panel)}
  .indice a.cap.activo{color:var(--texto);background:var(--panel2);box-shadow:inset 2px 0 0 var(--acento)}
  .indice a.cap.activo span{color:var(--acento)}
  .indice .subs{margin:2px 0 6px 34px;border-left:1px solid var(--borde)}
  .indice .subs a{display:block;color:var(--tenue);text-decoration:none;padding:3px 0 3px 10px;font-size:13px;line-height:1.35}
  .indice .subs a:hover{color:var(--texto)}
  .indice .subs a i{font:normal 11px var(--mono);color:var(--debil);margin-right:6px}

  main{min-width:0;outline:none}
  .eyebrow{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--azul-suave);margin:4px 0 6px}
  h1{margin:0 0 8px;font-size:30px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
  .lead{margin:0 0 8px;color:var(--tenue);max-width:68ch;font-size:16px}
  h2{font-size:20px;margin:36px 0 8px;text-wrap:balance}
  h3{font-size:16px;margin:26px 0 8px;text-wrap:balance}
  h4{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--azul-suave);margin:18px 0 6px}
  p{max-width:70ch}
  .tenue{color:var(--tenue)}

  /* ------------------------------------------------ inicio */
  .partes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
  @media (max-width:700px){ .partes{grid-template-columns:1fr} }
  .tarjeta-parte{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:16px 18px}
  .tarjeta-parte .n{font:600 12px var(--mono);color:var(--azul-suave);letter-spacing:.08em;text-transform:uppercase}
  .tarjeta-parte h2{margin:2px 0 6px;font-size:18px}
  .tarjeta-parte p{margin:0 0 10px;color:var(--tenue);font-size:14px}
  .tarjeta-parte ol{margin:0;padding:0;list-style:none;border-top:1px solid var(--borde)}
  .tarjeta-parte li a{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #262b36;color:var(--texto);text-decoration:none;font-size:14px}
  .tarjeta-parte li a:hover{color:var(--acento)}
  .tarjeta-parte li a span{flex:none;width:18px;font:12px/1.7 var(--mono);color:var(--debil);text-align:right}
  .consejo{margin-top:18px;background:color-mix(in srgb,var(--acento) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--acento) 30%,var(--borde));border-radius:10px;padding:12px 16px;max-width:none}
  .consejo b{color:#cfe3ff}

  /* ------------------------------------------------ dentro de un capítulo */
  .en-cap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px}
  .en-cap b{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--debil);margin-right:4px}
  .en-cap a{font-size:13px;color:#cfe3ff;background:var(--panel);border:1px solid var(--borde);border-radius:99px;padding:2px 10px;text-decoration:none}
  .en-cap a i{font:normal 11px var(--mono);color:var(--debil);margin-right:5px}
  .en-cap a:hover{border-color:var(--acento)}
  .pie-cap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:44px;padding-top:18px;border-top:1px solid var(--borde)}
  .pie-cap a{display:block;background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:10px 14px;text-decoration:none;color:var(--texto)}
  .pie-cap a:hover{border-color:var(--acento)}
  .pie-cap a small{display:block;font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--debil)}
  .pie-cap a.sig{text-align:right;grid-column:2}

  /* El código va arriba, a todo lo ancho, y las frases debajo. Lado a lado,
     cada uno quedaba a media columna y las líneas largas obligaban a
     desplazarse de lado para leerlas. */
  .dos{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

  /* --- código con los mismos colores que el editor --- */
  .cod{margin:0;background:#0f1116;border:1px solid var(--borde);border-radius:8px;padding:10px 0;
    font:13px/1.65 var(--mono);color:#c7cfdb;overflow-x:auto}
  .cod .ln{display:block;white-space:pre;padding:0 14px}
  .cod .ln.mal{background:color-mix(in srgb,var(--error) 14%,transparent);box-shadow:inset 3px 0 0 var(--error)}
  .lg-k{color:#8fb8ff} .lg-kw{color:#c9a0ff} .lg-v{color:#9fe0bf} .lg-nm{color:#ffd89a} .lg-n{color:#f5c07a}
  .lg-s{color:#b5e8c9} .lg-cm{color:#6b7a90;font-style:italic} .lg-p{color:#6b7280} .lg-op{color:#f0a3a3}
  .lg-st{color:#e6f1ff;background:#23324a;border-radius:3px;padding:0 2px}

  /* --- los widgets, uno a uno: una ficha por widget --- */
  /* minmax(0,1fr) y min-width:0: sin ellos, un bloque de codigo largo ensancha la
     columna y en el movil la ficha se sale por la derecha */
  .wfichas{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin:10px 0 22px}
  .wficha{min-width:0}
  .wficha{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:14px 16px;scroll-margin-top:12px}
  .wficha h3{margin:0 0 2px;font-size:17px}
  .wficha .wf-img{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--borde);margin:8px 0 10px}
  .wficha .wf-pie{margin:-4px 0 10px;color:var(--debil);font-size:13px;font-style:italic}
  .wficha .wf-que{margin:0 0 8px;color:var(--texto)}
  .wficha ol{margin:0 0 8px;padding-left:20px;color:var(--tenue)}
  .wficha ol li{margin:2px 0}
  .wficha .wf-ej{margin:8px 0 6px}
  .wficha .wf-nota{margin:6px 0 0;color:var(--tenue);font-size:14px}
  .wf-grupo{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--azul-suave);margin:18px 0 0}
  b[class^="lg-"]{font-weight:inherit}
  .leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font:12.5px var(--mono);margin:10px 0 0}
  .leyenda span{display:flex;align-items:center;gap:6px;color:var(--tenue)}

  .frases{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:6px 14px;font-size:14px;align-self:start}
  .frases div{padding:5px 0;border-top:1px dashed #2a303c}
  .frases div:first-child{border-top:0}
  .frases b{color:#ffd89a;font-weight:600}
  .frases .tit{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--debil)}

  /* --- un ejemplo --- */
  .caja{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:18px 20px 20px;margin-top:18px;scroll-margin-top:16px}
  .cab-ej{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .cab-ej h3{margin:0}
  .num{flex:none;width:30px;height:30px;border-radius:8px;background:#1b2a41;border:1px solid #2a3f5f;color:#cfe3ff;
    font:600 14px/28px var(--mono);text-align:center;font-variant-numeric:tabular-nums}
  .para{margin:8px 0 0;color:#d3dae6}
  .sello{display:inline-block;font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;border-radius:5px;padding:4px 7px}
  .sello.ok{color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent)}
  .sello.mal{color:var(--error);border:1px solid color-mix(in srgb,var(--error) 45%,transparent)}
  .sello.dis{color:var(--tenue);border:1px solid var(--borde)}
  .aprende{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
  .aprende span{font-size:12.5px;color:#cfe3ff;background:#1b2a41;border:1px solid #2a3f5f;border-radius:99px;padding:2px 10px}
  .necesita{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:0 0 14px}
  @media (max-width:600px){.necesita{grid-template-columns:minmax(0,1fr)}}
  .necesita div{background:var(--panel2);border:1px solid var(--borde);border-radius:7px;padding:9px 12px;font-size:13.5px}
  .necesita strong{display:block;font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--azul-suave);margin-bottom:4px}
  .necesita ul{margin:0;padding-left:18px}
  .pasos{margin:0;padding-left:22px;max-width:72ch}
  .pasos li{margin:5px 0;padding-left:4px}
  .pasos li::marker{color:var(--azul-suave);font:600 13px var(--mono)}
  .prueba{margin-top:16px;background:color-mix(in srgb,var(--ok) 7%,var(--panel2));border:1px solid color-mix(in srgb,var(--ok) 30%,var(--borde));border-radius:8px;padding:10px 14px}
  .prueba strong,.ojo strong{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
  .prueba strong{color:var(--ok)}
  .prueba ol{margin:0;padding-left:20px}
  .prueba li{margin:3px 0}
  .ojo{margin-top:10px;background:color-mix(in srgb,var(--aviso) 8%,var(--panel2));border:1px solid color-mix(in srgb,var(--aviso) 32%,var(--borde));border-radius:8px;padding:10px 14px;font-size:14.5px}
  .ojo strong{color:var(--aviso)}
  .variac{margin:12px 0 0;font-size:13.5px;color:var(--tenue)}
  .variac b{color:var(--texto);font-weight:600}
  .leer{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
  .leer div{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:10px 12px;font-size:14px}
  .leer b{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--azul-suave);margin-bottom:2px}

  /* --- diccionario --- */
  /* Una columna: los ejemplos del diccionario son líneas enteras que no se
     pueden partir (las llaves abren y cierran en la misma línea). */
  .dicc{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
  .grupo h3{margin:0 0 8px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--azul-suave)}
  .palabra{padding:10px 0;border-top:1px solid #262b36;scroll-margin-top:16px}
  .palabra .cab{display:flex;align-items:baseline;gap:10px}
  .palabra .cab code{font-size:13.5px;color:#cfe3ff;background:none;border:0;padding:0}
  .palabra .cab small{color:var(--debil);font-size:12px}
  .palabra p{margin:4px 0 6px;font-size:14px;color:#d3dae6}
  .palabra .cod{font-size:12.5px;padding:6px 0}
  /* «Donde va»: la linea de la palabra, marcada */
  .cod .ln.aqui{background:color-mix(in srgb,var(--acento) 16%,transparent);box-shadow:inset 3px 0 0 var(--acento)}
  .donde{margin:6px 0 8px}
  .donde > span{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--azul-suave);margin-bottom:4px}

  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--borde);vertical-align:top}
  th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--tenue)}
  .tabla{overflow-x:auto;margin-top:12px}

  .error{margin-top:22px}
  .error h3{margin:0 0 8px}
  .msg{display:flex;gap:10px;background:color-mix(in srgb,var(--error) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--error) 35%,var(--borde));
    border-radius:7px;padding:8px 12px;font-size:14px;margin-top:8px}
  .msg b.l{font:600 12px var(--mono);color:var(--error);white-space:nowrap;padding-top:2px}
  .reglas li{margin:6px 0;max-width:70ch}
  .aviso-carga{background:color-mix(in srgb,var(--error) 12%,var(--panel));border:1px solid var(--error);border-radius:8px;padding:12px 16px}
</style>
</head>
<body>
<div class="marco">
  <nav class="indice" aria-label="Índice / Contents" id="indice"></nav>
  <main id="contenido" tabindex="-1"><p class="tenue">Cargando… / Loading…</p></main>
</div>

<script>
/* =====================================================================
 * DOCUMENTACIÓN DE TELAR — la lógica y las pantallas, en español y en inglés
 *
 * Un solo sitio, en cuatro partes: Empezar, Aprender paso a paso,
 * Consultar y Pantallas. Se ve un capítulo cada vez, con Anterior y
 * Siguiente.
 *
 * El idioma: ?lang=en|es (lo pasa el editor), si no el último elegido
 * (telar_idioma, el mismo que usa el editor), si no español. Lo que viene
 * de logica.js —diccionario, recetas, frases y errores— se pide en el
 * mismo idioma con LOGICA.setLang.
 *
 * Todo código de esta página se valida al abrirla con el mismo logica.js
 * que usa el editor: si el lenguaje cambia y un ejemplo deja de valer,
 * aparece en rojo en vez de quedarse mintiendo.
 * ===================================================================== */

let LANG = (() => {
  const p = new URLSearchParams(location.search).get('lang');
  if (p === 'es' || p === 'en') return p;
  try { const g = localStorage.getItem('telar_idioma'); if (g === 'es' || g === 'en') return g; } catch (e) {}
  return 'es';
})();
/* X('español', 'english') y T({ es, en }): el texto en el idioma elegido */
const X = (es, en) => LANG === 'en' ? en : es;
const T = v => v && typeof v === 'object' && !Array.isArray(v) && 'es' in v ? (v[LANG] ?? v.es) : v;

/* ------------------------------------------------------------ piezas
   Lo que los ejemplos necesitan FUERA de la lógica. Se describe una vez y
   cada ejemplo dice cuáles usa: así «voltage» significa lo mismo en todos.
   Los nombres de botones y campos son los que se ven en el editor. */
const PIEZAS = {
  voltage:   { hw: { lee: true }, que: { es: 'Entrada analógica (ADC). En sus parámetros: Unidad <code>kV</code>, valor con el pin a 0 V <code>0</code> y con el pin al máximo <code>264</code>',
                                         en: 'Analog input (ADC). In its parameters: Unit <code>kV</code>, value with the pin at 0 V <code>0</code> and value with the pin at maximum <code>264</code>' } },
  pwm_out:   { hw: { escribe: true, booleano: false }, que: { es: 'Salida PWM, con el rango 0–255', en: 'PWM output, with range 0–255' } },
  relay:     { hw: { escribe: true, booleano: true }, que: { es: 'Salida digital: el relé', en: 'Digital output: the relay' } },
  motor_dir: { hw: { escribe: true, booleano: true }, que: { es: 'Salida digital: el sentido del motor (ON sube, OFF baja)', en: 'Digital output: the motor direction (ON up, OFF down)' } },
  level:     { hw: { lee: true }, que: { es: 'Entrada analógica (ADC): el nivel del tanque, de 0 a 100 %', en: 'Analog input (ADC): the tank level, from 0 to 100 %' } },
  pump:      { hw: { escribe: true, booleano: true }, que: { es: 'Salida digital: la bomba', en: 'Digital output: the pump' } },
  bip:       { hw: { escribe: true, booleano: true }, que: { es: 'Salida digital: el zumbador', en: 'Digital output: the buzzer' } },
};
const bound = (es, en, v) => ({ es: `${es}, enlazado a <code>${v}</code>`, en: `${en}, bound to <code>${v}</code>` });
const boton = txt => ({ es: `Botón con el texto ${txt}`, en: `Button with the text ${txt}` });
const ELEMENTOS = {
  reading:        { tipo: 'lectura', que: bound('Número', 'Number', 'voltage') },
  sp_view:        { tipo: 'lectura', que: bound('Número', 'Number', 'setpoint') },
  power_view:     { tipo: 'lectura', que: bound('Número', 'Number', 'power') },
  level_view:     { tipo: 'lectura', que: bound('Número', 'Number', 'level') },
  time_view:      { tipo: 'tiempo', que: bound('Tiempo', 'Time', 'hold_time') },
  countdown:      { tipo: 'tiempo', que: bound('Tiempo', 'Time', 'remaining') },
  btn_minus:      { tipo: 'button', que: boton('−') },
  btn_plus:       { tipo: 'button', que: boton('+') },
  btn_time_minus: { tipo: 'button', que: boton('−') },
  btn_time_plus:  { tipo: 'button', que: boton('+') },
  btn_start:      { tipo: 'button', que: boton('START') },
  btn_reset:      { tipo: 'button', que: boton('RESET') },
  fault_led:      { tipo: 'led',    que: bound('Piloto', 'LED', 'fault') },
  rounds_view:    { tipo: 'lectura', que: bound('Número', 'Number', 'rounds') },
  pieces_view:    { tipo: 'lectura', que: bound('Número', 'Number', 'pieces') },
  total_view:     { tipo: 'lectura', que: bound('Número', 'Number', 'total') },
  btn_jog:        { tipo: 'button', que: boton('JOG') },
  btn_stop:       { tipo: 'button', que: boton('STOP') },
  btn_lower:      { tipo: 'button', que: { es: 'Botón con el texto BAJAR', en: 'Button with the text LOWER' } },
  btn_on:         { tipo: 'button', que: boton('ON') },
  btn_save:       { tipo: 'button', que: { es: 'Botón con el texto Guardar', en: 'Button with the text Save' } },
  btn_load:       { tipo: 'button', que: { es: 'Botón con el texto Cargar', en: 'Button with the text Load' } },
  strip:          { tipo: 'pildora', que: { es: 'Estado actual (opcional): muestra en qué estado estás', en: 'Current state (optional): shows which state you are in' } },
};

/* ----------------------------------------------------------- ejemplos
   grupo: el capítulo donde va. codigo: null si se hace solo con el editor.
   {{ej:id}} se cambia por un enlace «ejemplo N»: los números no se
   escriben a mano, así que agregar un ejemplo no descuadra las referencias. */
const EJEMPLOS = [
  /* ================================== capítulo: mostrar y ajustar */
  {
    id: 'medicion', grupo: 'mostrar',
    titulo: { es: 'Mostrar una medición en la pantalla', en: 'Show a measurement on the screen' },
    para: { es: 'Ver en grande lo que mide un sensor, con sus unidades reales.', en: 'See in large what a sensor measures, in its real units.' },
    aprende: { es: ['Hardware', 'Enlazado a', 'escala'], en: ['Hardware', 'Bound to', 'scale'] },
    hw: ['voltage'], lienzo: ['reading'],
    codigo: null,
    pasos: {
      es: [
        'En la pestaña <b>Hardware</b>, añade una <b>Entrada analógica (ADC)</b> y ponle de nombre <code>voltage</code>.',
        'En sus parámetros, escribe la <b>Unidad</b> (<code>kV</code>) y la escala: qué valor corresponde al pin a 0 V (<code>0</code>) y al pin al máximo (<code>264</code>). Así la pantalla muestra kilovoltios y no un número del 0 al 4095.',
        'En <b>Diseño</b>, añade un <b>Número</b> y en <b>Enlazado a</b> elige <code>voltage</code>. En <b>Decimales</b> eliges cuántos se ven.',

`cycle:
  variables:

  start_in: IDLE
  states:
    IDLE:
      on enter: [set pwm_out to 0, turn off motor_brake, turn off relay]
    RAISING:
      on enter: [turn on relay, turn on motor_dir, set pwm_out to 21]
      if voltage >= setpoint: [go to HOLDING]
    HOLDING:
      on enter: [set pwm_out to 0, restart remaining]
      while: [count remaining]
      if remaining == 0: [go to LOWERING]
    LOWERING:
      on enter: [turn off motor_dir, set pwm_out to 21]
      if voltage <= zero_level: [go to IDLE]

  buttons:
    btn_minus:
      in IDLE: [decrease setpoint]
      repeat: yes
    btn_plus:
      in IDLE: [increase setpoint]
      repeat: yes
    btn_time_minus:
      in IDLE: [decrease hold_time]
      repeat: yes
    btn_time_plus:
      in IDLE: [increase hold_time]
      repeat: yes
    btn_start:
      in IDLE: [go to RAISING]
    btn_stop:
      always: [go to IDLE]

    btn_start:
      in IDLE:     { text: START,    color: green }
      in RAISING:  { text: RAISING,  color: amber }
      in HOLDING:  { text: HOLDING,  color: blue }

/* ============================================================ pintar */
const $ = id => document.getElementById(id);
const esc = s => LOGICA.esc(s);
const cod = (txt, malas) => `<pre class="cod">${String(txt).replace(/\n$/, '').split('\n')
  .map((l, i) => `<span class="ln${malas && malas.has(i + 1) ? ' mal' : ''}">${LOGICA.highlightLine(l) || ' '}</span>`).join('')}</pre>`;
const frases = model => `<div class="frases"><div class="tit">${X('Qué dice, en frases', 'What it says, in sentences')}</div>${LOGICA.sentences(model).map(f => `<div>${f.text}</div>`).join('')}</div>`;
const lista = xs => `<ul>${xs.map(x => `<li>${x}</li>`).join('')}</ul>`;
const numeroDe = id => EJEMPLOS.findIndex(e => e.id === id) + 1;
const refs = s => String(s).replace(/\{\{ej:([\w-]+)\}\}/g, (_, id) => `<a href="#ej-${id}">${X('ejemplo', 'example')} ${numeroDe(id)}</a>`);
const sello = (v, bien) => v.errors.length
  ? `<span class="sello mal">${v.errors.length} ${v.errors.length === 1 ? 'error' : X('errores', 'errors')}</span>`
  : `<span class="sello ok">${bien || X('válido', 'valid')}</span>`;
const codigoYFrases = (txt, v) => `<div class="dos">${cod(txt)}${v.model ? frases(v.model)
  : `<div class="frases">${v.errors.map(x => `<div>${X('línea', 'line')} ${x.line}: ${x.msg}</div>`).join('')}</div>`}</div>`;
const prueba = pasos => `<div class="prueba"><strong>${X('Pruébalo en el simulador', 'Try it in the simulator')}</strong><ol>${T(pasos).map(p => `<li>${p}</li>`).join('')}</ol></div>`;

function ctxDe(e){
  const hardware = {}, widgets = {};
  for (const n of e.hw) hardware[n] = PIEZAS[n].hw;
  for (const n of e.lienzo) widgets[n] = { tipo: ELEMENTOS[n].tipo };
  return { hardware, widgets };
}

function tarjeta(e){
  let s = `<span class="sello dis">${X('sin código', 'no code')}</span>`, cuerpo = '';
  if (e.codigo){ const v = LOGICA.validate(e.codigo, ctxDe(e)); s = sello(v); cuerpo = codigoYFrases(e.codigo, v); }
  const piezas = e.hw.length ? lista(e.hw.map(n => `<code>${n}</code> — ${T(PIEZAS[n].que)}`)) : X('nada', 'nothing');
  const elementos = [...e.lienzo.map(n => `<code>${n}</code> — ${T(ELEMENTOS[n].que)}`), ...(T(e.lienzoTexto) || [])];
  return `<div class="caja" id="ej-${e.id}">
    <div class="cab-ej"><span class="num">${numeroDe(e.id)}</span><h3>${T(e.titulo)}</h3>${s}</div>
    <p class="para">${T(e.para)}</p>
    <div class="aprende">${T(e.aprende).map(a => `<span>${esc(a)}</span>`).join('')}</div>
    <div class="necesita">
      <div><strong>${X('En Hardware', 'In Hardware')}</strong>${piezas}</div>
      <div><strong>${X('En el lienzo', 'On the canvas')}</strong>${elementos.length ? lista(elementos) : X('nada', 'nothing')}</div>
    </div>
    ${cuerpo}
    <h4>${e.codigo ? X('Cómo funciona', 'How it works') : X('Cómo se hace', 'How to do it')}</h4>
    <ol class="pasos">${T(e.pasos).map(p => `<li>${refs(p)}</li>`).join('')}</ol>
    ${prueba(e.prueba)}
    ${e.ojo ? `<div class="ojo"><strong>${X('Cuidado', 'Watch out')}</strong>${refs(T(e.ojo))}</div>` : ''}
    <p class="variac"><b>${X('En el ciclo del variac:', 'In the variac cycle:')}</b> ${refs(T(e.variac))}</p>
  </div>`;
}
const ejemplosDe = grupo => EJEMPLOS.filter(e => e.grupo === grupo);

const codAqui = txt => `<pre class="cod">${String(txt).split('\n')
  .map(l => `<span class="ln${l.startsWith('@') ? ' aqui' : ''}">${LOGICA.highlightLine(l.replace(/^@/, '')) || ' '}</span>`).join('')}</pre>`;

/* «Un bloque que mira a otro»: if motor is RUNNING, con su programa validado */
function mirarOtroBloque(){
  const b = BASES.mirar, v = LOGICA.validate(b.codigo, b.ctx);
  return X(`
      <h2 id="bl-mirar">Un bloque que mira a otro</h2>
      <p>Cada bloque está en su propio estado, y a veces uno necesita saber en cuál está otro: una alarma que solo tiene sentido
      con el motor en marcha, una luz que acompaña a un ciclo. Para eso está <code>is</code>: <code>if motor is RUNNING</code> se
      cumple mientras el bloque <code>motor</code> está en <code>RUNNING</code>.</p>`, `
      <h2 id="bl-mirar">A block that looks at another</h2>
      <p>Each block is in its own state, and sometimes one needs to know which state another is in: an alarm that only makes sense
      with the motor running, a light that goes along with a cycle. That is what <code>is</code> is for: <code>if motor is RUNNING</code>
      holds while block <code>motor</code> is in <code>RUNNING</code>.</p>`) + `
      <div class="caja">
        <div class="cab-ej"><h3>${X('Una alarma que solo vale con el motor en marcha', 'An alarm that only counts with the motor running')}</h3>${sello(v)}</div>
        <div class="necesita">
          <div><strong>${X('En Hardware', 'In Hardware')}</strong><ul><li><code>motor</code> — ${X('Salida digital: el motor', 'Digital output: the motor')}</li><li><code>buzzer</code> — ${X('Salida digital: el zumbador', 'Digital output: the buzzer')}</li><li><code>temperature</code> — ${X('Entrada analógica: la temperatura, en °C', 'Analog input: the temperature, in °C')}</li></ul></div>
          <div><strong>${X('En el lienzo', 'On the canvas')}</strong><ul><li><code>btn_main</code> — ${X('Botón con el texto MARCHA', 'Button with the text START')}</li></ul></div>
        </div>
        ${codigoYFrases(b.codigo, v)}
        <h4>${X('Cómo funciona', 'How it works')}</h4>
        <ol class="pasos">${T({
          es: ['El bloque <code>motor</code> arranca y para con <code>btn_main</code>; el bloque <code>alarm</code> vigila.',
               '<code>if motor is RUNNING and temperature &gt; 60</code>: la alarma salta solo si el motor anda <b>y</b> hace calor. Con el motor parado, el calor no la dispara.',
               '<code>is not</code> es lo contrario: la alarma se calla si el motor para <b>o</b> la temperatura baja de 55. Que sean 55 y no 60 evita que salte y se calle a cada rato.',
               'Solo se <b>pregunta</b>: la alarma no puede hacer <code>go to RUNNING</code> del motor. Si lo intentas, el editor te lo dice y te propone el <code>if motor is …</code>.',
               'Un bloque también puede preguntar por sí mismo, pero no hace falta: cada estado ya sabe dónde está.'],
          en: ['Block <code>motor</code> starts and stops with <code>btn_main</code>; block <code>alarm</code> keeps watch.',
               '<code>if motor is RUNNING and temperature &gt; 60</code>: the alarm goes off only if the motor is running <b>and</b> it is hot. With the motor stopped, heat does not trigger it.',
               '<code>is not</code> is the opposite: the alarm goes quiet if the motor stops <b>or</b> the temperature drops below 55. Using 55 and not 60 keeps it from going on and off all the time.',
               'It only <b>asks</b>: the alarm cannot do <code>go to RUNNING</code> of the motor. If you try, the editor tells you and suggests <code>if motor is …</code>.',
               'A block can also ask about itself, but there is no need: each state already knows where it is.'],
        }).map(x => `<li>${x}</li>`).join('')}</ol>
        ${prueba({
          es: ['Simula: arriba a la derecha salen dos estados, el de <code>motor</code> y el de <code>alarm</code>.',
               'Sube <code>temperature</code> a 65: no pasa nada, porque el motor está parado. Pulsa MARCHA: la alarma pasa a WARNING y <code>buzzer</code> parpadea.',
               'Pulsa MARCHA otra vez para parar el motor: la alarma se calla aunque siga el calor.'],
          en: ['Simulate: at the top right there are two states, the one of <code>motor</code> and the one of <code>alarm</code>.',
               'Raise <code>temperature</code> to 65: nothing happens, because the motor is stopped. Press START: the alarm switches to WARNING and <code>buzzer</code> blinks.',
               'Press START again to stop the motor: the alarm goes quiet even though it is still hot.'],
        })}
        <div class="ojo"><strong>${X('Cuidado', 'Watch out')}</strong>${X('Los botones no llevan condiciones, así que un botón no puede decir «solo si el motor anda». Para eso, que el botón lleve a un estado de paso que decida con <code>if motor is RUNNING</code> y <code>else</code>, como en {{ej:bandera}}.'.replace(/\{\{ej:(\w+)\}\}/g, (_, id) => `<a href="#ej-${id}">ejemplo ${numeroDe(id)}</a>`),
          'Buttons have no conditions, so a button cannot say "only if the motor is running". For that, make the button lead to a deciding state that uses <code>if motor is RUNNING</code> and <code>else</code>, as in {{ej:bandera}}.'.replace(/\{\{ej:(\w+)\}\}/g, (_, id) => `<a href="#ej-${id}">example ${numeroDe(id)}</a>`))}</div>
      </div>`;
}

    <p class="tenue">Las palabras del lenguaje van en inglés. Los nombres que pones tú —estados, variables, botones— también
    conviene escribirlos en inglés, para que todo se lea de corrido.</p>

    <h2 id="ed-logica">La pestaña Lógica</h2>
    <p>En el centro escribes; a la izquierda, el panel te ayuda. Arriba del panel, siempre a la vista, dice si la lógica es
    válida o cuántas cosas hay que arreglar: la raya de debajo se pone verde o roja.</p>

        <tr><td>Panel · arriba</td><td>si es válida y <b>+ Bloque nuevo</b></td><td>ver de un vistazo si se puede exportar o empezar otra función. Esta guía se abre desde <b>Documentación</b>, arriba en la barra, o con F1</td></tr>
        <tr><td>Panel · <b>Índice</b></td><td>las variables, los estados, los botones y los aspectos, por su nombre</td><td>con un clic, el editor salta a esa línea; en azul, donde estás; en rojo, lo que tiene un error</td></tr>

        <tr><td>Panel · <b>¿Qué es esto?</b></td><td>qué significa la palabra donde está el cursor, con un ejemplo</td><td>entender lo que lees sin salir del editor</td></tr>
        <tr><td>Panel · <b>Qué puedes escribir aquí</b></td><td>lo que cabe en ese sitio del programa</td><td>un clic lo escribe por ti</td></tr>
        <tr><td>Panel · <b>Recetas</b></td><td>aparatos completos, listos para añadir (empieza plegada)</td><td>empezar con algo que ya funciona</td></tr>
        <tr><td>Botones <b>Código</b> y <b>Frases</b></td><td>el programa, o lo mismo dicho en frases</td><td>comprobar que hace lo que quieres</td></tr>
      </tbody>
    </table></div>
    <p class="tenue">Las secciones del panel se pliegan con un clic en su título y se quedan como las dejaste.</p>

    <h2 id="ed-simulador">El simulador</h2>
    <p><b>▶ Simular</b> prueba la pantalla y la lógica sin compilar ni flashear. En el centro está la pantalla, que se toca como la
    de verdad; a la derecha, el banco de pruebas. Todos los <b>Pruébalo</b> de esta guía se hacen aquí.</p>
    <div class="tabla"><table>
      <thead><tr><th>En el banco</th><th>Para qué</th></tr></thead>
      <tbody>
        <tr><td>Arriba, siempre a la vista</td><td>el reloj, el <b>estado actual</b> de cada bloque y la velocidad: <b>×1</b>, <b>×5</b> o <b>×20</b> (con ×20, un minuto pasa en 3 segundos)</td></tr>
        <tr><td><b>Saltar a un estado</b></td><td>ir directo a un estado, con su <code>on enter</code>, para ver cómo se ve sin tener que provocarlo</td></tr>

        <tr><td><b>Registro</b></td><td>todo lo que pasó, con su hora</td></tr>
      </tbody>
    </table></div>`, `
    <p>Logic is written in the <b>Logic</b> tab of the editor. On export, Telar turns it into C code
    (<code>logica.cpp</code>) and connects it to the board; on a Linux screen it goes into <code>proyecto.json</code>. If you ever need hand-written code, it goes in
    <code>src/logic/</code>, which the export never deletes.</p>
    <p>Each thing <b>is created in one place only</b>. The logic does not declare again what already exists in another tab: it uses it by name.</p>
    <div class="tabla"><table>
      <thead><tr><th>This</th><th>Is created in</th><th>In the logic it is…</th></tr></thead>

        <tr><td>A setting (<code>setting</code>), a timer (<code>timer</code>), a flag (<code>flag</code>) or a counter (<code>counter</code>)</td><td>the <code>variables</code> section</td><td>declared and used</td></tr>

      </tbody>
    </table></div>
    <p class="tenue">The words of the language are in English. The names you choose — states, variables, buttons — are also
    best written in English, so everything reads smoothly.</p>

    <h2 id="ed-logica">The Logic tab</h2>
    <p>You write in the middle; on the left, the panel helps you. At the top of the panel, always in view, it says whether the
    logic is valid or how many things need fixing: the line underneath turns green or red.</p>
    <div class="tabla"><table>
      <thead><tr><th>Where</th><th>What is there</th><th>What for</th></tr></thead>
      <tbody>
        <tr><td>Editor bar</td><td><b>You are in</b> <code>states › RUNNING › on enter</code></td><td>knowing which part of the program the cursor is in</td></tr>
        <tr><td>Panel · top</td><td>whether it is valid and <b>+ New block</b></td><td>seeing at a glance whether it can be exported or starting another function. This guide opens from <b>Documentation</b>, in the top bar, or with F1</td></tr>

        <tr><td>Panel · <b>What is this?</b></td><td>what the word under the cursor means, with an example</td><td>understanding what you read without leaving the editor</td></tr>
        <tr><td>Panel · <b>What you can write here</b></td><td>what fits at that point of the program</td><td>one click writes it for you</td></tr>
        <tr><td>Panel · <b>Recipes</b></td><td>complete devices, ready to add (starts folded)</td><td>starting from something that already works</td></tr>

      </tbody>
    </table></div>
    <p class="tenue">The panel sections fold with a click on their title and stay the way you left them.</p>

    <h2 id="ed-simulador">The simulator</h2>
    <p><b>▶ Simulate</b> tries the screen and the logic without compiling or flashing. In the middle is the screen, which you touch
    like the real one; on the right, the test bench. Every <b>Try it</b> in this guide is done here.</p>
    <div class="tabla"><table>
      <thead><tr><th>On the bench</th><th>What for</th></tr></thead>
      <tbody>
        <tr><td>At the top, always in view</td><td>the clock, the <b>current state</b> of each block and the speed: <b>×1</b>, <b>×5</b> or <b>×20</b> (at ×20, one minute passes in 3 seconds)</td></tr>
        <tr><td><b>Jump to a state</b></td><td>going straight to a state, with its <code>on enter</code>, to see how it looks without having to cause it</td></tr>
        <tr><td><b>Inputs</b></td><td>setting by hand what a sensor would measure, or letting the simulated motor move it</td></tr>
        <tr><td><b>Link to the other node</b></td><td>only with two nodes: cut the link to see what the screen does without data</td></tr>
        <tr><td><b>Outputs</b></td><td>what is on and with which value</td></tr>
        <tr><td><b>Logic variables</b></td><td>settings, timers, flags and counters; settings change with ▼ ▲, flags with a click, and counters go back to their <code>start</code> with ↺</td></tr>

  { id: 'reglas', parte: 0,
    titulo: { es: 'Reglas para escribir', en: 'Rules for writing' },
    resumen: { es: 'Lo que el editor exige para entender lo que escribes. Si algo no se cumple, te marca la línea y te dice cómo arreglarlo.',

    html: () => X(`
    <ul class="reglas">
      <li><b>Sangría con espacios</b>, dos por nivel. Lo que va dentro de algo lleva dos espacios más que la línea de arriba. En el editor, <b>Tab</b> y <b>Shift+Tab</b> lo hacen por ti.</li>
      <li><b>Dos puntos y un espacio</b>: <code>start: 15</code>, no <code>start:15</code>.</li>
      <li>Las <b>llaves</b> <code>{ }</code> y los <b>corchetes</b> <code>[ ]</code> abren y cierran en la misma línea. Si no cabe, se parte: <b>una línea que acaba en coma sigue en la de abajo</b>.</li>
      <li>Las <b>acciones</b> van siempre entre corchetes, separadas por comas: <code>[turn off relay, go to READY]</code>. Se hacen en el orden en que están escritas.</li>
      <li>Un <b>solo <code>go to</code> por fila</b>: el aparato está en un estado a la vez. Si dos cosas tienen que pasar juntas, van en el mismo estado.</li>
      <li>Para comparar un <b>tiempo</b>, <code>&gt;=</code> y no <code>==</code>: un timer avanza de 0,05 en 0,05 s y casi nunca vale el número exacto (con <code>== 0</code> sí se puede).</li>
      <li>Los <b>estados</b> en MAYÚSCULAS; las <b>variables</b> en minúsculas, con números o <code>_</code> y sin espacios.</li>
      <li>Los textos con símbolos van <b>entre comillas</b>: <code>unit: "%"</code>, <code>color: "#3b9dff"</code>.</li>
      <li>Los <b>decimales</b> llevan punto: <code>step: 0.5</code>.</li>
      <li>Todo lo que va detrás de <code>#</code> es un <b>comentario</b> y no cuenta.</li>

    <p class="tenue">¿Te sale un error que no entiendes? Los más comunes, con el mensaje exacto del editor, están en
    <a href="#errores">Errores frecuentes</a>.</p>`, `
    <ul class="reglas">
      <li><b>Indent with spaces</b>, two per level. Whatever goes inside something has two more spaces than the line above. In the editor, <b>Tab</b> and <b>Shift+Tab</b> do it for you.</li>
      <li><b>A colon and a space</b>: <code>start: 15</code>, not <code>start:15</code>.</li>
      <li><b>Braces</b> <code>{ }</code> and <b>brackets</b> <code>[ ]</code> open and close on the same line. If it does not fit, split it: <b>a line ending in a comma continues on the line below</b>.</li>
      <li><b>Actions</b> always go in brackets, separated by commas: <code>[turn off relay, go to READY]</code>. They run in the order they are written.</li>

      <li>Texts with symbols go <b>in quotes</b>: <code>unit: "%"</code>, <code>color: "#3b9dff"</code>.</li>
      <li><b>Decimals</b> use a point: <code>step: 0.5</code>.</li>
      <li>Everything after <code>#</code> is a <b>comment</b> and does not count.</li>

    <p class="tenue">Getting an error you do not understand? The most common ones, with the exact editor message, are in
    <a href="#errores">Common errors</a>.</p>`) },

      <h2>Los cuatro tipos de variable</h2>

      <div class="tabla"><table>

            <td><code>if left == 0</code> <code>if elapsed &gt;= 5</code></td></tr>

            <td><code>fault: { type: flag, start: no }</code></td>
            <td><code>[turn on fault]</code> <code>[turn off fault]</code> <code>[toggle fault]</code> <code>[pulse fault for 2]</code> <code>hold: fault</code> <code>[load fault]</code></td>

      <ul class="reglas">
        <li>Los cuatro se pueden usar en una cuenta (<code>+ - * /</code>) y guardar en la memoria con <code>save</code>, menos el timer, que se vuelve a llenar solo con <code>restart</code>.</li>
        <li>Una bandera vale 1 si está en sí y 0 si está en no; un contador nunca baja de 0 ni pasa de su <code>max</code>.</li>
        <li>En pantalla: un <b>Número</b> muestra cualquiera de los cuatro (una bandera como SI/NO, un timer como mm:ss con el widget <b>Tiempo</b>); un <b>Piloto</b> se enciende con una bandera.</li>
      </ul>
      <p>Cada tipo, usado en un aparato de verdad: {{ej:ajuste}} (setting), {{ej:bandera}} (flag), {{ej:contador}} (counter). El timer está en <a href="#tiempo">Condiciones y tiempo</a>.</p>`, `
      <h2>The four variable types</h2>
      <p>All of them are declared in <code>variables</code>. This table says, for each one, how it is declared, what changes it and how it is asked.

      <div class="tabla"><table>
        <thead><tr><th>Type</th><th>What for</th><th>Declared as</th><th>Changed with</th><th>Asked with</th></tr></thead>
        <tbody>
          <tr><td><code>setting</code></td><td>a number the user adjusts, always within its range</td>
            <td><code>power: { type: setting, range: [0, 255], step: 1, start: 20 }</code></td>
            <td><code>[increase power]</code> <code>[decrease power]</code> <code>[set power to 50]</code> <code>[set power to power * 2]</code> <code>[load power]</code></td>
            <td><code>if power &gt; 100</code> <code>if voltage &gt;= power * 0.9</code></td></tr>
          <tr><td><code>timer</code></td><td>a time in seconds that runs when a state asks for it</td>
            <td><code>left: { type: timer, from: duration, counts: down }</code><br><code>elapsed: { type: timer, counts: up }</code></td>
            <td><code>[restart left]</code> <code>while: [count left]</code> <code>[set left to left + 30]</code></td>
            <td><code>if left == 0</code> <code>if elapsed &gt;= 5</code></td></tr>
          <tr><td><code>flag</code></td><td>something yes/no the logic remembers</td>
            <td><code>fault: { type: flag, start: no }</code></td>
            <td><code>[turn on fault]</code> <code>[turn off fault]</code> <code>[toggle fault]</code> <code>[pulse fault for 2]</code> <code>hold: fault</code> <code>[load fault]</code></td>
            <td><code>if fault</code> <code>if not fault</code> <code>if not fault and voltage &lt; 10</code></td></tr>
          <tr><td><code>counter</code></td><td>a whole number that counts rounds, pieces or attempts</td>
            <td><code>rounds: { type: counter, start: 0 }</code><br><code>pieces: { type: counter, start: 0, max: 500 }</code></td>
            <td><code>[increase rounds]</code> <code>[decrease rounds]</code> <code>[restart rounds]</code> <code>[set rounds to 0]</code> <code>[load rounds]</code></td>
            <td><code>if rounds &gt;= total</code> <code>if rounds == 3</code></td></tr>
        </tbody>
      </table></div>
      <ul class="reglas">
        <li>All four can be used in a calculation (<code>+ - * /</code>) and saved to memory with <code>save</code>, except the timer, which refills by itself with <code>restart</code>.</li>

      <p>Each type, used in a real device: {{ej:ajuste}} (setting), {{ej:bandera}} (flag), {{ej:contador}} (counter). The timer is in <a href="#tiempo">Conditions and time</a>.</p>`)) + ejemplosDe('estados').map(tarjeta).join('') },
  { id: 'tiempo', parte: 1, ejemplos: true,

      const lineas = txt.replace(/\n$/, '').split('\n');

      return `<div class="error"><h3>${T(x.titulo)}</h3>${cod(lineas.slice(desde - 1, hasta).join('\n'), marcas)}

    <p>Y si la tuya no está en ninguna lista, se describe una vez con <a href="#pantalla-medida">Pantalla a medida</a>.</p>
    <p>La placa que mueve la pantalla es un <b>ESP32</b> (DevKit, WROVER, XIAO S3, S3-DevKitC, C3 o S3 SuperMini), la que ya la

    <p>The screen is chosen in the <b>Design</b> tab, in the <b>Screen</b> list: boards with the screen built in at the top, and below them the screens that connect separately. What changes from one to another is the layer

        <tr><td>Another screen or another micro that reads text</td><td>same group, <b>text lines</b></td><td>the serial layer and the protocol in the README</td><td>none</td><td>whatever the other side has</td></tr>

    </table></div>
    <p>And if yours is on no list, describe it once with <a href="#pantalla-medida">Custom screen</a>.</p>
    <p>The board that drives the screen is an <b>ESP32</b> (DevKit, WROVER, XIAO S3, S3-DevKitC, C3 or S3 SuperMini), the one that

    <h2 id="tft-pasos">Paso a paso</h2>
    <ol class="pasos">
      <li>En <b>Diseño</b>, lista <b>Pantalla</b>, grupo <b>Aparte, en color: TFT por SPI</b>: el chip de tu pantalla. Viene en el anuncio o impreso en el cable plano.</li>

    <h2 id="tft-pasos">Step by step</h2>

  { id: 'oled', parte: 3,
    titulo: { es: 'Una OLED de un color, con botones', en: 'A single-colour OLED, with buttons' },
    resumen: { es: 'Las pantallas pequeñas de 128×64 o 128×32 por I2C: no tienen táctil, así que la interfaz se maneja con pulsadores.',
               en: 'The small 128×64 or 128×32 I2C screens: they have no touch, so the interface is operated with push buttons.' },
    subs: [['oled-pasos', { es: 'Paso a paso', en: 'Step by step' }],
           ['oled-nav', { es: 'Cómo se navega', en: 'How to navigate' }],
           ['oled-saber', { es: 'Lo que conviene saber', en: 'Good to know' }],
           ['oled-linux', { es: 'En una Raspberry Pi, Jetson u Orange Pi', en: 'On a Raspberry Pi, Jetson or Orange Pi' }],
           ['oled-nada', { es: 'Si no se ve nada', en: 'If nothing shows' }]],
    html: () => X(`
    <h2 id="oled-pasos">Paso a paso</h2>
    <ol class="pasos">
      <li>En la lista <b>Pantalla</b>, grupo <b>Aparte, de un color: OLED por I2C</b>: SSD1306 de 128×64 o de 128×32, o SH1106. Y en <b>Placa a la que la conectas</b>, tu placa.</li>
      <li><b>SDA</b>, <b>SCL</b> y la <b>dirección</b> (casi siempre 0x3C).</li>
      <li>En <b>Hardware</b>, añade las piezas <b>Botón de navegación</b>: una con <i>siguiente</i> y otra con <i>aceptar</i>. Una tercera con <i>anterior</i> lo hace más cómodo.</li>
      <li>Diseña. El lienzo se ve en blanco y negro, como en la placa, y la paleta solo ofrece lo que se lee en ella: textos, números, barras, botones, interruptores, casillas, pilotos, el estado actual, los pasos, el reloj de aguja y el tiempo.</li>
      <li><b>Exportar</b>: con un ESP32 o la Pico, igual que una TFT, con LovyanGFX y lvgl. Con una placa con Linux, un programa de Python: <a href="#oled-linux">mira abajo</a>.</li>
    </ol>
    <h2 id="oled-nav">Cómo se navega</h2>
    <p><i>Siguiente</i> y <i>anterior</i> mueven un recuadro de un elemento a otro: el marcado se ve invertido. <i>Aceptar</i> lo pulsa.
    Para la lógica, <b>pulsar aceptar es lo mismo que tocar con el dedo</b>: el mismo evento, la misma sección <code>buttons</code>.
    Al cambiar de pantalla, el recuadro solo recorre la que se ve.</p>
    <h2 id="oled-saber">Lo que conviene saber</h2>
    <ul class="reglas">
      <li><b>Blanco o negro, nada más.</b> Cada color del diseño se queda en uno de los dos: los oscuros en negro y lo que se quiere ver en blanco. Un gris no existe.</li>
      <li><b>Barras, interruptores y casillas van con contorno.</b> Su fondo es un tono oscuro que se iría a negro sobre negro: por eso el canal de la barra y del deslizador, el interruptor apagado y la casilla sin marcar se dibujan con un borde blanco de 1 px, y lo lleno, en blanco. Igual en el lienzo y en la placa.</li>
      <li><b>La letra más pequeña es de 10 px.</b> La de 8 no se lee en una OLED. Si <code>lv_conf.h</code> no tiene activa alguna, el compilador dice cuál.</li>
      <li><b>La OLED va en su propio bus I2C.</b> Si añades sensores I2C, van en otro par de pines, cada bus con su controlador.</li>
      <li><b>En una ESP32-C3</b> hay un solo controlador I2C y se lo queda la pantalla: ahí no caben sensores I2C, y la fila del sensor lo dice.</li>
    </ul>
    <h2 id="oled-linux">En una Raspberry Pi, Jetson u Orange Pi</h2>
    <p>Una placa con Linux no lleva sketch: la OLED la dibuja un programa de Python, <code>telar_pantalla.py</code>, que es
    <b>el mismo para todos los proyectos</b>. Lo de cada uno (las pantallas, la lógica y los pines) va en <code>proyecto.json</code>,
    que Telar escribe al exportar. La lógica corre con <b>las mismas reglas</b> que en un ESP32 y que en el simulador, y cada
    widget se pinta con las medidas del lienzo.</p>
    <ol class="pasos">
      <li>En <b>Pantalla</b>, la OLED (SSD1306 de 128×64 o 128×32, o SH1106). En <b>Placa a la que la conectas</b>, la Raspberry Pi, la Jetson o la Orange Pi. Telar pone SDA en el <b>GPIO2</b> (pin 3 del conector) y SCL en el <b>GPIO3</b> (pin 5).</li>
      <li>En <b>Hardware</b>, los <b>Botones de navegación</b>, y si hacen falta entradas y salidas digitales. Una placa con Linux no mide tensiones: para eso, un segundo nodo (un ESP32 o una Pico) unido por UART o RS485.</li>
      <li><b>Exportar</b>. Sale una carpeta con <code>telar_pantalla.py</code>, <code>proyecto.json</code>, las fuentes, el servicio para que arranque sola y un <code>LEEME.txt</code> con los pasos.</li>
      <li>En la placa, una sola vez: encender el I2C (en una Raspberry, <code>sudo raspi-config nonint do_i2c 0</code>) e instalar lo necesario en un entorno aparte.</li>
      <li>Arrancarla: <code>~/telar-env/bin/python telar_pantalla.py</code>.</li>
    </ol>
    <p>Ejemplo: el variac con una Raspberry Pi y una SSD1306, y el nodo de control en un ESP32.</p>
    <pre>variac_industrial/
    variac_industrial_pantalla/      &lt;- se copia a la Raspberry
        telar_pantalla.py  proyecto.json  requisitos.txt  fuentes/  LEEME.txt  telar-pantalla.service
    variac_industrial_control/       &lt;- se sube al ESP32 con el IDE de Arduino
        variac_industrial_control.ino  ...

sudo apt install -y python3-venv python3-pil i2c-tools
python3 -m venv --system-site-packages ~/telar-env
~/telar-env/bin/pip install -r requisitos.txt
sudo usermod -aG i2c,gpio,dialout $USER   # y volver a entrar
i2cdetect -y 1                          # tiene que salir 3c
~/telar-env/bin/python telar_pantalla.py

# que arranque sola al encender (el LEEME.txt lo explica)
mkdir -p ~/.config/systemd/user && cp telar-pantalla.service ~/.config/systemd/user/
systemctl --user daemon-reload && systemctl --user enable --now telar-pantalla
sudo loginctl enable-linger $USER</pre>
    <ul class="reglas">
      <li><b>Se navega igual</b>: <i>siguiente</i> y <i>anterior</i> mueven el foco (el marcado sale en negativo) y <i>aceptar</i> pulsa. Un <b>deslizador</b>, que con el dedo se arrastra, aquí se edita: <i>aceptar</i> entra, <i>siguiente</i> y <i>anterior</i> lo mueven y <i>aceptar</i> sale.</li>
      <li><b>Sin la placa</b> también se prueba: en cualquier ordenador con Python y Pillow, <code>python3 telar_pantalla.py --sin-placa</code> guarda lo que se vería en <code>pantalla.png</code>, y se maneja con las teclas n, p y a.</li>
      <li><b>El enlace</b> con un nodo de control habla las mismas tramas que entre dos ESP32: el nodo de control no nota la diferencia.</li>
      <li><b>save</b> y <b>load</b> guardan en <code>memoria.json</code>, al lado del programa: sobrevive a apagar la placa.</li>
      <li>En la <b>Orange Pi</b> el número del bus I2C cambia de un modelo a otro: <code>i2cdetect -l</code> dice cuál es, y se pone en <code>"i2c_bus"</code> dentro de <code>proyecto.json</code>.</li>
    </ul>
    <h2 id="oled-nada">Si no se ve nada</h2>
    <div class="tabla"><table>
      <thead><tr><th>Lo que ves</th><th>Qué tocar</th></tr></thead>
      <tbody>
        <tr><td>Nada</td><td>la <b>dirección</b>: prueba 0x3D (la decide una resistencia de la parte de atrás); y que SDA y SCL no estén cruzados</td></tr>
        <tr><td>Se ve corrido y con basura en un borde</td><td>es una SH1106 elegida como SSD1306 (o al revés): cambia el controlador</td></tr>
        <tr><td>En la de 128×32, una fila sí y otra no</td><td>está elegida como 128×64: elige la de 128×32</td></tr>
        <tr><td>Los botones no hacen nada</td><td>que estén en el nodo de la pantalla y cableados a masa (con la resistencia pull-up interna, que es la opción por defecto)</td></tr>
      </tbody>
    </table></div>`, `
    <h2 id="oled-pasos">Step by step</h2>
    <ol class="pasos">
      <li>In the <b>Screen</b> list, group <b>Separate, single colour: I2C OLED</b>: SSD1306 128×64 or 128×32, or SH1106. And under <b>Board it connects to</b>, your board.</li>
      <li><b>SDA</b>, <b>SCL</b> and the <b>address</b> (almost always 0x3C).</li>

    </ol>
    <h2 id="oled-nav">How to navigate</h2>
    <p><i>Next</i> and <i>previous</i> move a frame from one element to another: the marked one looks inverted. <i>Accept</i> presses it.
    For the logic, <b>pressing accept is the same as touching with a finger</b>: the same event, the same <code>buttons</code> section.
    When you change screen, the frame only goes through the one that is visible.</p>
    <h2 id="oled-saber">Good to know</h2>
    <ul class="reglas">
      <li><b>Black or white, nothing else.</b> Every colour in the design becomes one of the two: dark ones black and whatever should be seen white. Grey does not exist.</li>
      <li><b>Bars, switches and checkboxes get an outline.</b> Their background is a dark shade that would turn black on black, so the track of the bar and the slider, the switch when off and the unticked checkbox are drawn with a 1 px white border, and whatever is filled, in white. The same on the canvas and on the board.</li>
      <li><b>The smallest font is 10 px.</b> 8 px cannot be read on an OLED. If <code>lv_conf.h</code> has one switched off, the compiler says which.</li>
      <li><b>The OLED gets its own I2C bus.</b> I2C sensors you add go on another pair of pins, each bus with its own controller.</li>
      <li><b>On an ESP32-C3</b> there is a single I2C controller and the screen takes it: there is no room for I2C sensors there, and the sensor's row says so.</li>
    </ul>
    <h2 id="oled-linux">On a Raspberry Pi, Jetson or Orange Pi</h2>
    <p>A Linux board takes no sketch: the OLED is drawn by a Python program, <code>telar_pantalla.py</code>, which is
    <b>the same for every project</b>. What belongs to each one (the screens, the logic and the pins) goes in <code>proyecto.json</code>,
    written by Telar on export. The logic runs with <b>the same rules</b> as on an ESP32 and in the simulator, and every
    widget is painted with the canvas measurements.</p>
    <ol class="pasos">
      <li>In <b>Screen</b>, the OLED (SSD1306 128×64 or 128×32, or SH1106). Under <b>Board it connects to</b>, the Raspberry Pi, Jetson or Orange Pi. Telar puts SDA on <b>GPIO2</b> (connector pin 3) and SCL on <b>GPIO3</b> (pin 5).</li>
      <li>In <b>Hardware</b>, the <b>Navigation buttons</b>, and digital inputs and outputs if needed. A Linux board does not measure voltages: for that, a second node (an ESP32 or a Pico) linked by UART or RS485.</li>
      <li><b>Export</b>. You get a folder with <code>telar_pantalla.py</code>, <code>proyecto.json</code>, the fonts, the service to start it by itself and a <code>LEEME.txt</code> with the steps.</li>
      <li>On the board, only once: turn I2C on (on a Raspberry, <code>sudo raspi-config nonint do_i2c 0</code>) and install what is needed in a separate environment.</li>
      <li>Start it: <code>~/telar-env/bin/python telar_pantalla.py</code>.</li>
    </ol>
    <p>Example: the variac with a Raspberry Pi and an SSD1306, and the control node on an ESP32.</p>
    <pre>variac_industrial/
    variac_industrial_pantalla/      &lt;- copied to the Raspberry
        telar_pantalla.py  proyecto.json  requisitos.txt  fuentes/  LEEME.txt  telar-pantalla.service
    variac_industrial_control/       &lt;- uploaded to the ESP32 with the Arduino IDE
        variac_industrial_control.ino  ...

sudo apt install -y python3-venv python3-pil i2c-tools
python3 -m venv --system-site-packages ~/telar-env
~/telar-env/bin/pip install -r requisitos.txt
sudo usermod -aG i2c,gpio,dialout $USER   # then log in again
i2cdetect -y 1                          # 3c must show up
~/telar-env/bin/python telar_pantalla.py

# start it by itself at power-up (LEEME.txt explains it)
mkdir -p ~/.config/systemd/user && cp telar-pantalla.service ~/.config/systemd/user/
systemctl --user daemon-reload && systemctl --user enable --now telar-pantalla
sudo loginctl enable-linger $USER</pre>
    <ul class="reglas">
      <li><b>Navigation is the same</b>: <i>next</i> and <i>previous</i> move the focus (the marked one is shown inverted) and <i>accept</i> presses. A <b>slider</b>, dragged with a finger elsewhere, is edited here: <i>accept</i> enters, <i>next</i> and <i>previous</i> move it and <i>accept</i> leaves.</li>
      <li><b>Without the board</b> it can be tried too: on any computer with Python and Pillow, <code>python3 telar_pantalla.py --sin-placa</code> saves what would be shown in <code>pantalla.png</code>, and it is operated with the keys n, p and a.</li>
      <li><b>The link</b> with a control node speaks the same frames as between two ESP32: the control node does not notice the difference.</li>
      <li><b>save</b> and <b>load</b> keep their values in <code>memoria.json</code>, next to the program: it survives powering the board off.</li>
      <li>On the <b>Orange Pi</b> the I2C bus number changes from one model to another: <code>i2cdetect -l</code> tells which one, and it goes in <code>"i2c_bus"</code> inside <code>proyecto.json</code>.</li>
    </ul>
    <h2 id="oled-nada">If nothing shows</h2>
    <div class="tabla"><table>
      <thead><tr><th>What you see</th><th>What to change</th></tr></thead>
      <tbody>
        <tr><td>Nothing</td><td>the <b>address</b>: try 0x3D (a resistor on the back decides it); and that SDA and SCL are not swapped</td></tr>
        <tr><td>Shifted, with garbage at one edge</td><td>it is an SH1106 chosen as SSD1306 (or the other way round): change the controller</td></tr>
        <tr><td>On the 128×32, every other row missing</td><td>it is set as 128×64: choose the 128×32 one</td></tr>
        <tr><td>The buttons do nothing</td><td>that they are on the screen node and wired to ground (with the internal pull-up, the default option)</td></tr>
      </tbody>
    </table></div>`) },

    <p>Una Nextion se dibuja en su propio programa, el <b>Nextion Editor</b>. Su formato es cerrado, así que Telar no puede

    <h2 id="nx-lineas">Otra pantalla o micro: texto por líneas</h2>

      <tr><td><b>Número</b></td><td>La medida principal, grande y con su unidad.</td><td>Enlázalo a una lectura o a un ajuste; unidad, decimales y rótulo, en su panel.</td></tr>

      <tr><td><b>Barra</b></td><td>Un nivel, un llenado o una carga, con su consigna marcada.</td><td>Enlázala a la medida; la marca verde sale de un valor fijo o de un ajuste.</td></tr>

      <tr><td><b>Reloj de aguja</b></td><td>Una medida como en un instrumento: tensión, presión, velocidad.</td><td>Enlázalo a la medida; rango, apertura y consigna en su panel. El texto de la consigna se escribe y se arrastra.</td></tr>

    <h2 id="wg-numero">Lo que recibe la variable</h2>

    <p>Each widget says at the top of its panel <b>when to use it</b> and <b>how</b> it connects. This is the whole list, by palette group.</p>

      <tr><td><b>Button</b></td><td>Start, stop, change screen or raise and lower a value.</td><td>In its panel, <b>On tap, go to</b> another screen or a command for an output; or give it logic under <code>buttons:</code> by its name.</td></tr>

      <tr><td><b>Message box</b></td><td>An alarm, the end of a cycle or something to confirm.</td><td>Title on the first line and the message below. In <b>When it shows</b>, at start-up or only in some logic states.</td></tr>
      <tr><td><b>Tabs</b></td><td>Several views in the same place when the screen is small.</td><td>One tab per line. They start empty: the editor does not put widgets inside yet, so each tab is filled by hand in the code.</td></tr>
      <tr><td><b>Card or panel</b></td><td>Group data that belong together, with a background and a caption.</td><td>Put it behind (in Layers) and the widgets on top.</td></tr>

      <tr><td><b>Text area</b></td><td>Type an exact number with a Keyboard: a setpoint, a time.</td><td>Add a <b>Keyboard</b> and choose <b>Saves the number in</b>: pressing ✓ sends the number to the variable.</td></tr>
      <tr><td><b>Keyboard</b></td><td>Type into a Text area.</td><td>Choose <b>Numbers</b>, create its field with its button and, in the field, <b>Saves the number in</b> a setting: pressing ✓ sends the typed number to it. With Letters, the text is only shown.</td></tr>
      <tr><th colspan="3">Display</th></tr>

  { id: 'diseno-pro', parte: 3,
    titulo: { es: 'Del aula a la industria', en: 'From the classroom to industry' },
    resumen: { es: 'Un tema sobrio, componentes de panel de instrumentos y plantillas de pantalla: una interfaz profesional sin dibujar cada píxel.',
               en: 'A sober theme, instrument-panel components and screen templates: a professional interface without drawing every pixel.' },
    subs: [['dp-tema', { es: 'El tema', en: 'The theme' }],
           ['dp-componentes', { es: 'Los componentes industriales', en: 'The industrial components' }],
           ['dp-plantillas', { es: 'Las plantillas', en: 'The templates' }],
