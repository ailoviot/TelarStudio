# Instaladores de Telar Studio de escritorio para Windows, macOS y Linux.
#
# Se ejecuta al subir una etiqueta de version (v1.0.0, v1.1.0...): compila
# en las tres maquinas de GitHub y publica los instaladores en Releases.
# Tambien se puede lanzar a mano desde la pestana Actions (sin publicar:
# los instaladores quedan como artefactos de esa ejecucion).
name: Instaladores de escritorio

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  compilar:
    name: Compilar (${{ matrix.nombre }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nombre: Windows, destino: --win }
          - { os: macos-latest,   nombre: macOS,   destino: --mac }
          - { os: ubuntu-latest,  nombre: Linux,   destino: --linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: escritorio/package-lock.json

      - name: Dependencias
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Instalador
        run: npm run web && npx electron-builder ${{ matrix.destino }} --publish never
        env:
          # Sin certificado de firma: que electron-builder no busque uno
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: TelarStudio-${{ matrix.nombre }}
          if-no-files-found: error
          path: |
            escritorio/dist/*.exe
            escritorio/dist/*.dmg
            escritorio/dist/*.AppImage
            escritorio/dist/*.deb

  publicar:
    name: Publicar en Releases
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Telar Studio ${{ github.ref_name }}
          files: instaladores/*
          body: |
            ## Descargas

            | Sistema | Archivo |
            |---|---|
            | **Windows** 10/11 | `TelarStudio-…-win-x64.exe` — doble clic e instala. |
            | **macOS** (Intel y Apple Silicon) | `TelarStudio-…-mac-universal.dmg` — arrastra Telar Studio a Aplicaciones. |
            | **Linux** | `TelarStudio-…-linux-x86_64.AppImage` (dale permiso de ejecución y ábrelo) o el `.deb` para Debian/Ubuntu. |

            **La primera vez:** la aplicación todavía no está firmada.
            - En **Windows**, si sale «Windows protegió su PC»: *Más información* → *Ejecutar de todas formas*.
            - En **macOS**: clic derecho sobre Telar Studio → *Abrir* → *Abrir*.

            También se puede usar sin instalar nada: abre `telar-studio.html` en Chrome o Edge.
