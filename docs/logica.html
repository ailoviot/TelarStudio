<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentación de Telar</title>
<style>
  /* Una sola apariencia, oscura, a propósito: es la del editor, y los
     colores de la sintaxis están pensados para ese fondo. */
  :root{
    --fondo:#14161c; --panel:#1b1e26; --panel2:#222630; --borde:#2e333f;
    --texto:#e6e9ef; --tenue:#9aa3b2; --debil:#6b7280;
    --acento:#3b9dff; --ok:#3ddc97; --aviso:#f5a524; --error:#f45b5b;
    --azul-suave:#7fa6d8;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.6 var(--ui)}
  a{color:var(--acento)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:4px}
  code{font-family:var(--mono);font-size:.92em;background:var(--panel2);border:1px solid var(--borde);border-radius:4px;padding:0 4px}

  /* ------------------------------------------------ marco e índice */
  .marco{display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px;max-width:1320px;margin:0 auto;padding:24px 24px 64px}
  @media (max-width:900px){.marco{grid-template-columns:minmax(0,1fr);gap:20px}.indice{position:static!important;max-height:none!important}}
  .indice{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;font-size:14px;padding-right:4px}
  .cabeza{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .marca{display:block;text-decoration:none;color:var(--texto);font-weight:700;font-size:16px;margin:0 0 2px}
  .marca small{display:block;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--debil);font-weight:400}
  .idioma{display:flex;flex:none;border:1px solid var(--borde);border-radius:7px;overflow:hidden;margin-top:2px}
  .idioma button{background:transparent;border:0;color:var(--tenue);font:600 11px var(--mono);letter-spacing:.06em;padding:5px 8px;cursor:pointer}
  .idioma button[aria-pressed="true"]{background:var(--panel2);color:var(--texto);box-shadow:inset 0 -2px 0 var(--acento)}
  .parte{margin-top:20px}
  .parte > b{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--azul-suave);margin:0 0 6px}
  .indice a.cap{display:flex;gap:8px;color:var(--tenue);text-decoration:none;padding:4px 8px;border-radius:6px;line-height:1.35}
  .indice a.cap span{flex:none;width:18px;font:12px/1.6 var(--mono);color:var(--debil);text-align:right}
  .indice a.cap:hover{color:var(--texto);background:var(--panel)}
  .indice a.cap.activo{color:var(--texto);background:var(--panel2);box-shadow:inset 2px 0 0 var(--acento)}
  .indice a.cap.activo span{color:var(--acento)}
  .indice .subs{margin:2px 0 6px 34px;border-left:1px solid var(--borde)}
  .indice .subs a{display:block;color:var(--tenue);text-decoration:none;padding:3px 0 3px 10px;font-size:13px;line-height:1.35}
  .indice .subs a:hover{color:var(--texto)}
  .indice .subs a i{font:normal 11px var(--mono);color:var(--debil);margin-right:6px}

  main{min-width:0;outline:none}
  .eyebrow{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--azul-suave);margin:4px 0 6px}
  h1{margin:0 0 8px;font-size:30px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
  .lead{margin:0 0 8px;color:var(--tenue);max-width:68ch;font-size:16px}
  h2{font-size:20px;margin:36px 0 8px;text-wrap:balance}
  h3{font-size:16px;margin:26px 0 8px;text-wrap:balance}
  h4{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--azul-suave);margin:18px 0 6px}
  p{max-width:70ch}
  .tenue{color:var(--tenue)}

  /* ------------------------------------------------ inicio */
  .partes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
  @media (max-width:700px){ .partes{grid-template-columns:1fr} }
  .tarjeta-parte{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:16px 18px}
  .tarjeta-parte .n{font:600 12px var(--mono);color:var(--azul-suave);letter-spacing:.08em;text-transform:uppercase}
  .tarjeta-parte h2{margin:2px 0 6px;font-size:18px}
  .tarjeta-parte p{margin:0 0 10px;color:var(--tenue);font-size:14px}
  .tarjeta-parte ol{margin:0;padding:0;list-style:none;border-top:1px solid var(--borde)}
  .tarjeta-parte li a{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #262b36;color:var(--texto);text-decoration:none;font-size:14px}
  .tarjeta-parte li a:hover{color:var(--acento)}
  .tarjeta-parte li a span{flex:none;width:18px;font:12px/1.7 var(--mono);color:var(--debil);text-align:right}
  .consejo{margin-top:18px;background:color-mix(in srgb,var(--acento) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--acento) 30%,var(--borde));border-radius:10px;padding:12px 16px;max-width:none}
  .consejo b{color:#cfe3ff}

  /* ------------------------------------------------ dentro de un capítulo */
  .en-cap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px}
  .en-cap b{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--debil);margin-right:4px}
  .en-cap a{font-size:13px;color:#cfe3ff;background:var(--panel);border:1px solid var(--borde);border-radius:99px;padding:2px 10px;text-decoration:none}
  .en-cap a i{font:normal 11px var(--mono);color:var(--debil);margin-right:5px}
  .en-cap a:hover{border-color:var(--acento)}
  .pie-cap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:44px;padding-top:18px;border-top:1px solid var(--borde)}
  .pie-cap a{display:block;background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:10px 14px;text-decoration:none;color:var(--texto)}
  .pie-cap a:hover{border-color:var(--acento)}
  .pie-cap a small{display:block;font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--debil)}
  .pie-cap a.sig{text-align:right;grid-column:2}

  /* El código va arriba, a todo lo ancho, y las frases debajo. Lado a lado,
     cada uno quedaba a media columna y las líneas largas obligaban a
     desplazarse de lado para leerlas. */
  .dos{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

  /* --- código con los mismos colores que el editor --- */
  .cod{margin:0;background:#0f1116;border:1px solid var(--borde);border-radius:8px;padding:10px 0;
    font:13px/1.65 var(--mono);color:#c7cfdb;overflow-x:auto}
  .cod .ln{display:block;white-space:pre;padding:0 14px}
  .cod .ln.mal{background:color-mix(in srgb,var(--error) 14%,transparent);box-shadow:inset 3px 0 0 var(--error)}
  .lg-k{color:#8fb8ff} .lg-kw{color:#c9a0ff} .lg-v{color:#9fe0bf} .lg-nm{color:#ffd89a} .lg-n{color:#f5c07a}
  .lg-s{color:#b5e8c9} .lg-cm{color:#6b7a90;font-style:italic} .lg-p{color:#6b7280} .lg-op{color:#f0a3a3}
  .lg-st{color:#e6f1ff;background:#23324a;border-radius:3px;padding:0 2px}
  b[class^="lg-"]{font-weight:inherit}
  .leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font:12.5px var(--mono);margin:10px 0 0}
  .leyenda span{display:flex;align-items:center;gap:6px;color:var(--tenue)}

  .frases{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:6px 14px;font-size:14px;align-self:start}
  .frases div{padding:5px 0;border-top:1px dashed #2a303c}
  .frases div:first-child{border-top:0}
  .frases b{color:#ffd89a;font-weight:600}
  .frases .tit{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--debil)}

  /* --- un ejemplo --- */
  .caja{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:18px 20px 20px;margin-top:18px;scroll-margin-top:16px}
  .cab-ej{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .cab-ej h3{margin:0}
  .num{flex:none;width:30px;height:30px;border-radius:8px;background:#1b2a41;border:1px solid #2a3f5f;color:#cfe3ff;
    font:600 14px/28px var(--mono);text-align:center;font-variant-numeric:tabular-nums}
  .para{margin:8px 0 0;color:#d3dae6}
  .sello{display:inline-block;font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;border-radius:5px;padding:4px 7px}
  .sello.ok{color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent)}
  .sello.mal{color:var(--error);border:1px solid color-mix(in srgb,var(--error) 45%,transparent)}
  .sello.dis{color:var(--tenue);border:1px solid var(--borde)}
  .aprende{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
  .aprende span{font-size:12.5px;color:#cfe3ff;background:#1b2a41;border:1px solid #2a3f5f;border-radius:99px;padding:2px 10px}
  .necesita{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:0 0 14px}
  @media (max-width:600px){.necesita{grid-template-columns:minmax(0,1fr)}}
  .necesita div{background:var(--panel2);border:1px solid var(--borde);border-radius:7px;padding:9px 12px;font-size:13.5px}
  .necesita strong{display:block;font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--azul-suave);margin-bottom:4px}
  .necesita ul{margin:0;padding-left:18px}
  .pasos{margin:0;padding-left:22px;max-width:72ch}
  .pasos li{margin:5px 0;padding-left:4px}
  .pasos li::marker{color:var(--azul-suave);font:600 13px var(--mono)}
  .prueba{margin-top:16px;background:color-mix(in srgb,var(--ok) 7%,var(--panel2));border:1px solid color-mix(in srgb,var(--ok) 30%,var(--borde));border-radius:8px;padding:10px 14px}
  .prueba strong,.ojo strong{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
  .prueba strong{color:var(--ok)}
  .prueba ol{margin:0;padding-left:20px}
  .prueba li{margin:3px 0}
  .ojo{margin-top:10px;background:color-mix(in srgb,var(--aviso) 8%,var(--panel2));border:1px solid color-mix(in srgb,var(--aviso) 32%,var(--borde));border-radius:8px;padding:10px 14px;font-size:14.5px}
  .ojo strong{color:var(--aviso)}
  .variac{margin:12px 0 0;font-size:13.5px;color:var(--tenue)}
  .variac b{color:var(--texto);font-weight:600}
  .leer{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
  .leer div{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:10px 12px;font-size:14px}
  .leer b{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--azul-suave);margin-bottom:2px}

  /* --- diccionario --- */
  /* Una columna: los ejemplos del diccionario son líneas enteras que no se
     pueden partir (las llaves abren y cierran en la misma línea). */
  .dicc{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
  .grupo h3{margin:0 0 8px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--azul-suave)}
  .palabra{padding:10px 0;border-top:1px solid #262b36;scroll-margin-top:16px}
  .palabra .cab{display:flex;align-items:baseline;gap:10px}
  .palabra .cab code{font-size:13.5px;color:#cfe3ff;background:none;border:0;padding:0}
  .palabra .cab small{color:var(--debil);font-size:12px}
  .palabra p{margin:4px 0 6px;font-size:14px;color:#d3dae6}
  .palabra .cod{font-size:12.5px;padding:6px 0}
  /* «Donde va»: la linea de la palabra, marcada */
  .cod .ln.aqui{background:color-mix(in srgb,var(--acento) 16%,transparent);box-shadow:inset 3px 0 0 var(--acento)}
  .donde{margin:6px 0 8px}
  .donde > span{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--azul-suave);margin-bottom:4px}

  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--borde);vertical-align:top}
  th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--tenue)}
  .tabla{overflow-x:auto;margin-top:12px}

  .error{margin-top:22px}
  .error h3{margin:0 0 8px}
  .msg{display:flex;gap:10px;background:color-mix(in srgb,var(--error) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--error) 35%,var(--borde));
    border-radius:7px;padding:8px 12px;font-size:14px;margin-top:8px}
  .msg b.l{font:600 12px var(--mono);color:var(--error);white-space:nowrap;padding-top:2px}
  .reglas li{margin:6px 0;max-width:70ch}
  .aviso-carga{background:color-mix(in srgb,var(--error) 12%,var(--panel));border:1px solid var(--error);border-radius:8px;padding:12px 16px}
</style>
</head>
<body>
<div class="marco">
  <nav class="indice" aria-label="Índice / Contents" id="indice"></nav>
  <main id="contenido" tabindex="-1"><p class="tenue">Cargando… / Loading…</p></main>
</div>

<script>
/* =====================================================================
 * DOCUMENTACIÓN DE TELAR — la lógica y las pantallas, en español y en inglés
 *
 * Un solo sitio, en cuatro partes: Empezar, Aprender paso a paso,
 * Consultar y Pantallas. Se ve un capítulo cada vez, con Anterior y
 * Siguiente.
 *
 * El idioma: ?lang=en|es (lo pasa el editor), si no el último elegido
 * (telar_idioma, el mismo que usa el editor), si no español. Lo que viene
 * de logica.js —diccionario, recetas, frases y errores— se pide en el
 * mismo idioma con LOGICA.setLang.
 *
 * Todo código de esta página se valida al abrirla con el mismo logica.js
 * que usa el editor: si el lenguaje cambia y un ejemplo deja de valer,
 * aparece en rojo en vez de quedarse mintiendo.
 * ===================================================================== */

let LANG = (() => {
  const p = new URLSearchParams(location.search).get('lang');
  if (p === 'es' || p === 'en') return p;
  try { const g = localStorage.getItem('telar_idioma'); if (g === 'es' || g === 'en') return g; } catch (e) {}
  return 'es';
})();
/* X('español', 'english') y T({ es, en }): el texto en el idioma elegido */
const X = (es, en) => LANG === 'en' ? en : es;
const T = v => v && typeof v === 'object' && !Array.isArray(v) && 'es' in v ? (v[LANG] ?? v.es) : v;

/* ------------------------------------------------------------ piezas
   Lo que los ejemplos necesitan FUERA de la lógica. Se describe una vez y
   cada ejemplo dice cuáles usa: así «voltage» significa lo mismo en todos.
   Los nombres de botones y campos son los que se ven en el editor. */
const PIEZAS = {
  voltage:   { hw: { lee: true }, que: { es: 'Entrada analógica (ADC). En sus parámetros: Unidad <code>kV</code>, valor con el pin a 0 V <code>0</code> y con el pin al máximo <code>264</code>',
                                         en: 'Analog input (ADC). In its parameters: Unit <code>kV</code>, value with the pin at 0 V <code>0</code> and value with the pin at maximum <code>264</code>' } },
  pwm_out:   { hw: { escribe: true, booleano: false }, que: { es: 'Salida PWM, con el rango 0–255', en: 'PWM output, with range 0–255' } },
  relay:     { hw: { escribe: true, booleano: true }, que: { es: 'Salida digital: el relé', en: 'Digital output: the relay' } },
  motor_dir: { hw: { escribe: true, booleano: true }, que: { es: 'Salida digital: el sentido del motor (ON sube, OFF baja)', en: 'Digital output: the motor direction (ON up, OFF down)' } },
  level:     { hw: { lee: true }, que: { es: 'Entrada analógica (ADC): el nivel del tanque, de 0 a 100 %', en: 'Analog input (ADC): the tank level, from 0 to 100 %' } },
  pump:      { hw: { escribe: true, booleano: true }, que: { es: 'Salida digital: la bomba', en: 'Digital output: the pump' } },
  bip:       { hw: { escribe: true, booleano: true }, que: { es: 'Salida digital: el zumbador', en: 'Digital output: the buzzer' } },
};
const bound = (es, en, v) => ({ es: `${es}, enlazado a <code>${v}</code>`, en: `${en}, bound to <code>${v}</code>` });
const boton = txt => ({ es: `Botón con el texto ${txt}`, en: `Button with the text ${txt}` });
const ELEMENTOS = {
  reading:        { tipo: 'value',  que: bound('Número grande', 'Big number', 'voltage') },
  sp_view:        { tipo: 'value',  que: bound('Número grande', 'Big number', 'setpoint') },
  power_view:     { tipo: 'value',  que: bound('Número grande', 'Big number', 'power') },
  level_view:     { tipo: 'value',  que: bound('Número grande', 'Big number', 'level') },
  time_view:      { tipo: 'timer',  que: bound('Tiempo', 'Time', 'hold_time') },
  countdown:      { tipo: 'timer',  que: bound('Tiempo', 'Time', 'remaining') },
  btn_minus:      { tipo: 'button', que: boton('−') },
  btn_plus:       { tipo: 'button', que: boton('+') },
  btn_time_minus: { tipo: 'button', que: boton('−') },
  btn_time_plus:  { tipo: 'button', que: boton('+') },
  btn_start:      { tipo: 'button', que: boton('START') },
  btn_reset:      { tipo: 'button', que: boton('RESET') },
  fault_led:      { tipo: 'led',    que: bound('LED', 'LED', 'fault') },
  rounds_view:    { tipo: 'value',  que: bound('Número grande', 'Big number', 'rounds') },
  pieces_view:    { tipo: 'value',  que: bound('Número grande', 'Big number', 'pieces') },
  total_view:     { tipo: 'value',  que: bound('Número grande', 'Big number', 'total') },
  btn_jog:        { tipo: 'button', que: boton('JOG') },
  btn_stop:       { tipo: 'button', que: boton('STOP') },
  btn_lower:      { tipo: 'button', que: { es: 'Botón con el texto BAJAR', en: 'Button with the text LOWER' } },
  btn_on:         { tipo: 'button', que: boton('ON') },
  btn_save:       { tipo: 'button', que: { es: 'Botón con el texto Guardar', en: 'Button with the text Save' } },
  btn_load:       { tipo: 'button', que: { es: 'Botón con el texto Cargar', en: 'Button with the text Load' } },
  strip:          { tipo: 'state-strip', que: { es: 'Tira de estado (opcional): muestra en qué estado estás', en: 'State strip (optional): shows which state you are in' } },
};

/* ----------------------------------------------------------- ejemplos
   grupo: el capítulo donde va. codigo: null si se hace solo con el editor.
   {{ej:id}} se cambia por un enlace «ejemplo N»: los números no se
   escriben a mano, así que agregar un ejemplo no descuadra las referencias. */
const EJEMPLOS = [
  /* ================================== capítulo: mostrar y ajustar */
  {
    id: 'medicion', grupo: 'mostrar',
    titulo: { es: 'Mostrar una medición en la pantalla', en: 'Show a measurement on the screen' },
    para: { es: 'Ver en grande lo que mide un sensor, con sus unidades reales.', en: 'See in large what a sensor measures, in its real units.' },
    aprende: { es: ['Hardware', 'Enlazado a', 'escala'], en: ['Hardware', 'Bound to', 'scale'] },
    hw: ['voltage'], lienzo: ['reading'],
    codigo: null,
    pasos: {
      es: [
        'En la pestaña <b>Hardware</b>, añade una <b>Entrada analógica (ADC)</b> y ponle de nombre <code>voltage</code>.',
        'En sus parámetros, escribe la <b>Unidad</b> (<code>kV</code>) y la escala: qué valor corresponde al pin a 0 V (<code>0</code>) y al pin al máximo (<code>264</code>). Así la pantalla muestra kilovoltios y no un número del 0 al 4095.',
        'En <b>Diseño</b>, añade un <b>Número grande</b> y en <b>Enlazado a</b> elige <code>voltage</code>. En <b>Decimales</b> eliges cuántos se ven.',
        'Pon un <b>Texto</b> encima, como <code>VOLTAJE (kV)</code>, para que se sepa qué es.',
      ],
      en: [
        'In the <b>Hardware</b> tab, add an <b>Analog input (ADC)</b> and name it <code>voltage</code>.',
        'In its parameters, type the <b>Unit</b> (<code>kV</code>) and the scale: the value for the pin at 0 V (<code>0</code>) and for the pin at maximum (<code>264</code>). That way the screen shows kilovolts and not a number from 0 to 4095.',
        'In <b>Design</b>, add a <b>Big number</b> and in <b>Bound to</b> choose <code>voltage</code>. In <b>Decimals</b> you pick how many are shown.',
        'Put a <b>Label</b> above it, like <code>VOLTAGE (kV)</code>, so it is clear what it is.',
      ],
    },
    prueba: {
      es: ['Pulsa <b>▶ Simular</b>.', 'A la derecha, en <b>Entradas</b>, sube <code>voltage</code> con ▲ o escribe un valor en la casilla: el número de la pantalla cambia.'],
      en: ['Press <b>▶ Simulate</b>.', 'On the right, under <b>Inputs</b>, raise <code>voltage</code> with ▲ or type a value in the box: the number on the screen changes.'],
    },
    ojo: { es: 'No hace falta escribir lógica para esto: mostrar un valor es cosa del <b>Enlazado a</b>. La lógica es para <i>decidir</i> cosas con ese valor.',

  NEXT:

  btn_plus:
    in IDLE: [increase total]

  states:

      on enter: [turn on relay, turn on motor_dir, set pwm_out to 21]

    HOLDING:
      on enter: [set pwm_out to 0, restart remaining]
      while: [count remaining]

const $ = id => document.getElementById(id);
const esc = s => LOGICA.esc(s);
const cod = (txt, malas) => `<pre class="cod">${String(txt).replace(/\n$/, '').split('\n')
  .map((l, i) => `<span class="ln${malas && malas.has(i + 1) ? ' mal' : ''}">${LOGICA.highlightLine(l) || ' '}</span>`).join('')}</pre>`;
const frases = model => `<div class="frases"><div class="tit">${X('Qué dice, en frases', 'What it says, in sentences')}</div>${LOGICA.sentences(model).map(f => `<div>${f.text}</div>`).join('')}</div>`;
const lista = xs => `<ul>${xs.map(x => `<li>${x}</li>`).join('')}</ul>`;
const numeroDe = id => EJEMPLOS.findIndex(e => e.id === id) + 1;
const refs = s => String(s).replace(/\{\{ej:([\w-]+)\}\}/g, (_, id) => `<a href="#ej-${id}">${X('ejemplo', 'example')} ${numeroDe(id)}</a>`);
const sello = (v, bien) => v.errors.length
  ? `<span class="sello mal">${v.errors.length} ${v.errors.length === 1 ? 'error' : X('errores', 'errors')}</span>`
  : `<span class="sello ok">${bien || X('válido', 'valid')}</span>`;
const codigoYFrases = (txt, v) => `<div class="dos">${cod(txt)}${v.model ? frases(v.model)
  : `<div class="frases">${v.errors.map(x => `<div>${X('línea', 'line')} ${x.line}: ${x.msg}</div>`).join('')}</div>`}</div>`;
const prueba = pasos => `<div class="prueba"><strong>${X('Pruébalo en el simulador', 'Try it in the simulator')}</strong><ol>${T(pasos).map(p => `<li>${p}</li>`).join('')}</ol></div>`;

function ctxDe(e){
  const hardware = {}, widgets = {};
  for (const n of e.hw) hardware[n] = PIEZAS[n].hw;
  for (const n of e.lienzo) widgets[n] = { tipo: ELEMENTOS[n].tipo };
  return { hardware, widgets };
}

function tarjeta(e){
  let s = `<span class="sello dis">${X('sin código', 'no code')}</span>`, cuerpo = '';
  if (e.codigo){ const v = LOGICA.validate(e.codigo, ctxDe(e)); s = sello(v); cuerpo = codigoYFrases(e.codigo, v); }
  const piezas = e.hw.length ? lista(e.hw.map(n => `<code>${n}</code> — ${T(PIEZAS[n].que)}`)) : X('nada', 'nothing');
  const elementos = [...e.lienzo.map(n => `<code>${n}</code> — ${T(ELEMENTOS[n].que)}`), ...(T(e.lienzoTexto) || [])];
  return `<div class="caja" id="ej-${e.id}">
    <div class="cab-ej"><span class="num">${numeroDe(e.id)}</span><h3>${T(e.titulo)}</h3>${s}</div>
    <p class="para">${T(e.para)}</p>
    <div class="aprende">${T(e.aprende).map(a => `<span>${esc(a)}</span>`).join('')}</div>
    <div class="necesita">
      <div><strong>${X('En Hardware', 'In Hardware')}</strong>${piezas}</div>
      <div><strong>${X('En el lienzo', 'On the canvas')}</strong>${elementos.length ? lista(elementos) : X('nada', 'nothing')}</div>
    </div>
    ${cuerpo}
    <h4>${e.codigo ? X('Cómo funciona', 'How it works') : X('Cómo se hace', 'How to do it')}</h4>
    <ol class="pasos">${T(e.pasos).map(p => `<li>${refs(p)}</li>`).join('')}</ol>
    ${prueba(e.prueba)}
    ${e.ojo ? `<div class="ojo"><strong>${X('Cuidado', 'Watch out')}</strong>${refs(T(e.ojo))}</div>` : ''}
    <p class="variac"><b>${X('En el ciclo del variac:', 'In the variac cycle:')}</b> ${refs(T(e.variac))}</p>
  </div>`;
}
const ejemplosDe = grupo => EJEMPLOS.filter(e => e.grupo === grupo);

    resumen: { es: 'Lo que el editor exige para entender lo que escribes. Si algo no se cumple, te marca la línea y te dice cómo arreglarlo.',
               en: 'What the editor needs in order to understand what you write. If something is off, it marks the line and tells you how to fix it.' },
    html: () => X(`
    <ul class="reglas">
      <li><b>Sangría con espacios</b>, dos por nivel. Lo que va dentro de algo lleva dos espacios más que la línea de arriba. En el editor, <b>Tab</b> y <b>Shift+Tab</b> lo hacen por ti.</li>
      <li><b>Dos puntos y un espacio</b>: <code>start: 15</code>, no <code>start:15</code>.</li>
      <li>Las <b>llaves</b> <code>{ }</code> y los <b>corchetes</b> <code>[ ]</code> abren y cierran en la misma línea. Si no cabe, se parte: <b>una línea que acaba en coma sigue en la de abajo</b>.</li>
      <li>Las <b>acciones</b> van siempre entre corchetes, separadas por comas: <code>[turn off relay, go to READY]</code>. Se hacen en el orden en que están escritas.</li>
      <li>Un <b>solo <code>go to</code> por fila</b>: el aparato está en un estado a la vez. Si dos cosas tienen que pasar juntas, van en el mismo estado.</li>
      <li>Para comparar un <b>tiempo</b>, <code>&gt;=</code> y no <code>==</code>: un timer avanza de 0,05 en 0,05 s y casi nunca vale el número exacto (con <code>== 0</code> sí se puede).</li>
      <li>Los <b>estados</b> en MAYÚSCULAS; las <b>variables</b> en minúsculas, con números o <code>_</code> y sin espacios.</li>
      <li>Los textos con símbolos van <b>entre comillas</b>: <code>unit: "%"</code>, <code>color: "#3b9dff"</code>.</li>
      <li>Los <b>decimales</b> llevan punto: <code>step: 0.5</code>.</li>
      <li>Todo lo que va detrás de <code>#</code> es un <b>comentario</b> y no cuenta.</li>
    </ul>
    <p class="tenue">¿Te sale un error que no entiendes? Los más comunes, con el mensaje exacto del editor, están en
    <a href="#errores">Errores frecuentes</a>.</p>`, `
    <ul class="reglas">
      <li><b>Indent with spaces</b>, two per level. Whatever goes inside something has two more spaces than the line above. In the editor, <b>Tab</b> and <b>Shift+Tab</b> do it for you.</li>
      <li><b>A colon and a space</b>: <code>start: 15</code>, not <code>start:15</code>.</li>
      <li><b>Braces</b> <code>{ }</code> and <b>brackets</b> <code>[ ]</code> open and close on the same line. If it does not fit, split it: <b>a line ending in a comma continues on the line below</b>.</li>
      <li><b>Actions</b> always go in brackets, separated by commas: <code>[turn off relay, go to READY]</code>. They run in the order they are written.</li>
      <li><b>One <code>go to</code> per row</b>: the device is in one state at a time. If two things must happen together, they go in the same state.</li>
      <li>To compare a <b>time</b>, <code>&gt;=</code> and not <code>==</code>: a timer moves in steps of 0.05 s and is almost never exactly the number (<code>== 0</code> does work).</li>
      <li><b>States</b> in CAPITALS; <b>variables</b> in lowercase, with numbers or <code>_</code> and no spaces.</li>
      <li>Texts with symbols go <b>in quotes</b>: <code>unit: "%"</code>, <code>color: "#3b9dff"</code>.</li>
      <li><b>Decimals</b> use a point: <code>step: 0.5</code>.</li>
      <li>Everything after <code>#</code> is a <b>comment</b> and does not count.</li>
    </ul>
    <p class="tenue">Getting an error you do not understand? The most common ones, with the exact editor message, are in
    <a href="#errores">Common errors</a>.</p>`) },

    html: () => refs(X(`
      <h2>Los cuatro tipos de variable</h2>
      <p>Todas se declaran en <code>variables</code>. Esta tabla dice, para cada una, cómo se declara, con qué se cambia y cómo se pregunta.
      Cada ejemplo se puede copiar tal cual (con tus nombres).</p>
      <div class="tabla"><table>
        <thead><tr><th>Tipo</th><th>Para qué</th><th>Se declara</th><th>Se cambia con</th><th>Se pregunta con</th></tr></thead>
        <tbody>
          <tr><td><code>setting</code></td><td>un número que el usuario ajusta, siempre dentro de su rango</td>
            <td><code>power: { type: setting, range: [0, 255], step: 1, start: 20 }</code></td>
            <td><code>[increase power]</code> <code>[decrease power]</code> <code>[set power to 50]</code> <code>[set power to power * 2]</code> <code>[load power]</code></td>
            <td><code>if power &gt; 100</code> <code>if voltage &gt;= power * 0.9</code></td></tr>
          <tr><td><code>timer</code></td><td>un tiempo en segundos que corre cuando un estado lo pide</td>
            <td><code>left: { type: timer, from: duration, counts: down }</code><br><code>elapsed: { type: timer, counts: up }</code></td>
            <td><code>[restart left]</code> <code>while: [count left]</code> <code>[set left to left + 30]</code></td>
            <td><code>if left == 0</code> <code>if elapsed &gt;= 5</code></td></tr>
          <tr><td><code>flag</code></td><td>algo de sí o no que la lógica recuerda</td>
            <td><code>fault: { type: flag, start: no }</code></td>
            <td><code>[turn on fault]</code> <code>[turn off fault]</code> <code>[toggle fault]</code> <code>[pulse fault for 2]</code> <code>hold: fault</code> <code>[load fault]</code></td>
            <td><code>if fault</code> <code>if not fault</code> <code>if not fault and voltage &lt; 10</code></td></tr>
          <tr><td><code>counter</code></td><td>un entero que cuenta vueltas, piezas o intentos</td>
            <td><code>rounds: { type: counter, start: 0 }</code><br><code>pieces: { type: counter, start: 0, max: 500 }</code></td>
            <td><code>[increase rounds]</code> <code>[decrease rounds]</code> <code>[restart rounds]</code> <code>[set rounds to 0]</code> <code>[load rounds]</code></td>
            <td><code>if rounds &gt;= total</code> <code>if rounds == 3</code></td></tr>
        </tbody>
      </table></div>
      <ul class="reglas">
        <li>Los cuatro se pueden usar en una cuenta (<code>+ - * /</code>) y guardar en la memoria con <code>save</code>, menos el timer, que se vuelve a llenar solo con <code>restart</code>.</li>
        <li>Una bandera vale 1 si está en sí y 0 si está en no; un contador nunca baja de 0 ni pasa de su <code>max</code>.</li>
        <li>En pantalla: un <b>Número</b> muestra cualquiera de los cuatro (una bandera como SI/NO, un timer como mm:ss con el widget <b>Tiempo</b>); un <b>Piloto</b> se enciende con una bandera.</li>
      </ul>
      <p>Cada tipo, usado en un aparato de verdad: {{ej:ajuste}} (setting), {{ej:bandera}} (flag), {{ej:contador}} (counter). El timer está en <a href="#tiempo">Condiciones y tiempo</a>.</p>`, `
      <h2>The four variable types</h2>
      <p>All of them are declared in <code>variables</code>. This table says, for each one, how it is declared, what changes it and how it is asked.
      Every example can be copied as is (with your names).</p>
      <div class="tabla"><table>
        <thead><tr><th>Type</th><th>What for</th><th>Declared as</th><th>Changed with</th><th>Asked with</th></tr></thead>
        <tbody>
          <tr><td><code>setting</code></td><td>a number the user adjusts, always within its range</td>
            <td><code>power: { type: setting, range: [0, 255], step: 1, start: 20 }</code></td>
            <td><code>[increase power]</code> <code>[decrease power]</code> <code>[set power to 50]</code> <code>[set power to power * 2]</code> <code>[load power]</code></td>
            <td><code>if power &gt; 100</code> <code>if voltage &gt;= power * 0.9</code></td></tr>
          <tr><td><code>timer</code></td><td>a time in seconds that runs when a state asks for it</td>
            <td><code>left: { type: timer, from: duration, counts: down }</code><br><code>elapsed: { type: timer, counts: up }</code></td>
            <td><code>[restart left]</code> <code>while: [count left]</code> <code>[set left to left + 30]</code></td>
            <td><code>if left == 0</code> <code>if elapsed &gt;= 5</code></td></tr>
          <tr><td><code>flag</code></td><td>something yes/no the logic remembers</td>
            <td><code>fault: { type: flag, start: no }</code></td>
            <td><code>[turn on fault]</code> <code>[turn off fault]</code> <code>[toggle fault]</code> <code>[pulse fault for 2]</code> <code>hold: fault</code> <code>[load fault]</code></td>
            <td><code>if fault</code> <code>if not fault</code> <code>if not fault and voltage &lt; 10</code></td></tr>
          <tr><td><code>counter</code></td><td>a whole number that counts rounds, pieces or attempts</td>
            <td><code>rounds: { type: counter, start: 0 }</code><br><code>pieces: { type: counter, start: 0, max: 500 }</code></td>
            <td><code>[increase rounds]</code> <code>[decrease rounds]</code> <code>[restart rounds]</code> <code>[set rounds to 0]</code> <code>[load rounds]</code></td>
            <td><code>if rounds &gt;= total</code> <code>if rounds == 3</code></td></tr>
        </tbody>
      </table></div>
      <ul class="reglas">
        <li>All four can be used in a calculation (<code>+ - * /</code>) and saved to memory with <code>save</code>, except the timer, which refills by itself with <code>restart</code>.</li>

      <p>Each type, used in a real device: {{ej:ajuste}} (setting), {{ej:bandera}} (flag), {{ej:contador}} (counter). The timer is in <a href="#tiempo">Conditions and time</a>.</p>`)) + ejemplosDe('estados').map(tarjeta).join('') },
  { id: 'tiempo', parte: 1, ejemplos: true,

    html: () => X(`
      <h2>Las piezas del tiempo</h2>
      <p>Nada de esto detiene el programa: mientras tanto la pantalla, los botones y el enlace siguen. Por eso no existe un

      <div class="tabla"><table>
        <thead><tr><th>Pieza</th><th>Qué hace</th><th>Ejemplo</th></tr></thead>
        <tbody>
          <tr><td><code>click: X</code></td><td>un pitido corto con cada botón que hace algo; va una vez, arriba</td><td><code>click: bip</code> (0,05 s) o <code>click: bip for 0.08</code></td></tr>
          <tr><td><code>pulse X for T</code></td><td>enciende X y lo apaga solo a los T s (sin <code>for</code>, 0,1 s)</td><td><code>pulse puerta for 3</code></td></tr>
          <tr><td><code>blink X on T1 off T2</code></td><td>alterna encendido y apagado; sin fin, <code>for T</code> segundos o <code>times N</code> veces</td><td><code>blink bip on 2 off 2 for 14</code></td></tr>
          <tr><td><code>toggle X</code></td><td>invierte X, como un interruptor</td><td><code>always: [toggle luz]</code></td></tr>
          <tr><td><code>after T:</code></td><td>una vez, cuando el estado lleva T s</td><td><code>after 3: [go to NEXT]</code></td></tr>

          <tr><td><code>hold: X</code></td><td>X encendido solo mientras se mantiene pulsado el botón</td><td><code>hold: puerta</code></td></tr>
          <tr><td><code>on release:</code></td><td>acciones al soltar el botón</td><td><code>on release: [turn off puerta]</code></td></tr>
          <tr><td><code>on hold T:</code></td><td>pulsación larga: se hace una vez cuando el botón lleva T s pulsado; lo de pulsar pasa a ser un toque corto, al soltar</td><td><code>on hold 3: [turn off fault]</code></td></tr>
        </tbody>
      </table></div>
      <p>Un <code>pulse</code> o un <code>blink</code> es de la <b>salida</b>, no del estado: sigue aunque cambies de estado, hasta
      acabar. <code>turn on</code>, <code>turn off</code> o <code>toggle</code> sobre esa salida lo cortan antes.</p>`, `
      <h2>The pieces of time</h2>
      <p>None of this stops the program: meanwhile the screen, the buttons and the link carry on. That is why there is no
      <code>delay</code>. <b>T</b> is seconds (0.05 and up) or the name of a setting, to adjust it from the screen.</p>
      <div class="tabla"><table>
        <thead><tr><th>Piece</th><th>What it does</th><th>Example</th></tr></thead>
        <tbody>
          <tr><td><code>click: X</code></td><td>a short beep with every button that does something; it goes once, at the top</td><td><code>click: beep</code> (0.05 s) or <code>click: beep for 0.08</code></td></tr>
          <tr><td><code>pulse X for T</code></td><td>turns X on and off by itself after T s (without <code>for</code>, 0.1 s)</td><td><code>pulse door for 3</code></td></tr>
          <tr><td><code>blink X on T1 off T2</code></td><td>alternates on and off; endlessly, <code>for T</code> seconds or <code>times N</code> times</td><td><code>blink beep on 2 off 2 for 14</code></td></tr>
          <tr><td><code>toggle X</code></td><td>flips X, like a switch</td><td><code>always: [toggle light]</code></td></tr>
          <tr><td><code>after T:</code></td><td>once, when the state has lasted T s</td><td><code>after 3: [go to NEXT]</code></td></tr>
          <tr><td><code>every T:</code></td><td>every T s while the state lasts</td><td><code>every 1: [increase counter]</code></td></tr>
          <tr><td><code>hold: X</code></td><td>X on only while the button is held down</td><td><code>hold: door</code></td></tr>
          <tr><td><code>on release:</code></td><td>actions on releasing the button</td><td><code>on release: [turn off door]</code></td></tr>
          <tr><td><code>on hold T:</code></td><td>long press: done once when the button has been held for T s; what pressing does becomes a short tap, on release</td><td><code>on hold 3: [turn off fault]</code></td></tr>

          <tr><td>Hardware outputs and inputs</td><td>the whole device</td><td>any block uses them by name</td></tr>
        </tbody>
      </table></div>
      <h2>How to add a function</h2>
      <ul class="reglas">
        <li>In the editor, <b>+ Another function (new block)</b> puts an empty block at the end. If what was there was loose, it becomes the <code>main</code> block.</li>

  { id: 'tft', parte: 3,

           ['tft-mal', { es: 'Si no se ve bien', en: 'If it does not look right' }]],
    html: () => X(`
    <h2 id="tft-pasos">Paso a paso</h2>
    <ol class="pasos">
      <li>En <b>Diseño</b>, <b>Placa de la pantalla</b>: elige tu placa con <b>+ pantalla aparte</b> (por ejemplo, «DevKit v1 + pantalla aparte»).</li>
      <li><b>Controlador</b>: el chip de la pantalla. Viene en el anuncio o impreso en el cable plano.</li>
      <li><b>Giro</b>: cada opción dice el tamaño con el que queda. El lienzo pasa a medir eso.</li>
      <li><b>Pines</b>: Telar propone los de los tutoriales (en un ESP32 clásico, SCK 18, MOSI 23 y MISO 19). Cámbialos a como lo cableaste. Un <code>-1</code> es un pin que no se usa.</li>
      <li><b>Retroiluminación</b>: el pin que la enciende, o <code>-1</code> si va directa a 3,3 V.</li>
      <li><b>Táctil</b>: el XPT2046 de las resistivas (por SPI) o uno capacitivo (GT911, FT6236, CST816S, por I2C). Al elegirlo, Telar propone pines libres.</li>
      <li><b>Exportar</b>. Sale <code>pantalla.h</code> con toda la descripción de la pantalla. Instala <b>LovyanGFX</b> y <b>lvgl</b> desde el gestor de librerías y sube.</li>
    </ol>
    <p class="consejo"><b>¿Por qué LovyanGFX y no TFT_eSPI?</b> TFT_eSPI se configura editando un fichero dentro de la librería
    (<code>User_Setup.h</code>): dos proyectos con pantallas distintas no pueden convivir en el mismo ordenador, y al actualizarla se
    pierde. Con LovyanGFX la pantalla se describe en el proyecto, en <code>pantalla.h</code>, y no hay que tocar nada más.</p>
    <h2 id="tft-mal">Si no se ve bien</h2>
    <div class="tabla"><table>
      <thead><tr><th>Lo que ves</th><th>Qué tocar</th></tr></thead>
      <tbody>
        <tr><td>Nada: pantalla en blanco o negra</td><td>los pines SCK, MOSI, DC y CS; que RESET esté bien o en <code>-1</code>; y la retroiluminación, que puede estar apagada</td></tr>
        <tr><td>El negro sale blanco</td><td><b>Colores invertidos</b>, en una <a href="#pantalla-medida">pantalla a medida</a></td></tr>
        <tr><td>El rojo sale azul</td><td><b>Orden de color</b> BGR, en una pantalla a medida</td></tr>
        <tr><td>El dibujo sale corrido unos píxeles</td><td><b>Desplazamiento</b> X o Y, en una pantalla a medida</td></tr>

    <h2 id="tft-pasos">Step by step</h2>
    <ol class="pasos">
      <li>In <b>Design</b>, <b>Screen board</b>: choose your board with <b>+ separate screen</b> (for example, "DevKit v1 + separate screen").</li>
      <li><b>Controller</b>: the screen's chip. It comes in the listing or printed on the flat cable.</li>
      <li><b>Rotation</b>: each option says the size it ends up with. The canvas takes that size.</li>
      <li><b>Pins</b>: Telar suggests the usual ones from tutorials (on a classic ESP32, SCK 18, MOSI 23 and MISO 19). Change them to how you wired it. A <code>-1</code> is a pin that is not used.</li>
      <li><b>Backlight</b>: the pin that turns it on, or <code>-1</code> if it goes straight to 3.3 V.</li>
      <li><b>Touch</b>: the XPT2046 of resistive screens (over SPI) or a capacitive one (GT911, FT6236, CST816S, over I2C). When you pick it, Telar suggests free pins.</li>
      <li><b>Export</b>. You get <code>pantalla.h</code> with the whole description of the screen. Install <b>LovyanGFX</b> and <b>lvgl</b> from the library manager and upload.</li>

    <p class="consejo"><b>Why LovyanGFX and not TFT_eSPI?</b> TFT_eSPI is configured by editing a file inside the library

      </tbody>
    </table></div>`) },

      <li><b>Placa de la pantalla</b>: tu placa con <b>+ pantalla aparte</b>. En <b>Controlador</b>, grupo <b>OLED, por I2C</b>: SSD1306 de 128×64 o de 128×32, o SH1106.</li>

    <h2 id="oled-pasos">Step by step</h2>
    <ol class="pasos">
      <li><b>Screen board</b>: your board with <b>+ separate screen</b>. Under <b>Controller</b>, group <b>OLED, over I2C</b>: SSD1306 128×64 or 128×32, or SH1106.</li>

      <li><b>Black or white, nothing else.</b> Every colour in the design becomes one of the two: dark ones black and whatever should be seen white. Grey does not exist.</li>
      <li><b>The smallest font is 10 px.</b> 8 px cannot be read on an OLED. If <code>lv_conf.h</code> has one switched off, the compiler says which.</li>
      <li><b>The OLED gets its own I2C bus.</b> I2C sensors you add go on another pair of pins, each bus with its own controller.</li>
      <li><b>On an ESP32-C3</b> there is a single I2C controller and the screen takes it: there is no room for I2C sensors there, and the sensor's row says so.</li>
    </ul>
    <h2 id="oled-nada">If nothing shows</h2>
    <div class="tabla"><table>
      <thead><tr><th>What you see</th><th>What to change</th></tr></thead>
      <tbody>
        <tr><td>Nothing</td><td>the <b>address</b>: try 0x3D (a resistor on the back decides it); and that SDA and SCL are not swapped</td></tr>
        <tr><td>Shifted, with garbage at one edge</td><td>it is an SH1106 chosen as SSD1306 (or the other way round): change the controller</td></tr>
        <tr><td>On the 128×32, every other row missing</td><td>it is set as 128×64: choose the 128×32 one</td></tr>
        <tr><td>The buttons do nothing</td><td>that they are on the screen node and wired to ground (with the internal pull-up, the default option)</td></tr>
      </tbody>
    </table></div>`) },

  { id: 'nextion', parte: 3,
    titulo: { es: 'Nextion y pantallas por puerto serie', en: 'Nextion and serial-port screens' },

    html: () => X(`
    <p>Una Nextion se dibuja en su propio programa, el <b>Nextion Editor</b>. Su formato es cerrado, así que Telar no puede
    escribirlo: escribe el código del ESP32 y una <b>hoja</b>, <code>NEXTION.txt</code>, con todo lo que hay que crear allí, en el orden en que se hace.</p>
    <h2 id="nx-pasos">Paso a paso</h2>
    <ol class="pasos">
      <li><b>Placa de la pantalla</b>: tu placa con <b>+ pantalla aparte</b>; en <b>Controlador</b>, el grupo <b>por puerto serie</b> y tu modelo.</li>
      <li><b>TX</b> y <b>RX</b>, cruzados: el TX de la placa al RX de la pantalla y al revés. Y las masas unidas.</li>
      <li>Diseña en Telar como siempre. La paleta solo ofrece lo que tiene equivalente en la Nextion.</li>
      <li><b>Exportar</b>. Abre <code>NEXTION.txt</code> y síguelo en el Nextion Editor: crea una fuente, las páginas y cada componente con su <code>objname</code> exacto, su posición, sus colores y el código de sus botones.</li>
      <li>Compila allí el <code>.tft</code> y cárgalo en la pantalla (por microSD o por el puerto serie). Sube el sketch al ESP32.</li>
    </ol>
    <p class="consejo">El ESP32 manda <b>solo lo que cambia</b> y, al cambiar de página, todo otra vez. Los botones le mandan su
    nombre; los que repiten al mantenerlos, uno al pulsar y otro al soltar. No hace falta marcar «Send Component ID».</p>
    <h2 id="nx-equivalencias">Qué elemento es qué componente</h2>
    <div class="tabla"><table>
      <thead><tr><th>En Telar</th><th>En la Nextion</th><th>Qué cambia el ESP32</th></tr></thead>
      <tbody>
        <tr><td>Texto, Número grande, Temporizador, Tira de estado</td><td>Text</td><td>el texto (<code>txt</code>) y, si la lógica lo pide, el color de la letra</td></tr>
        <tr><td>Barra</td><td>Progress bar</td><td>el valor, de 0 a 100</td></tr>
        <tr><td>Botón</td><td>Button</td><td>su texto y su color, si la lógica los cambia</td></tr>

        <tr><td>Nada cambia en la pantalla</td><td>TX y RX cruzados, la misma velocidad en los dos lados, y el <code>objname</code> escrito exactamente igual que en la hoja</td></tr>

    <h2 id="nx-lineas">Otra pantalla o micro: texto por líneas</h2>
    <p>Para cualquier cosa que sepa leer líneas de texto por el puerto serie: otra pantalla con su micro, un segundo Arduino o

    <p class="tenue">La lista de páginas y objetos de tu proyecto va en su LEEME.</p>`, `
    <p>A Nextion is drawn in its own program, the <b>Nextion Editor</b>. Its format is closed, so Telar cannot write it:

    <h2 id="nx-pasos">Step by step</h2>
    <ol class="pasos">
      <li><b>Screen board</b>: your board with <b>+ separate screen</b>; under <b>Controller</b>, the <b>over a serial port</b> group and your model.</li>

      <li>Design in Telar as usual. The palette only offers what has an equivalent on the Nextion.</li>
      <li><b>Export</b>. Open <code>NEXTION.txt</code> and follow it in the Nextion Editor: create a font, the pages and each component with its exact <code>objname</code>, its position, its colours and its buttons' code.</li>

    </ol>
    <p class="consejo">The ESP32 sends <b>only what changes</b> and, on a page change, everything again. Buttons send it their
    name; those that repeat when held send one on press and another on release. There is no need to tick "Send Component ID".</p>
    <h2 id="nx-equivalencias">Which element is which component</h2>
    <div class="tabla"><table>
      <thead><tr><th>In Telar</th><th>On the Nextion</th><th>What the ESP32 changes</th></tr></thead>
      <tbody>
        <tr><td>Text, Big number, Timer, State strip</td><td>Text</td><td>the text (<code>txt</code>) and, if the logic asks, the font colour</td></tr>
        <tr><td>Bar</td><td>Progress bar</td><td>the value, 0 to 100</td></tr>
        <tr><td>Button</td><td>Button</td><td>its text and colour, if the logic changes them</td></tr>
        <tr><td>Switch, Checkbox</td><td>Dual-state button</td><td>the value, 0 or 1</td></tr>
        <tr><td>LED</td><td>Text with no text</td><td>the background colour</td></tr>
        <tr><td>Panel, Line</td><td>Text with no text</td><td>nothing: they are just a coloured box</td></tr>
      </tbody>
    </table></div>
    <h2 id="nx-mal">If something does not work</h2>
    <div class="tabla"><table>
      <thead><tr><th>What you see</th><th>What to check</th></tr></thead>
      <tbody>
        <tr><td>Nothing changes on the screen</td><td>TX and RX crossed, the same speed on both sides, and the <code>objname</code> written exactly as in the sheet</td></tr>
        <tr><td>A text is cut short</td><td>that component's <code>txt_maxl</code>: it ships at 10</td></tr>
        <tr><td>Texts come out blank</td><td>the font is missing (Tools &gt; Font Generator)</td></tr>
        <tr><td>A button does nothing</td><td>its event code: <code>print "#name"</code> and, on another line, <code>printh FF FF FF</code></td></tr>
      </tbody>
    </table></div>
    <h2 id="nx-lineas">Another screen or micro: text lines</h2>
    <p>For anything that can read lines of text over the serial port: another screen with its own micro, a second Arduino or

    <div class="tabla"><table>
      <thead><tr><th>Direction</th><th>Line</th><th>Meaning</th></tr></thead>
      <tbody>
        <tr><td>ESP32 → screen</td><td><code>PAGE principal</code></td><td>change page</td></tr>
        <tr><td>ESP32 → screen</td><td><code>SET tension.txt 12.3</code></td><td>set this text</td></tr>
        <tr><td>ESP32 → screen</td><td><code>SET barra.val 45</code></td><td>set this number (bars 0 to 100; switches 0 or 1)</td></tr>
        <tr><td>ESP32 → screen</td><td><code>SET marcha.bco #3ddc97</code></td><td>background colour (<code>pco</code>: the font's)</td></tr>
        <tr><td>screen → ESP32</td><td><code>EVT marcha</code></td><td>a touch</td></tr>
        <tr><td>screen → ESP32</td><td><code>DOWN mas</code> / <code>UP mas</code></td><td>a long press starts and ends, on buttons that repeat</td></tr>
      </tbody>
    </table></div>
    <p class="tenue">The list of pages and objects of your project is in its README.</p>`) },

  { id: 'pantalla-medida', parte: 3,

    <p>En el bloque de la pantalla aparte, <b>+ Pantalla a medida</b>. Lo único que hay que saber de verdad es el <b>chip</b>

  { id: 'diseno-pro', parte: 3,
    titulo: { es: 'Del aula a la industria', en: 'From the classroom to industry' },
    resumen: { es: 'Un tema sobrio, componentes de panel de instrumentos y plantillas de pantalla: una interfaz profesional sin dibujar cada píxel.',
               en: 'A sober theme, instrument-panel components and screen templates: a professional interface without drawing every pixel.' },
    subs: [['dp-tema', { es: 'El tema', en: 'The theme' }],
           ['dp-componentes', { es: 'Los componentes industriales', en: 'The industrial components' }],
           ['dp-plantillas', { es: 'Las plantillas', en: 'The templates' }],
           ['dp-otras', { es: 'En una OLED o una Nextion', en: 'On an OLED or a Nextion' }]],
    html: () => X(`
    <p>Tres piezas, de la más general a la más concreta. Ninguna obliga a nada: un proyecto de clase sigue funcionando igual, y
    se puede pasar de uno a otro en cualquier momento.</p>
    <h2 id="dp-tema">El tema</h2>
    <p>En la pestaña <b>Estilo</b>, el tema <b>Industrial</b> pone los colores de un instrumento de banco: fondo casi negro,
    tarjetas un punto más claras, un azul para lo que se mide y verde, ámbar y rojo solo para lo que significan. También cambia la
    letra: <b>Chivo</b> para los números y los títulos, <b>IBM Plex Mono</b> para los datos y los rótulos. Cada elemento toma la
    letra de su <b>papel</b> (número, título, dato, rótulo o texto), así que no hay que elegirla una por una.</p>
    <ul class="reglas">
      <li><b>Clases de botón</b>: <i>botón</i> para lo normal, <i>selección</i> para lo elegido, <i>marcha</i> (verde) para arrancar
      y <i>paro</i> (rojo) para parar. Se elige en el panel del botón; el color sale del tema (pestaña <b>Estilo</b>, sección <b>Botones</b>).</li>
      <li><b>Coma decimal</b>: en el bloque Tipografía. Los números salen como <code>33,3</code> en la pantalla y en el simulador.</li>
      <li>Hay también <b>Industrial claro</b>, para paneles a pleno sol, y <b>Alto contraste</b>.</li>
    </ul>
    <h2 id="dp-componentes">Los componentes industriales</h2>
    <p>Están en la paleta, entre los de siempre: <b>hay uno por trabajo</b>. Cada uno es una pieza completa, con sus partes ya
    colocadas: se enlaza a una variable y ya está, y lo que cambia la presentación son opciones suyas (en tarjeta o suelto, con
    escala o sin ella, de 270° o de 180°).</p>
    <div class="tabla"><table>
      <thead><tr><th>Componente</th><th>Qué muestra</th><th>Qué se le dice</th></tr></thead>
      <tbody>
        <tr><td>Tarjeta o panel</td><td>un fondo para agrupar, con rótulo si quieres</td><td>el rótulo y, si lleva, el color del borde</td></tr>
        <tr><td>Número</td><td>un valor con su unidad; suelto y enorme, o en tarjeta como un dato</td><td>la variable, la unidad, los decimales y <b>En tarjeta</b>; si es un tiempo, sale como mm:ss</td></tr>
        <tr><td>Estado actual</td><td>el estado, en una píldora de color</td><td>nada: texto y color salen de <code>looks</code></td></tr>
        <tr><td>Pasos del proceso</td><td>una casilla por estado; se ilumina la actual</td><td>el texto de cada casilla</td></tr>
        <tr><td>Barra</td><td>se llena con la medida, con escala y marca de consigna opcionales</td><td>la variable, el rango, la escala y la marca</td></tr>
        <tr><td>Curva</td><td>la medida en el tiempo, con escala automática</td><td>la variable, la consigna, una referencia y la ventana</td></tr>
        <tr><td>Reloj de aguja</td><td>un arco de 270° o de 180° con el valor en el centro</td><td>la variable, el rango, la apertura y la marca</td></tr>
      </tbody>
    </table></div>
    <p>La barra, la curva y el reloj marcan la <b>consigna</b> en verde. La marca sale siempre, aunque el proyecto aún no tenga
    lógica: sin variable se coloca en un <b>valor fijo</b> que escribes tú, y en cuanto haya un ajuste (<code>setting</code>) se
    puede enlazar a él y la marca lo sigue en vivo. Si no la quieres, se desmarca <b>Mostrar la marca de consigna</b> en Diseño;
    la consigna elegida se conserva. Su color, como todos, en la pestaña Estilo.</p>
    <p>Y en la lógica, <code>enabled: no</code> apaga un botón mientras no toca: lo explica <a href="#apagar">Apagar un botón mientras no toca</a>.</p>
    <h2 id="dp-plantillas">Las plantillas</h2>
    <p>En la pestaña <b>Diseño</b>, en la columna de la izquierda, abre la sección <b>Plantillas</b>. Cada dibujo muestra lo que se va a
    crear, ya en tu pantalla y con tus colores.</p>
    <ul class="reglas">
      <li><b>Operación</b>: la medida en grande con su barra, la curva, tres datos, los pasos y MARCHA / PARO.</li>
      <li><b>Ajustes</b>: tres valores con − y +, y GUARDAR.</li>
      <li><b>Diagnóstico</b>: un reloj de aguja y cuatro valores.</li>
      <li><b>En blanco</b>: solo la cabecera y la botonera.</li>
    </ul>
    <p>Si la pantalla en la que estás está vacía, la plantilla se pone ahí; si no, crea una nueva. La <b>navegación viene hecha</b>:
    AJUSTES y DIAGNÓSTICO llevan a sus pantallas en cuanto existen, y VOLVER lleva a Operación. Lo que <b>no</b> viene hecho es el
    enlace de cada pieza: eso lo decides tú, en <b>Enlazado a</b>.</p>
    <p>Las piezas se llaman como en los ejemplos de esta guía (<code>btn_start</code>, <code>reading</code>, <code>countdown</code>…):
    un programa de aquí encaja sin renombrar nada.</p>
    <p class="tenue">Las plantillas no se estiran: se calculan para cada pantalla. En una de 800×480 salen las medidas del HMI
    del variac; en una de 320×240 se reorganizan (la curva no cabe y se quita) sin bajar de una letra legible. Por debajo de
    320×240 no se ofrecen.</p>
    <h2 id="dp-otras">En una OLED o una Nextion</h2>
    <p>Los componentes se <b>degradan solos</b> a lo que la pantalla sabe hacer. En una OLED se ven en blanco y negro; la curva no se
    ofrece. En una Nextion, la barra pasa a su barra de progreso y la lectura, el dato y el reloj pasan a un texto con el número. La
    curva no tiene equivalente y aparece en la lista de «dibújalos a mano» de <code>NEXTION.txt</code>.</p>`, `
    <p>Three pieces, from the most general to the most specific. None of them is compulsory: a classroom project keeps working the
    same, and you can switch between them at any time.</p>
    <h2 id="dp-tema">The theme</h2>
    <p>In the <b>Style</b> tab, the <b>Industrial</b> theme sets the colours of a bench instrument: an almost black background,
    cards a shade lighter, a blue for what is measured, and green, amber and red only for what they mean. It also changes the
    lettering: <b>Chivo</b> for numbers and titles, <b>IBM Plex Mono</b> for values and captions. Each element takes the font of
    its <b>role</b> (number, title, value, caption or text), so you do not pick them one by one.</p>
    <ul class="reglas">
      <li><b>Button classes</b>: <i>button</i> for normal ones, <i>selection</i> for the chosen one, <i>start</i> (green) to start
      and <i>stop</i> (red) to stop. Chosen in the button panel; the colour comes from the theme (<b>Style</b> tab, <b>Buttons</b> section).</li>
      <li><b>Decimal comma</b>: in the Typography block. Numbers show as <code>33,3</code> on the screen and in the simulator.</li>
      <li>There is also <b>Industrial light</b>, for panels in full sun, and <b>High contrast</b>.</li>
    </ul>
    <h2 id="dp-componentes">The industrial components</h2>
    <p>They are in the palette, among the usual ones: <b>there is one per job</b>. Each one is a complete piece with its parts
    already placed: bind it to a variable and you are done, and what changes the presentation are its own options (in a card or on
    its own, with or without a scale, 270° or 180°).</p>
    <div class="tabla"><table>
      <thead><tr><th>Component</th><th>What it shows</th><th>What you tell it</th></tr></thead>
      <tbody>
        <tr><td>Card or panel</td><td>a background to group things, with a caption if you want</td><td>the caption and, if it has one, the border colour</td></tr>
        <tr><td>Number</td><td>a value with its unit; on its own and huge, or in a card as a panel value</td><td>the variable, the unit, the decimals and <b>In a card</b>; if it is a time, it shows as mm:ss</td></tr>
        <tr><td>Current state</td><td>the state, in a coloured pill</td><td>nothing: text and colour come from <code>looks</code></td></tr>
        <tr><td>Process steps</td><td>one box per state; the current one lights up</td><td>the text of each box</td></tr>
        <tr><td>Bar</td><td>fills with the measurement, with optional scale and setpoint mark</td><td>the variable, the range, the scale and the mark</td></tr>
        <tr><td>Trend</td><td>the measurement over time, with an automatic scale</td><td>the variable, the setpoint, a reference and the window</td></tr>
        <tr><td>Gauge</td><td>a 270° or 180° arc with the value in the centre</td><td>the variable, the range, the opening and the mark</td></tr>
      </tbody>
    </table></div>
    <p>The bar, the trend and the gauge mark the <b>setpoint</b> in green. The mark always shows, even if the project has no logic
    yet: without a variable it sits at a <b>fixed value</b> you type, and as soon as there is a <code>setting</code> it can be bound
    to it and the mark follows it live. If you do not want it, untick <b>Show the setpoint mark</b> in Design; the chosen setpoint
    is kept. Its colour, like all colours, in the Style tab.</p>
    <p>And in the logic, <code>enabled: no</code> disables a button when it does not apply: see <a href="#apagar">Disable a button when it does not apply</a>.</p>
    <h2 id="dp-plantillas">The templates</h2>
    <p>In the <b>Design</b> tab, in the left column, open the <b>Templates</b> section. Each drawing shows what will be created,
    already on your screen and in your colours.</p>
    <ul class="reglas">
      <li><b>Operation</b>: the big measurement with its bar, the trend, three values, the steps and START / STOP.</li>
      <li><b>Settings</b>: three values with − and +, and SAVE.</li>
      <li><b>Diagnostics</b>: a gauge and four values.</li>
      <li><b>Blank</b>: just the header and the button bar.</li>
    </ul>
    <p>If the screen you are on is empty, the template goes there; otherwise it creates a new one. <b>Navigation comes ready</b>:
    SETTINGS and DIAGNOSTICS go to their screens as soon as they exist, and BACK goes to Operation. What does <b>not</b> come ready
    is what each piece is bound to: you decide that, in <b>Bound to</b>.</p>
    <p>The pieces are named as in the examples of this guide (<code>btn_start</code>, <code>reading</code>, <code>countdown</code>…):
    a program from here fits without renaming anything.</p>
    <p class="tenue">Templates are not stretched: they are calculated for each screen. On an 800×480 one you get the measurements of
    the variac HMI; on a 320×240 one they are rearranged (the trend does not fit and is dropped) without going below a readable
    font. Below 320×240 they are not offered.</p>
    <h2 id="dp-otras">On an OLED or a Nextion</h2>
    <p>Components <b>degrade by themselves</b> to what the screen can do. On an OLED they show in black and white; the trend is not
    offered. On a Nextion, the bar becomes its progress bar and the reading, value and gauge become a text with the number. The
    trend has no equivalent and appears in the "draw them by hand" list in <code>NEXTION.txt</code>.</p>`) },
];

/* Los apartados de cada capítulo, para el índice y «En este capítulo» */
function apartados(cap){
  if (cap.ejemplos) return ejemplosDe(cap.id).map(e => [`ej-${e.id}`, T(e.titulo), numeroDe(e.id)]);
  if (cap.recetas) return Object.entries(LOGICA.RECIPES).map(([k, r]) => [`receta-${k}`, r.title, '']);
  if (cap.subs) return cap.subs.map(([id, t]) => [id, T(t), '']);
  return [];
}

/* ¿En qué capítulo está este ancla? */
function capituloDe(ancla){
  const directo = CAPS.find(c => c.id === ancla);
  if (directo) return directo;
  if (ancla.startsWith('ej-')){ const e = EJEMPLOS.find(x => `ej-${x.id}` === ancla); if (e) return CAPS.find(c => c.id === e.grupo); }
  if (ancla.startsWith('receta-')) return CAPS.find(c => c.id === 'recetas');
  if (ancla.startsWith('p-')) return CAPS.find(c => c.id === 'diccionario');
  const conSub = CAPS.find(c => (c.subs || []).some(([id]) => id === ancla));
  if (conSub) return conSub;
  return null;
}

function pintarIndice(actual){
  $('indice').innerHTML = `<div class="cabeza">
      <a class="marca" href="#inicio">Telar Studio<small>${X('Documentación', 'Documentation')}</small></a>
      <div class="idioma" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="${LANG === 'es'}" title="Español">ES</button>
        <button type="button" data-lang="en" aria-pressed="${LANG === 'en'}" title="English">EN</button>
      </div>
    </div>` +
    PARTES.map(([nombre], p) => `<div class="parte"><b>${p + 1} · ${T(nombre)}</b>${CAPS.filter(c => c.parte === p).map(c => {
      const i = CAPS.indexOf(c), activo = c === actual;
      const subs = activo ? apartados(c) : [];
      return `<a class="cap${activo ? ' activo' : ''}" href="#${c.id}"${activo ? ' aria-current="page"' : ''}><span>${i + 1}</span>${T(c.titulo)}</a>`
        + (subs.length ? `<div class="subs">${subs.map(([id, t, n]) => `<a href="#${id}">${n ? `<i>${n}</i>` : ''}${esc(t)}</a>`).join('')}</div>` : '');
    }).join('')}</div>`).join('');
  $('indice').querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => cambiarIdioma(b.dataset.lang)));
}

function inicio(){
  return `<p class="eyebrow">Telar Studio</p>
    <h1>${X('Documentación de Telar', 'Telar documentation')}</h1>
    <p class="lead">${X(`Cómo decirle al aparato qué hacer: qué pasa en cada momento, qué hace cada botón y cómo se ve la pantalla.
    Todo lo de estas páginas —palabras, ejemplos, recetas y mensajes de error— sale del mismo archivo que usa el editor,
    así que no puede decir una cosa y aceptar otra.`, `How to tell the device what to do: what happens at each moment, what each button does and how the screen looks.
    Everything in these pages — words, examples, recipes and error messages — comes from the same file the editor uses,
    so it cannot say one thing and accept another.`)}</p>
    <div class="partes">${PARTES.map(([nombre, desc], p) => `<div class="tarjeta-parte">
      <span class="n">${X('Parte', 'Part')} ${p + 1}</span><h2>${T(nombre)}</h2><p>${T(desc)}</p>
      <ol>${CAPS.filter(c => c.parte === p).map(c => `<li><a href="#${c.id}"><span>${CAPS.indexOf(c) + 1}</span>${T(c.titulo)}</a></li>`).join('')}</ol>
    </div>`).join('')}</div>
    <p class="consejo">${X(`<b>¿Por dónde empiezo?</b> Si es tu primera vez, lee la parte 1 en orden y sigue con la parte 2
    con el simulador abierto: cada ejemplo trae qué tocar para verlo funcionar. La parte 3 no se lee de corrido: se consulta
    cuando la necesitas. La parte 4 es para cuando elijas en qué pantalla va el aparato.`, `<b>Where do I start?</b> If it is your first time, read part 1 in order and continue with part 2
    with the simulator open: each example says what to touch to see it working. Part 3 is not read straight through: you look
    things up when you need them. Part 4 is for when you choose which screen the device goes on.`)}</p>`;
}

function capitulo(cap){
  const i = CAPS.indexOf(cap), ant = CAPS[i - 1], sig = CAPS[i + 1], subs = apartados(cap);
  return `<p class="eyebrow">${X('Parte', 'Part')} ${cap.parte + 1} · ${T(PARTES[cap.parte][0])} — ${X(`capítulo ${i + 1} de ${CAPS.length}`, `chapter ${i + 1} of ${CAPS.length}`)}</p>
    <h1>${T(cap.titulo)}</h1>
    <p class="lead">${T(cap.resumen)}</p>
    ${subs.length ? `<nav class="en-cap" aria-label="${X('En este capítulo', 'In this chapter')}"><b>${X('En este capítulo', 'In this chapter')}</b>${subs.map(([id, t, n]) =>
      `<a href="#${id}">${n ? `<i>${n}</i>` : ''}${esc(t)}</a>`).join('')}</nav>` : ''}
    ${cap.html()}
    <nav class="pie-cap" aria-label="${X('Capítulos', 'Chapters')}">
      ${ant ? `<a href="#${ant.id}"><small>${X('← Anterior', '← Previous')}</small>${T(ant.titulo)}</a>` : `<a href="#inicio"><small>${X('← Volver', '← Back')}</small>${X('Inicio', 'Home')}</a>`}
      ${sig ? `<a class="sig" href="#${sig.id}"><small>${X('Siguiente →', 'Next →')}</small>${T(sig.titulo)}</a>` : ''}
    </nav>`;
}

let capActual, pintado = false;
function mostrar(forzar){
  const ancla = decodeURIComponent(location.hash.slice(1));
  const cap = ancla && ancla !== 'inicio' ? capituloDe(ancla) : null;
  if (forzar || cap !== capActual || !pintado){
    $('contenido').innerHTML = cap ? capitulo(cap) : inicio();
    pintarIndice(cap);
    capActual = cap; pintado = true;
  }
  const destino = cap && ancla !== cap.id ? document.getElementById(ancla) : null;
  if (destino) destino.scrollIntoView({ block: 'start' });
  else if (!forzar){ window.scrollTo(0, 0); $('contenido').focus({ preventScroll: true }); }
}

/* Cambiar de idioma: la página, lo que viene de logica.js y la dirección */
function aplicarIdioma(){
  LOGICA.setLang(LANG);
  document.documentElement.lang = LANG;
  document.title = X('Documentación de Telar', 'Telar documentation');
}
function cambiarIdioma(l){
  if (l === LANG || (l !== 'es' && l !== 'en')) return;
  LANG = l;
  try { localStorage.setItem('telar_idioma', l); } catch (e) {}
  try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch (e) {}
  aplicarIdioma();
  mostrar(true);
}

function arrancar(){ aplicarIdioma(); addEventListener('hashchange', () => mostrar()); mostrar(); }

/* logica.js vive en la carpeta de arriba dentro de Telar Studio, y al lado
   cuando la página se publica sola. Se prueba primero una y luego la otra. */
function cargar(src, ok, ko){ const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }
cargar('../logica.js', arrancar, () => cargar('logica.js', arrancar, () => {
  $('contenido').innerHTML = `<div class="aviso-carga">${X('No encuentro <code>logica.js</code>. Esta página tiene que estar en la carpeta <code>docs</code> de Telar Studio.',
    'Cannot find <code>logica.js</code>. This page has to be in the <code>docs</code> folder of Telar Studio.')}</div>`;
}));
</script>
