# Instaladores de Telar Studio de escritorio para Windows, macOS y Linux.
#
# Se ejecuta al subir una etiqueta de version (v1.0.0, v1.1.0...): compila
# en las tres maquinas de GitHub y publica los instaladores en Releases.
# Tambien se puede lanzar a mano desde la pestana Actions (sin publicar:
# los instaladores quedan como artefactos de esa ejecucion).
name: Instaladores de escritorio

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  compilar:
    name: Compilar (${{ matrix.nombre }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nombre: Windows, destino: --win }
          - { os: macos-latest,   nombre: macOS,   destino: --mac }
          - { os: ubuntu-latest,  nombre: Linux,   destino: --linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: escritorio/package-lock.json

      - name: Dependencias
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Instalador
        run: npm run web && npx electron-builder ${{ matrix.destino }} --publish never
        env:
          # Sin certificado de firma: que electron-builder no busque uno
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: TelarStudio-${{ matrix.nombre }}
          if-no-files-found: error
          # latest*.yml y .blockmap: los lee la app instalada para actualizarse sola
          path: |
            escritorio/dist/*.exe
            escritorio/dist/*.dmg
            escritorio/dist/*.AppImage
            escritorio/dist/*.deb
            escritorio/dist/latest*.yml
            escritorio/dist/*.blockmap

  publicar:
    name: Publicar en Releases
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Telar Studio ${{ github.ref_name }}
          files: instaladores/*
          body: |
            ## Downloads · Descargas

            | System · Sistema | File · Archivo |
            |---|---|
            | **Windows** 10/11 | `TelarStudio-…-win-x64.exe` |
            | **macOS** (Intel & Apple Silicon) | `TelarStudio-…-mac-universal.dmg` |
            | **Linux** | `TelarStudio-…-linux-x86_64.AppImage` · `.deb` (Debian/Ubuntu) |

            ### English

            - **Windows:** double-click the `.exe` and it installs itself.
            - **macOS:** open the `.dmg` and drag Telar Studio to Applications.
            - **Linux:** make the `.AppImage` executable and open it, or install the `.deb`.

            **First launch:** the app is not signed yet.
            - On **Windows**, if you see "Windows protected your PC": *More info* → *Run anyway*.
            - On **macOS**: right-click Telar Studio → *Open* → *Open*.

            You can also use it without installing anything: open `telar-studio.html` in Chrome or Edge. The interface is available in English and Spanish.

            ### Español

            - **Windows:** doble clic en el `.exe` y se instala solo.
            - **macOS:** abre el `.dmg` y arrastra Telar Studio a Aplicaciones.
            - **Linux:** dale permiso de ejecución al `.AppImage` y ábrelo, o instala el `.deb`.

            **La primera vez:** la aplicación todavía no está firmada.
            - En **Windows**, si sale «Windows protegió su PC»: *Más información* → *Ejecutar de todas formas*.
            - En **macOS**: clic derecho sobre Telar Studio → *Abrir* → *Abrir*.

            También se puede usar sin instalar nada: abre `telar-studio.html` en Chrome o Edge. La interfaz está en español y en inglés.
