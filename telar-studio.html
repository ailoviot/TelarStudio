    }
    h += seccion('proyecto-sel', t('Proyecto'), bloqueProyecto);
    return { izq, der: cabecera(icoWidget('_varios'), `${varios.length} ${t('widgets seleccionados')}`, esc(t('Alinear, repartir y colorear juntos')))
                       + `<div class="insp-cuerpo">${h}</div>` };
  }

  if (!w){
    h += seccion('proyecto', t('Proyecto'), bloqueProyecto);
    h += `<div class="nota info" style="margin-top:12px">${t('ayuda:seleccion')}</div>`;
  } else {
    const cat = WIDGETS[w.tipo];
    h += `<details class="sec" data-sec="props"${abierta('props')}><summary>${t('Propiedades')}</summary>
      <div class="regla" style="margin-bottom:10px">${esc(t(cat.ayuda))}</div>
      <label class="campo"><span>${t('Nombre en el código')}</span><input type="text" id="wNombre" value="${esc(w.nombre)}"></label>`;

    if (cat.acepta === 'lectura' || cat.acepta === 'escritura'){
      const o = varsPara(cat.acepta);
      h += `<label class="campo"><span>${t('Enlazado a')}</span><select id="wBind">
        <option value="">${t('— sin enlazar —')}</option>${o.map(v =>
        `<option value="${v.nombre}"${w.bind===v.nombre?' selected':''}>${esc(v.nombre)}${v.remota?' ⇄':''} (${esc(v.unidad||'—')})</option>`).join('')}
      </select></label>`;
      /* Con errores, la lógica no crea sus variables (setting y timer): decirlo
         aquí, que es donde se nota, en vez de mandar a buscar a Hardware. */
      const erroresLogica = (E.logica || '').trim() ? (logicaValidada().errors || []).length : 0;
      if (erroresLogica) h += `<div class="nota aviso">${t('La lógica tiene errores, así que sus variables (<b>setting</b> y <b>timer</b>) todavía no aparecen aquí. Arréglalos en la pestaña <b>Lógica</b> y vuelve.')}</div>`;
      else if (!o.length) h += `<div class="nota aviso">${t('No hay variables de este tipo. Añade hardware en la pestaña <b>Hardware</b>.')}</div>`;
      const vb = o.find(v => v.nombre === w.bind);
      if (w.tipo === 'scale') h += `<div class="nota info">La <b>Escala</b> es una regla fija: usa
        el enlace sólo para saber de qué número a qué número va, y no se mueve. Sirve de fondo
        para una <b>Aguja</b> o una <b>Barra</b> puestas encima.</div>`;
      if (vb?.remota) h += `<div class="nota info">${t('bind:remota').replace('{nodo}', esc(vb.nodo))}</div>`;
    }
    if (cat.acepta === 'series'){
      const o = varsPara('series');
      h += `<label class="campo"><span>${t('Señales del gráfico')}</span></label>`;
      h += o.length ? o.map(v => `<label style="display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:13px">
        <input type="checkbox" data-serie="${v.nombre}" style="width:auto"${(w.series||[]).includes(v.nombre)?' checked':''}>
        ${esc(v.nombre)}${v.remota?' ⇄':''}</label>`).join('')
        : `<div class="nota aviso">Sin variables que dibujar todavía.</div>`;
    }
    if (w.tipo === 'value'){
      h += `<div class="nota info">Este widget <b>no lleva texto</b>: lo escribe la variable
        cuando el aparato está en marcha. Con <b>doble clic</b> editas el valor de ejemplo,
        y las cifras que pongas tras el punto fijan los decimales.</div>
        <div class="fila">
          <label class="campo"><span>${t('Decimales')}</span><select id="wDecimales">${
            [0,1,2,3].map(d => `<option value="${d}"${(w.decimales??1)===d?' selected':''}>${d}</option>`).join('')
          }</select></label>
          <label class="campo"><span>${t('Ejemplo en el editor')}</span>
            <input type="number" id="wEjemplo" step="any" value="${w.ejemplo ?? 0}"></label>
        </div>
        <div class="regla" style="margin-bottom:10px">El ejemplo sólo se ve aquí; sirve para
        comprobar que el número más largo cabe. En la placa manda la medida.</div>`;
    }

    if (['label','button','checkbox','dropdown','textarea'].includes(w.tipo))
      h += `<label class="campo"><span>${t('Texto visible')}</span><input type="text" id="wTexto" value="${esc(w.texto||'')}"></label>`;
    /* las esquinas: de la tarjeta y del boton. En blanco, las del tema */
    if (w.tipo === 'tarjeta' || w.tipo === 'button')
      h += `<label class="campo"><span>${t('Esquinas redondeadas (px)')}</span>
        <input type="number" id="wRadio" min="0" max="60" step="1" value="${(w.estilo || {}).radio ?? ''}"
          placeholder="${radioTema()}"></label>`;
    /* Los componentes con rotulo: el texto pequeno de arriba */
    if (['tarjeta','lectura','dato','tiempo'].includes(w.tipo))
      h += `<label class="campo"><span>${t('Rótulo')}</span><input type="text" id="wTexto" value="${esc(w.texto||'')}" placeholder="${t('sin rótulo')}"></label>`;
    /* en el Numero y el Tiempo el rotulo va donde se quiera y con su letra */
    if (['lectura', 'tiempo', 'tarjeta'].includes(w.tipo) && w.texto)
      h += `<div class="fila">
          <label class="campo"><span>${t('Rótulo X (px)')}</span><input type="number" id="wRotuloDx" step="1" value="${w.rotuloDx ?? ''}" placeholder="0"></label>
          <label class="campo"><span>${t('Rótulo Y (px)')}</span><input type="number" id="wRotuloDy" step="1" value="${w.rotuloDy ?? ''}" placeholder="0"></label>
        </div>` + letraDeParte(w, 'rot', 'rotulo') +
        `<div class="regla" style="margin:-4px 0 8px">${t('O arrástralo en el lienzo con el ratón: con el elemento seleccionado, el rótulo sale recuadrado.')}</div>`;
    if (w.tipo === 'lectura' || w.tipo === 'tiempo')
      h += `<label class="interruptor" style="margin:2px 0 10px"><input type="checkbox" id="wTarjeta"${w.tarjeta ? ' checked' : ''}>
        <span>${t('En tarjeta')}</span></label>
        <div class="regla" style="margin:-6px 0 10px">${t('Con tarjeta queda como un dato de panel: fondo propio y número mediano. Sin ella, el número manda en la pantalla.')}</div>`;
    /* El valor y la unidad, en el orden en que se piensan: primero que
       numero se ve, luego con que unidad y donde, y al final el ajuste
       fino. El Tiempo no lleva ni decimales ni unidad: es mm:ss. */
    if (['lectura','dato','tiempo'].includes(w.tipo)){
      const v0 = varsPara('lectura').find(v => v.nombre === w.bind);
      const ch = choquesReserva(w);
      if (ch) h += `<div class="nota aviso" style="margin-bottom:10px">${t('Con su valor más ancho')} (<b>${esc(ch.texto)}</b>) ${t('ocupa')} ${ch.ancho} px ${
          ch.con.length ? t('y se mete debajo de') + ' <b>' + ch.con.map(esc).join(', ') + '</b>' : t('y se sale de la pantalla')}. ${
          t('En la placa no se corta, pero se montaría encima. Baja el tamaño de letra o los decimales, o deja más sitio a la derecha.')}</div>`;
      if (w.tipo === 'tiempo')
        h += `<label class="campo"><span>${t('Valor (segundos)')}</span>
            <input type="number" id="wEjemplo" step="1" min="0" value="${w.ejemplo ?? 60}"></label>
          <div class="regla" style="margin:-4px 0 8px">${t('Solo para verlo en el editor: en la placa lo pone la variable enlazada.')}</div>`;
      /* que numero se ensena: el de la variable, o cuanto cambia por segundo */
      if (w.tipo !== 'tiempo')
        h += `<label class="campo"><span>${t('Muestra')}</span><select id="wTasa">
            <option value=""${w.tasa ? '' : ' selected'}>${t('El valor de la variable')}</option>
            <option value="1"${w.tasa ? ' selected' : ''}>${t('Cuánto cambia por segundo (tasa)')}</option></select></label>
          ${w.tasa ? `<div class="regla" style="margin:-4px 0 8px">${t('Se calcula en la placa, suavizada: sube cuando la variable sube y vale 0 cuando se queda quieta.')}</div>` : ''}`;
      if (w.tipo !== 'tiempo') h += `<div class="fila">
          <label class="campo"><span>${t('Valor')}</span>
            <input type="number" id="wEjemplo" step="any" value="${w.ejemplo ?? 0}"></label>
          <label class="campo"><span>${t('Decimales')}</span><select id="wDecimales">${
            [0,1,2,3].map(d => `<option value="${d}"${(w.decimales??1)===d?' selected':''}>${d}</option>`).join('')}</select></label>
        </div>
        <div class="regla" style="margin:-4px 0 8px">${t('Solo para verlo en el editor: en la placa lo pone la variable enlazada.')}</div>`;
      if (w.tipo === 'lectura'){
        h += `<div class="fila">
            <label class="campo"><span>${t('Unidad')}</span><input type="text" id="wUnidad" value="${esc(w.unidad ?? '')}" placeholder="${esc((v0 && v0.unidad) || t('la de la variable'))}"></label>
            <label class="campo"><span>${t('Dónde va')}</span><select id="wUnidadPos">${
              [['', 'Detrás, arriba'], ['base', 'Detrás, en la línea'], ['debajo', 'Debajo'],
               ['encima', 'Encima'], ['oculta', 'Sin unidad']].map(([k, et]) =>
                `<option value="${k}"${(w.unidadPos || '') === k ? ' selected' : ''}>${esc(t(et))}</option>`).join('')}</select></label>
          </div>`;
        /* y desde ahi, donde se quiera: con el raton o con estos numeros */
        if (w.unidadPos !== 'oculta')
          h += `<div class="fila">
            <label class="campo"><span>${t('Unidad X (px)')}</span><input type="number" id="wUnidadDx" step="1" value="${w.unidadDx ?? ''}" placeholder="0"></label>
            <label class="campo"><span>${t('Unidad Y (px)')}</span><input type="number" id="wUnidadDy" step="1" value="${w.unidadDy ?? ''}" placeholder="0"></label>
          </div>
          ${letraDeParte(w, 'uni', 'titulo')}
          <div class="regla" style="margin:-4px 0 8px">${t('O arrástrala en el lienzo con el ratón: con el Número seleccionado, la unidad sale recuadrada.')}</div>`;
      }
      if (w.tipo === 'dato')
        h += `<label class="campo"><span>${t('Unidad')}</span><input type="text" id="wUnidad" value="${esc(w.unidad ?? '')}" placeholder="${esc((v0 && v0.unidad) || t('la de la variable'))}"></label>`;
    }
    /* barra, curva y reloj: la consigna, la referencia y el rango */
    if (['barra-consigna', 'curva', 'aguja'].includes(w.tipo)){
      const o = varsPara('lectura');
      const sel = (id, val, et, vacio) => `<label class="campo"><span>${t(et)}</span><select id="${id}">
        <option value="">${t(vacio)}</option>${o.map(v => `<option value="${v.nombre}"${val === v.nombre ? ' selected' : ''}>${esc(v.nombre)}</option>`).join('')}</select></label>`;
      if (w.tipo === 'barra-consigna' || w.tipo === 'aguja')
        h += `<label class="campo"><span>${t(w.tipo === 'aguja' ? 'Grosor del arco (px)' : 'Grosor de la barra (px)')}</span>
          <input type="number" id="wGrosor" min="2" max="120" step="1" value="${w.grosor ?? ''}"
            placeholder="${w.tipo === 'aguja' ? COMPONENTES.aguja.geo({ ...w, grosor: 0 }).LW : 12}"></label>`;
      if (w.tipo === 'curva')
        h += `<label class="interruptor" style="margin:2px 0 10px"><input type="checkbox" id="wEscalaFija"${w.escalaFija === true ? ' checked' : ''}>
          <span>${t('Escala fija (el rango de la variable)')}</span></label>
          <div class="regla" style="margin:-6px 0 10px">${t('Sin marcar, la escala se ajusta sola a números redondos según lo que entre.')}</div>`;
      if (w.tipo === 'barra-consigna')
        h += `<label class="interruptor" style="margin:2px 0 10px"><input type="checkbox" id="wEscala"${w.escala !== false ? ' checked' : ''}>
          <span>${t('Mostrar la escala (mínimo y máximo)')}</span></label>`;
      if (w.tipo === 'aguja')
        h += `<label class="campo"><span>${t('Apertura del arco')}</span><select id="wApertura">
          <option value="270"${Number(w.apertura) === 180 ? '' : ' selected'}>${t('270° · casi cerrado')}</option>
          <option value="180"${Number(w.apertura) === 180 ? ' selected' : ''}>${t('180° · velocímetro')}</option></select></label>`;
      /* la marca de consigna: si se dibuja, y de donde sale su valor */
      h += `<label class="interruptor" style="margin:4px 0 8px"><input type="checkbox" id="wMarca"${w.marca !== false ? ' checked' : ''}>
        <span>${t(w.tipo === 'curva' ? 'Mostrar la línea de consigna' : 'Mostrar la marca de consigna')}</span></label>`;
      if (w.marca !== false){
        if (o.length) h += sel('wConsigna', w.consigna, 'Su valor sale de', '— un valor fijo —');
        if (!w.consigna)
          h += `<label class="campo"><span>${t('Valor fijo de la consigna')}</span>
            <input type="number" id="wConsignaValor" step="any" value="${w.consignaValor ?? ''}" placeholder="${+spFijo({ ...w, consignaValor: undefined }).toFixed(2)}"></label>
            <div class="regla" style="margin:-4px 0 8px">${o.length
              ? t('O elige una variable arriba y la marca la seguirá en vivo.')
              : t('Cuando la lógica tenga un ajuste (setting), podrás enlazar la consigna a él y la marca lo seguirá en vivo.')}</div>`;
      }
      if (w.tipo === 'curva'){
        h += sel('wSerie2', w.serie2, 'Referencia (curva gris detrás)', '— ninguna —');
        h += `<label class="campo"><span>${t('Ventana de tiempo (s)')}</span><input type="number" id="wVentana" min="5" max="3600" step="5" value="${w.ventana || 60}"></label>`;
      } else {
        const r = rangoDe(w);
        h += `<div class="fila">
          <label class="campo"><span>${t('Desde')}</span><input type="number" id="wMin" step="any" value="${w.min ?? ''}" placeholder="${r.min}"></label>
          <label class="campo"><span>${t('Hasta')}</span><input type="number" id="wMax" step="any" value="${w.max ?? ''}" placeholder="${r.max}"></label></div>
          <div class="regla" style="margin-bottom:8px">${t('En blanco, el rango de la variable enlazada.')}</div>`;
        h += `<label class="campo"><span>${t('Unidad')}</span><input type="text" id="wUnidad" value="${esc(w.unidad ?? '')}" placeholder="${esc(unidadDe(w) || '')}"></label>`;
      }
    }
    if (w.tipo === 'pildora')
      h += `<label class="interruptor" style="margin:2px 0 10px"><input type="checkbox" id="wPlano"${w.plano === true ? ' checked' : ''}>
        <span>${t('Solo el texto, sin fondo')}</span></label>`;
    if (w.tipo === 'pildora')
      h += `<div class="nota info">${t('El texto y el color de cada estado se dicen en la Lógica, en <b>looks</b>, con el nombre de este elemento. Por ejemplo: <code>in RAISING: { text: SUBIENDO, color: amber }</code>. Si el enlace con el otro nodo se cae, dice SIN ENLACE en rojo.')}</div>`;
    /* Lo que muestran los que no muestran una variable: una linea por
       elemento. Es lo que se lee igual en el lienzo y en la placa. */
    if (CON_ELEMENTOS[w.tipo]){
      const d = CON_ELEMENTOS[w.tipo];
      h += `<label class="campo"><span>${t(d.et)}</span>
        <textarea id="wElementos" rows="4" style="width:100%;resize:vertical;font:12.5px var(--mono);
          background:var(--panel2);color:var(--texto);border:1px solid var(--borde);border-radius:6px;padding:6px 8px">${esc(w.elementos ?? d.def)}</textarea></label>`;
    }
    if (w.tipo === 'qrcode')
      h += `<label class="campo"><span>${t('Texto o enlace del QR')}</span>
        <input type="text" id="wTexto" value="${esc(w.texto || '')}" placeholder="https://"></label>
        <div class="regla" style="margin-bottom:10px">${t('El QR lo dibuja LVGL en la placa. Hay que encender <b>LV_USE_QRCODE</b> en lv_conf.h; si no, en su sitio sale un aviso que lo dice.')}</div>`;
    if (w.tipo === 'keyboard'){
      const campos = (pantalla().widgets || []).filter(x => x.tipo === 'textarea');
      h += `<label class="campo"><span>${t('Escribe en el campo')}</span><select id="wCampo">
        <option value="">${t('— el primero de la pantalla —')}</option>${campos.map(x =>
        `<option value="${esc(x.nombre)}"${w.campo === x.nombre ? ' selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select></label>
        <div class="regla" style="margin-bottom:10px">${campos.length
          ? t('El campo de texto tiene que estar <b>antes</b> que el teclado en la pantalla: los elementos nacen en orden.')
          : t('No hay ningún Campo de texto en esta pantalla todavía: añade uno y el teclado escribirá en él.')}</div>`;
    }
    if (w.tipo === 'image'){
      const kb = w.img ? Math.round(w.img.w * w.img.h * 4 / 1024) : 0;
      h += `<label class="campo"><span>${t('Fichero')}</span>
        <input type="file" id="wImagen" accept="image/*"></label>`;
      h += w.img
        ? `<div class="nota ${kb > 400 ? 'aviso' : 'ok'}">
             <b>${esc(w.img.nombre || 'imagen')}</b> · ${w.img.w}×${w.img.h} px · <b>${kb} KB</b> de flash
             ${kb > 400 ? '<br><br>Eso es mucho para un logo. Recórtalo o redúcelo antes de cargarlo: '
                        + 'el peso crece con el cuadrado del lado.' : ''}
           </div>`
        : `<div class="nota info">Elige un PNG o un JPG. Se convierte aquí mismo y viaja dentro
           del proyecto, así que el sketch sale completo y no hay que convertir nada aparte.<br><br>
           Ocupa <b>ancho × alto × 4</b> bytes de flash: un logo de 200×80 son 64 KB.</div>`;
    }
    if (w.tipo === 'button' || w.tipo === 'icono'){
      const k = w.icono || (w.tipo === 'icono' ? 'fa-bolt' : '');
      h += `<label class="campo"><span>${t('Icono')}</span></label>
        <button type="button" class="btn elegir-icono" id="wIcono">
          <b>${k ? iconoChar(k) : ''}</b><span>${k ? esc(t(iconoEt(k))) : t('Sin icono')}</span><small>${t('Cambiar')}</small></button>
        <div class="regla" style="margin:6px 0 10px">${t('Más de cien, por temas: eléctricos, físicos, químicos, de máquinas… En la placa entran en la fuente al exportar; crecen con el tamaño de letra y toman su color.')}</div>`;
    }
    if (['button','buttonmatrix'].includes(w.tipo)){
      h += `<label class="campo"><span>${t('Al pulsar, ir a')}</span><select id="wDestino">
        <option value="">— nada —</option>${E.pantallas.map(s =>
        `<option value="${s.nombre}"${w.destino===s.nombre?' selected':''}>${esc(s.nombre)}</option>`).join('')}</select></label>
        <label class="campo"><span>${t('O lanzar el evento')}</span><input type="text" id="wEvento" value="${esc(w.evento||'')}" placeholder="EV_ARRANCAR"></label>`;
      /* Un boton tambien puede DAR UNA ORDEN: encender un rele, disparar
         un "aceptar". Se enlaza a una variable de si/no, y manda un pulso
         — un 1 que vuelve a 0 solo. Un interruptor, en cambio, se queda. */
      if (w.tipo === 'button'){
        /* Dos clases de orden: una salida de si/no recibe un PULSO; una
           salida con valor (un PWM) sube o baja un paso. */
        const ords = variables().filter(v => v.dir === 'escritura');
        const bools = ords.filter(v => v.booleano), valores = ords.filter(v => !v.booleano);
        const opt = v => `<option value="${v.nombre}"${w.bind===v.nombre?' selected':''}>${esc(v.nombre)}${v.remota?' ⇄':''}${v.booleano ? '' : ` (${esc(v.min)}–${esc(v.max)}${v.unidad ? ' ' + esc(v.unidad) : ''})`}</option>`;
        h += `<label class="campo"><span>${t('O dar la orden')}</span><select id="wBind">
          <option value="">— ninguna —</option>${bools.length ? `<optgroup label="${esc(t('Encender y apagar (pulso)'))}">${bools.map(opt).join('')}</optgroup>` : ''}${valores.length ? `<optgroup label="${esc(t('Subir o bajar un valor'))}">${valores.map(opt).join('')}</optgroup>` : ''}
        </select></label>`;
        const elegida = ords.find(v => v.nombre === w.bind);
        /* Un botón que ya está en buttons: de la lógica hace lo que diga la
           lógica, en la placa y en el simulador: la orden se ignora. Avisarlo
           aquí, que es donde se elige la orden y parece que funcionará. */
        if (elegida && enLogica(w))
          h += `<div class="nota aviso">${t('Este botón ya tiene lógica (<b>buttons:</b> en la pestaña <b>Lógica</b>), y cuando la tiene, <b>manda la lógica</b>: esta orden no se usa. Pon la acción en la lógica, por ejemplo <b>set {salida} to …</b>, o quita el botón de <b>buttons:</b>.').replace('{salida}', esc(elegida.nombre))}</div>`;
        if (elegida && !elegida.booleano){
          const o = w.orden || {};
          h += `<div class="fila" style="margin-bottom:6px">
              <label class="campo"><span>${t('Qué hace')}</span><select id="wOrdenAccion">
                <option value="subir"${o.accion !== 'bajar' ? ' selected' : ''}>${t('Subir')} +</option>
                <option value="bajar"${o.accion === 'bajar' ? ' selected' : ''}>${t('Bajar')} −</option></select></label>
              <label class="campo"><span>${t('Paso')}</span><input type="number" id="wOrdenPaso" min="0" step="any" value="${o.paso ?? pasoPorDefecto(elegida)}"></label></div>
            <label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="wOrdenRepite" style="width:auto"${o.repite !== false ? ' checked' : ''}> ${t('Repetir mientras se mantiene pulsado')}</label>
            <div class="regla" style="margin:6px 0 10px">${t('Cada pulsación suma o resta el paso a')} <b>${esc(elegida.nombre)}</b>, ${t('sin salirse de')} ${esc(elegida.min)}–${esc(elegida.max)}. ${t('Pon un botón que suba y otro que baje.')}</div>`;
        }
        else h += ords.length
          ? `<div class="regla" style="margin-bottom:10px">Con una salida de sí/no manda un <b>pulso</b>: vale 1 el
             instante en que lo pulsas y vuelve a 0 solo (para algo que se queda encendido, usa un
             <b>Interruptor</b>). Con una salida con valor, como un PWM, <b>sube o baja</b> ese valor.</div>`
          : `<div class="nota info">No hay ninguna salida todavía. Añade un relé, un LED, una salida
             digital o un PWM en <b>Hardware</b> y aparecerá aquí.</div>`;
      }
    }
    h += `</details><details class="sec" data-sec="geo"${abierta('geo')}><summary>${t('Posición y tamaño')}</summary>
      <div class="fila" style="margin-bottom:6px"><input type="number" id="wX" value="${w.x}"><input type="number" id="wY" value="${w.y}"></div>
      <div class="fila"><input type="number" id="wW" value="${w.w}"><input type="number" id="wH" value="${w.h}"></div>
      <div class="regla" style="margin-top:6px">${t('x · y · ancho · alto, en píxeles de la pantalla real')}</div>`;

    /* El tamano de letra, aqui: es parte de "cuanto mide", no del color.
       En la pestana Estilo no se repite. */
    if (PROP_TEXTO[w.tipo] || PARTE_FUENTE[w.tipo]){
      const libre = tipoLibre(varianteFuente(w)), e0 = w.estilo || {};
      /* el automatico de un componente lo sabe el componente */
      const auto = PARTE_FUENTE[w.tipo] ? fuenteAutoComponente(w)
                                        : fuenteEfectiva({ ...w, estilo: { ...e0, fuente: 0 } });
      h += libre
        ? `<label class="campo" style="margin-top:10px"><span>${t('Tamaño de letra')} (px)</span>
            <input type="number" id="wFuenteLibre" min="8" max="360" step="1" value="${e0.fuente || auto}"></label>
           <div class="regla">${t('Esta tipografía se convierte al tamaño exacto que pidas.')}</div>`
        : `<label class="campo" style="margin-top:10px"><span>${t('Tamaño de letra')}</span>
            <select id="wFuente"><option value="">${COMPONENTES[w.tipo] || !w.auto
              ? t('Según el alto de la caja') + ` (${auto} px)` : t('Heredado del tema') + ` (${E.tema.fuente} px)`}</option>${
              TODAS_FUENTES.map(f => `<option value="${f}"${e0.fuente===f?' selected':''}>Montserrat ${f} px${f>48?' · fuente propia':''}</option>`).join('')}</select></label>
           <div class="regla">${t('Montserrat llega hasta 48 px compilada; de ahí en adelante se genera al exportar, y de 280 px en adelante hay que poner a 1 LV_FONT_FMT_TXT_LARGE en lv_conf.h.')}</div>`;
    }
    if (AUTOAJUSTABLES.has(w.tipo)){
      h += `<label class="interruptor" style="margin-top:10px">
        <input type="checkbox" id="wAuto"${w.auto?' checked':''}>
        <span>${t('Ceñir la caja al texto')}</span></label>
        <div class="regla" style="margin-top:4px">${w.auto
          ? 'Arrastra los tiradores y cambiarás el <b>tamaño de letra</b>; la caja va detrás. En la placa es <b>LV_SIZE_CONTENT</b>.'
          : 'Caja a mano. La letra se deduce de su altura.'}</div>`;
    } else if (HOLGURA[w.tipo]){
      h += `<button class="btn" id="ajustarTexto" style="width:100%;margin-top:10px">Ajustar al texto</button>`;
    }
    h += `</details>`;

    /* El aspecto (colores, clase, letra) vive en UN sitio: la pestana
       Estilo, o el boton derecho sobre el elemento. Antes habia aqui una
       copia con otra lista de campos, y no coincidian. */
    const propios = camposEstilo(w).filter(c => (w.estilo || {})[c.k]);
    h += `<details class="sec" data-sec="aspecto"${abierta('aspecto')}><summary>${t('Aspecto')}</summary>
      <div class="regla" style="margin-bottom:8px">${propios.length
        ? t('Colores propios:') + ' ' + propios.map(c => `<span class="chip-color" style="background:${w.estilo[c.k]}"></span>${esc(t(c.et))}`).join(', ') + '. ' + t('El resto, del tema.')
        : t('Todo del tema.')} ${t('Colores, clase y letra se cambian en la pestaña Estilo, o con el botón derecho sobre el elemento.')}</div>
      <button class="btn" id="irEstilo" style="width:100%">${t('Cambiar su aspecto')}</button></details>`;
    h += seccion('proyecto-sel', t('Proyecto'), bloqueProyecto);
  }

  const cab = w ? cabecera(icoWidget(w.tipo), esc(w.nombre), esc(nom(WIDGETS[w.tipo]) || w.tipo))
                : cabecera(icoWidget('_proyecto'), esc(E.proyecto), esc(t('Proyecto') + ' · ' + t('nada seleccionado')));
  return { izq, der: cab + `<div class="insp-cuerpo">${h}</div>` };
}

/* ---------- Hardware ---------- */
/* Que acordeon esta abierto. Vive FUERA de E a proposito: es estado de
   la interfaz, no del proyecto, y no tiene por que viajar en el .json ni
   ensuciar el deshacer. */
let accAbierto = null;

/* Que se mira en Hardware: un nodo, o el enlace entre los dos. Es estado
   de la interfaz (como accAbierto): no va en E ni en el .json. */
const HW = { vista: 'nodo' };
const ICO_NODO = {
  p: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  c: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg>',
  enlace: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h15l-3.5-3.5M20 15H5l3.5 3.5"/></svg>'
};
/* p: el nodo de la pantalla (el primero); c: el de control */
const letraNodo = i => i === 0 ? 'p' : 'c';

/* El mapa de nodos, arriba y fijo: con un vistazo se sabe donde se esta.
   Cada nodo es un boton; el ⇄ del medio lleva al enlace. */
function mapaNodos(A){
  const tarjeta = (x, i) => {
    const Px = placaDe(x), Ax = i === E.iNodo ? A : asignarPines(x);
    const mal = Ax.filas.filter(f => f.aviso?.tipo === 'error').length, sinPines = Ax.filas.some(f => f.aviso?.sinPines);
    const act = HW.vista === 'nodo' && i === E.iNodo;
    return `<button type="button" class="nodo-card nodo-${letraNodo(i)}${act ? ' activo' : ''}" data-nodo="${i}" aria-pressed="${act}" title="${esc(Px.nombre)}">
      <span class="nc-cab"><span class="nc-ico">${ICO_NODO[letraNodo(i)]}</span><b>${esc(nomNodo(x))}</b></span>
      <small>${esc(Px.corto)}</small>
      <small class="nc-pines${mal ? ' mal' : ''}">${sinPines ? '⚠ ' + t('sin pines') : mal ? `⚠ ${mal} ${mal === 1 ? t('aviso') : t('avisos')}`
        : `${Ax.libresTras} ${Ax.libresTras === 1 ? t('pin libre') : t('pines libres')}`}</small>
    </button>`;
  };
  const act = HW.vista === 'enlace' ? 'enlace' : letraNodo(E.iNodo);
  const estado = HW.vista === 'enlace'
    ? t('Estás configurando el enlace entre los nodos')
    : `${t('Estás configurando el nodo')} <b>${esc(nomNodo(nodo()))}</b>`;
  if (E.nodos.length === 1)
    return `<div class="mapa-nodos mapa-${act}"><div class="mapa-fila uno">${tarjeta(E.nodos[0], 0)}
      <button type="button" class="nodo-card nuevo" data-addnodo
        title="${esc(t('Un solo nodo: la pantalla lo hace todo. Si te quedas sin pines —en la 4.3B pasa enseguida— puedes añadir una segunda placa que haga el trabajo y le mande los datos.'))}">
        <span class="nc-cab"><span class="nc-ico">${ICO_NODO.c}</span><b>+ ${t('Nodo de control')}</b></span>
        <small>${t('si te quedas sin pines')}</small></button></div>
      <div class="mapa-estado">${estado}</div></div>`;
  const L = E.enlace ? ENLACES[E.enlace.tipo] : null;
  return `<div class="mapa-nodos mapa-${act}"><div class="mapa-fila">${tarjeta(E.nodos[0], 0)}
    <button type="button" class="nodo-enlace${HW.vista === 'enlace' ? ' activo' : ''}" data-hwvista="enlace" aria-pressed="${HW.vista === 'enlace'}"
      title="${esc(t('El enlace entre los nodos'))}"><span class="ne-ico">${ICO_NODO.enlace}</span><small>${L ? esc(L.nombre) : '—'}</small></button>
    ${E.nodos.slice(1).map((x, j) => tarjeta(x, j + 1)).join('')}</div>
    <div class="mapa-estado">${estado}</div></div>`;
}

/* El enlace: es de los dos nodos, asi que tiene su propia vista. Arriba,
   que pines usa en cada punta, que es lo que hay que cablear. */
function panelEnlace(){
  const L = E.enlace ? ENLACES[E.enlace.tipo] : null;
  const pinesEn = x => asignarPines(x).filas.find(f => f.infra)?.pin || '—';
  let c = `<div class="enl-lados">${E.nodos.map((x, i) => `<div class="enl-lado nodo-${letraNodo(i)}">
      <span class="nc-cab"><span class="nc-ico">${ICO_NODO[letraNodo(i)]}</span><b>${esc(nomNodo(x))}</b></span>
      <small>${esc(placaDe(x).corto)}</small><code>${esc(pinesEn(x))}</code></div>`).join(`<span class="enl-flecha">${ICO_NODO.enlace}</span>`)}</div>`;
  c += `<label class="campo"><span>${t('Tipo de enlace')}</span><select id="fEnlace">${
    Object.entries(ENLACES).map(([k,v]) =>
    `<option value="${k}"${E.enlace?.tipo===k?' selected':''}>${v.icono} ${esc(nom(v))}${
      v.generado ? '' : ' · ' + t('todavía no genera código')}</option>`).join('')}</select></label>`;
  if (L && !L.generado)
    c += `<div class="nota error"><b>${esc(L.nombre)} todavía no está implementado.</b><br><br>
      Puedes elegirlo para ver cómo queda el reparto de pines, pero <b>Exportar</b> se va a negar:
      el transporte no se parece en nada a un puerto serie y escribir código de UART llamándolo
      ${esc(L.nombre)} sería peor que no escribir nada. De momento, RS485 o UART.</div>`;
  let vars = '';
  if (L){
    if (L.baudios != null)
      c += `<label class="campo"><span>${t('Velocidad')}</span><input type="number" id="fBaud" value="${E.enlace.baudios ?? L.baudios}"></label>`;
    /* Por radio, todos los ESP-NOW cercanos lo oyen todo: la clave separa
       los equipos (ver claveEnlace en generador.js) */
    if (E.enlace.tipo === 'espnow')
      c += `<label class="campo"><span>${t('Clave del enlace')}</span><input type="text" id="fClave" maxlength="8"
          value="${esc(E.enlace.clave || '')}" placeholder="${esc(claveEnlace())}" spellcheck="false"></label>
        <div class="regla" style="margin:-4px 0 10px">${t('Todos los ESP-NOW cercanos oyen lo que se manda. Los dos nodos ponen esta clave en cada paquete y tiran lo que no la lleve: así dos equipos en la misma sala no se obedecen el uno al otro. Si hay otro equipo cerca con el mismo proyecto, cámbiala y vuelve a exportar los dos nodos.')}</div>`;
    c += `<div class="nota info">${esc(t(L.ayuda))}<br><br><b>${t('Cuándo usarlo:')}</b> ${esc(t(L.cuando))}</div>`;
    if (L.transceptor) c += `<div class="nota aviso">${t('Hace falta un transceptor en cada punta:')} ${esc(L.transceptor)}.</div>`;
    /* Sale sola, sin que nadie pregunte: la lista tiene un hueco donde
       todo el mundo espera ver I2C, y el motivo no es evidente. */
    c += `<div class="regla" style="margin:10px 0 4px">${t('enlace:i2c').replace('{placa}', esc(placaDe(nodoHMI()).corto))}</div>`;
    const remotas = variables().filter(v => v.remota);
    vars = remotas.length
      ? `<div class="chips-vars">${remotas.map(v => `<code>${esc(v.nombre)}</code>`).join('')}</div>
         <div class="regla">${t('enlace:protocolo')}</div>`
      : `<div class="nota info">${t('enlace:vacio')}</div>`;
    vars = seccion('hw-vars', t('Viajan por el enlace'), vars, remotas.length);
  }
  return `<div class="hw-vista mapa-enlace">${seccion('hw-enlace', t('Enlace entre nodos'), c)}${vars}</div>`;
}

/* Con el hardware de un nodo sin pantalla (o del enlace) delante, el
   lienzo se apaga y una franja lo dice: antes se veia la pantalla y
   parecia que se estaba configurando esa. */
function marcarEscenaNodo(){
  const esc_ = document.querySelector('.escena');
  if (!esc_) return;
  const sin = E.pestana === 'hard' && E.nodos.length > 1 && (HW.vista === 'enlace' || E.iNodo > 0);
  esc_.classList.toggle('nodo-sin-pantalla', sin);
  let b = document.getElementById('avisoNodo');
  if (!b){ b = document.createElement('div'); b.id = 'avisoNodo'; b.className = 'aviso-nodo'; esc_.prepend(b); }
  b.hidden = !sin;
  b.classList.toggle('de-enlace', HW.vista === 'enlace');
  if (sin) b.innerHTML = HW.vista === 'enlace'
    ? `<span class="nc-ico">${ICO_NODO.enlace}</span><span>${t('Estás en el enlace entre los nodos. La pantalla de abajo es solo de referencia.')}</span>`
    : `<span class="nc-ico">${ICO_NODO.c}</span><span>${t('Estás en el nodo')} <b>${esc(nomNodo(nodo()))}</b>. ${t('Este nodo no tiene pantalla: la de abajo es la del nodo Pantalla, solo de referencia.')}</span>`;
}

function panelHardware(){
  const multi = E.nodos.length > 1;
  if (!multi) HW.vista = 'nodo';
  if (E.iNodo >= E.nodos.length) E.iNodo = 0;
  const n = nodo(), P = placaDe(n), A = asignarPines(n);
  let h = mapaNodos(A);

  /* Si se esta describiendo una placa a medida, el panel es el formulario
     y nada mas: es una tarea entera, no un campo suelto. */
  if (E.placaEdit) return h + formularioPlaca();
  if (HW.vista === 'enlace') return h + panelEnlace();

  /* Todo lo de abajo es de este nodo: cada titulo lleva su nombre, en su color */
  const deNodo = txt => `${txt}<span class="sec-nodo">${esc(nomNodo(n))}</span>`;
  h += `<div class="hw-vista mapa-${letraNodo(E.iNodo)}">`;

  let hp = `
    ${multi && E.iNodo > 0 ? `<label class="campo"><span>${t('Placa')}</span><select id="fPlacaNodo">${
      Object.entries(placasTodas()).map(([k,v]) =>
      `<option value="${k}"${k===n.placa?' selected':''}>${esc(v.corto)}${v.propia ? ' · ' + t('tuya') : ''}</option>`).join('')}</select></label>
      ${E.iNodo > 0 ? `<div class="fila" style="margin-bottom:10px">
        <button class="btn" id="nuevaPlaca" style="flex:1">${t('+ Placa a medida')}</button>
        ${P.propia ? `<button class="btn" id="editarPlaca" style="flex:1">${t('Editar esta ficha')}</button>` : ''}
      </div>` : ''}` : ''}
    ${P.familia === 'avr' && E.nodos.length > 1 && E.iNodo > 0 ? `
      <label class="campo"><span>${t('Cómo se enlaza con la pantalla')}</span><select id="fEnlaceAvr">
        <option value="soft"${n.enlace_usb ? '' : ' selected'}>${t('Dos pines libres (SoftwareSerial)')}</option>
        <option value="usb"${n.enlace_usb ? ' selected' : ''}>${t('El puerto del USB (D0/D1)')}</option>
      </select></label>
      <div class="regla" style="margin-bottom:10px">${n.enlace_usb
        ? t('El puerto de verdad: más rápido y fiable. Mientras esté cableado no hay monitor serie, y para programar la placa hay que desconectarlo.')
        : t('El USB queda libre para el monitor. El puerto lo hace el micro por software: hasta 38400 baudios va bien, más arriba pierde caracteres.')}</div>` : ''}
    ${E.nodos.length > 1 && E.iNodo > 0 && P.familia !== 'linux' ? `
      <label class="interruptor" style="margin:4px 0 6px"><input type="checkbox" id="fSimular"${n.simular === false ? '' : ' checked'}>
        <span>${t('Simular las medidas')}</span></label>
      <div class="regla" style="margin-bottom:10px">${n.simular === false
        ? t('El nodo lee sus sensores de verdad.')
        : t('El nodo inventa sus medidas: sirve para probar el enlace sin nada cableado. Quítalo cuando tengas el hardware conectado; se guarda en el proyecto, así que cada exportación lo respeta.')}</div>` : ''}
    ${(() => {
      /* La ficha: nombre, el modulo, sus datos en chips y si esta verificada.
         Lo demas (de donde salen los datos, como se ve el panel) en Detalles. */
      const mcu = String(t(P.mcu) || '').split(' · '), ver = P.procedencia === 'verificado';
      return `<div class="placa-ficha">
        <div class="pf-cab"><span class="pf-ico">${icoWidget('_proyecto')}</span>
          <div><b>${esc(P.nombre)}</b><small title="${esc(mcu[0])}">${esc(mcu[0])}</small></div>
          ${E.iNodo === 0 ? `<button class="pf-cambiar" id="irPlacaPantalla" title="${esc(t('La placa de la pantalla se elige en Diseño › Proyecto'))}">${t('Cambiar placa')}</button>` : ''}</div>
        <div class="pf-chips">${mcu.slice(1).map(x => `<span>${esc(x)}</span>`).join('')}
          <span class="${ver ? 'v-ok' : 'v-aviso'}">${ver ? '✓ ' + t('Verificada en placa') : '⚠ ' + t('Sin verificar')}</span></div>
        <details class="pf-mas"><summary>${t('Detalles')}</summary>
          <p>${ver ? t('Datos verificados en placa.') : t('Datos de la comunidad, sin verificar en banco.')} ${esc(t(P.nota_procedencia))}</p>
          ${P.nota_panel ? `<p><b>${t('Cómo se ve de verdad:')}</b> ${esc(t(P.nota_panel))}</p>` : ''}
        </details></div>`;
    })()}`;
  h += seccion('hw-placa', deNodo(t('Placa')), hp);

  /* =================================================================
   * TODO LO DE UNA PIEZA, JUNTO
   *
   * Antes esto eran cuatro bloques: la tarjeta en "Dispositivos" o
   * "Conexiones", los ajustes en "Parametros", y el pin con su regla en
   * una tabla al final. Para saber que pin era el del ADC habia que
   * correlacionar tres sitios, y con cuatro o cinco piezas es facil
   * tocar el pin equivocado.
   *
   * Ahora cada pieza es un acordeon: se abre y dentro esta TODO lo suyo
   * —el pin, por que ese pin, como cambiarlo, sus ajustes y sus
   * trampas—. Cerrado ocupa una linea y ya dice lo importante: como se
   * llama, que es y en que pin acaba.
   * ================================================================= */

  /* La fila del asignador que le corresponde a una pieza */
  const filaDe = clave => A.filas.find(x => x.clave === clave);

  const cuerpoPieza = (pieza, cat, f) => {
    let c = '';

    /* el nombre: es el de la variable en el codigo generado */
    c += `<label class="campo"><span>${t('Nombre en el código')}</span>
      <input class="nom-pieza" data-renombrar="${pieza._lista}|${pieza._i}" value="${esc(pieza.clave)}"></label>`;

    /* por que ese pin, y como cambiarlo */
    if (f){
      c += `<div class="acc-sec">${t('Pin')}</div>`;
      c += `<div class="regla">${esc(f.necesidad)}${f.coste === 0 ? ' · <b style="color:var(--ok)">' + t('no gasta ningún pin') + '</b>' : ''}</div>`;
      c += `<div class="regla" style="margin-top:4px">${esc(f.regla)}</div>`;
      if (f.aviso) c += `<div class="nota ${f.aviso.tipo}" style="margin:8px 0 0">${esc(f.aviso.txt)}</div>`;
      if (!f.infra && f.pieza && /GPIO/.test(f.pin || '') && f.pin.split('·').length === 1)
        c += `<label class="campo" style="margin-top:8px"><span>${t('Cambiar el pin')}</span>
          <select data-forzar="${pieza.clave}">
            <option value="">${t('Asignación automática')}</option>${pinesElegibles(P).map(x =>
            `<option value="${x}"${pieza.pinForzado === x ? ' selected' : ''}>GPIO${x}${
              f.nec?.adc ? etiquetaAdc(P, x) : ''
            }${P.pines[x] ? ' — ' + t('ocupado') + ': ' + esc(t(P.pines[x])) : ''}</option>`).join('')}
          </select></label>`;
    }

    /* sus ajustes */
    if (cat.campos){
      c += `<div class="acc-sec">${t('Ajustes')}</div>`;
      for (const [k, campo] of Object.entries(cat.campos)){
        const v = pieza.params?.[k] ?? campo.val;
        c += `<label class="campo"><span>${esc(t(campo.et))}</span>${
          campo.ops ? `<select data-par="${pieza.clave}|${k}">${campo.ops.map(o =>
            `<option value="${esc(o)}"${String(o) === String(v) ? ' selected' : ''}>${esc(t(String(o)))}</option>`).join('')}</select>`
          : `<input type="${typeof campo.val === 'number' ? 'number' : 'text'}" data-par="${pieza.clave}|${k}" value="${esc(v)}">`
        }</label>${campo.ayuda ? `<div class="regla ayuda-campo">${esc(t(campo.ayuda))}</div>` : ''}`;
      }
    }

    /* lo que muerde */
    if (cat.trampas?.length){
      c += `<div class="acc-sec">${t('Ojo')}</div>`;
      c += cat.trampas.map(x => `<div class="regla" style="margin-bottom:5px">· ${esc(t(x))}</div>`).join('');
    }

    c += `<button class="btn quitar-pieza" data-delconex="${pieza._i}">${t('Quitar')} ${esc(pieza.clave)}</button>`;
    return c;
  };

  const acordeon = (id, ico, nombre, tipo, f, cuerpo) => {
    const abierto = accAbierto === id;
    const pin = f && f.pin ? f.pin : null;
    const mal = f?.aviso ? (f.aviso.tipo === 'error' ? ' malo' : ' dudoso') : '';
    return `<div class="acc${abierto ? ' abierto' : ''}">
      <button class="acc-cab" data-acc="${esc(id)}">
        <span class="acc-flecha">${abierto ? '▾' : '▸'}</span>
        <span class="acc-ico">${ico}</span>
        <span class="acc-txt"><b>${esc(nombre)}</b><span class="acc-tipo">${esc(tipo)}</span></span>
        ${pin ? `<span class="pin${mal}">${esc(pin)}</span>` : ''}
        ${f?.forzado ? `<span class="fijado">${t('fijado')}</span>` : ''}
      </button>
      ${abierto ? `<div class="acc-cuerpo">${cuerpo}</div>` : ''}
    </div>`;
  };

  let hc = '';
  const hIni = h; h = '';

  /* el enlace entre nodos va primero: es infraestructura, no se quita */
  const fEnl = A.filas.find(x => x.infra);
  if (fEnl){
    const LE = ENLACES[E.enlace.tipo];
    h += acordeon('__enlace', LE.icono, t('enlace con el otro nodo'), LE.nombre, fEnl,
      `<div class="regla">${esc(fEnl.regla)}</div>
       ${fEnl.aviso ? `<div class="nota ${fEnl.aviso.tipo}" style="margin-top:8px">${esc(fEnl.aviso.txt)}</div>` : ''}
       <button type="button" class="enlace-mini" data-hwvista="enlace">${t('Configurar el enlace')} ›</button>`);
  }

  const piezas = [
    ...n.conexiones.map((c, i) => ({ ...c, _lista: 'conexiones', _i: i, _cat: CONEXIONES[c.tipo] })),
  ];

  h += piezas.map(pz => acordeon(pz._lista + '|' + pz._i, pz._cat.icono, pz.clave,
                                 nom(pz._cat), filaDe(pz.clave),
                                 cuerpoPieza(pz, pz._cat, filaDe(pz.clave)))).join('');

  if (!piezas.length) h += `<div class="vacio">${t('Nada todavía. Añade algo abajo.')}</div>`;

  /* los dos desplegables de anadir, al final: primero se ve lo que hay */
  const gruposC = {};
  for (const [k, v] of Object.entries(CONEXIONES)) (gruposC[v.grupo] = gruposC[v.grupo] || []).push([k, v]);

  h += `<div class="anadir">
    <select id="addConex"><option value="">${t('+ conectar algo…')}</option>${
      Object.entries(gruposC).map(([g, l]) => `<optgroup label="${esc(t(g))}">${l.map(([k, v]) =>
      `<option value="${k}">${v.icono} ${esc(nom(v))}</option>`).join('')}</optgroup>`).join('')}</select>
    <div class="regla">${t('conectar:regla')}</div>
  </div>`;

  /* el resumen de pines, que es del nodo entero y no de ninguna pieza */
  /* Dos cosas distintas: que se acaben los pines (salidas de la placa) y
     que un pin elegido tenga un problema (se dice cual y por que) */
  const pinesMal = A.filas.filter(f => f.aviso?.tipo === 'error' && !f.aviso.sinPines);
  if (pinesMal.length)
    h += `<div class="nota error" style="margin-top:12px"><b>${pinesMal.length === 1 ? t('Revisa este pin:') : t('Revisa estos pines:')}</b><br>${
      pinesMal.map(f => `<b>${esc(f.clave)}</b>${f.pin ? ` (${esc(f.pin)})` : ''} — ${esc(f.aviso.txt)}`).join('<br>')}</div>`;
  h += A.filas.some(f => f.aviso?.sinPines)
    ? `<div class="nota error" style="margin-top:12px"><b>Sin pines suficientes.</b> Esta placa tiene salidas:</div>
       <ol style="font-size:12px;color:var(--tenue);padding-left:18px;line-height:1.6">${
       P.rutas_escape.map(r => `<li>${esc(r)}</li>`).join('')}</ol>
       ${E.nodos.length === 1 ? `<button class="btn primario" data-addnodo style="width:100%;margin-top:10px">${t('Añadir un segundo nodo')}</button>` : ''}`
    : `<div class="dato-linea ok"><span>${t('Pines libres')}</span><b>${A.libresTras}</b></div>`;
  hc = h; h = hIni;
  h += seccion('hw-conectado', deNodo(t('Conectado')), hc, piezas.length || undefined);


  /* --- trampas y ajustes --- */
  /* Una trampa en una linea: la etiqueta y la primera frase. El resto, que
     explica el porque, se abre con un clic. Sin resto, no hay nada que abrir. */
  const trampa = (et, x) => {
    const txt = String(t(x)), m = txt.match(/^(.{12,160}?[.:;])\s+(.+)$/s);
    const et2 = et ? `<b>${esc(et)}</b>` : '';
    return m ? `<details class="trampa"><summary>${et2}<span>${esc(m[1])}</span></summary><div>${esc(m[2])}</div></details>`
             : `<div class="trampa-sola">${et2} ${esc(txt)}</div>`;
  };
  /* lo que muerde al cablear: lo de lo conectado y lo de la placa, juntos */
  const tr = [...new Set(A.filas.flatMap(f => f.cat?.trampas || []))];
  const trPlaca = Object.entries(P.trampas||{});
  h += seccion('hw-cuidado', deNodo(t('Antes de cablear')),
    (tr.length ? `<div class="acc-sec">${t('Por lo que has conectado')}</div><div class="trampas">${tr.map(x => trampa('', x)).join('')}</div>` : '')
    + `<div class="acc-sec">${t('Trampas de esta placa')}</div>${trPlaca.length
      ? `<div class="trampas">${trPlaca.map(([k,x]) => trampa('GPIO' + k, x)).join('')}</div>`
      : '<div class="vacio">Ninguna registrada.</div>'}`,
    tr.length + trPlaca.length || undefined);

  h += seccion('hw-ide', deNodo(t('Herramientas del IDE')), `
    <div class="regla">${t('El IDE reinicia estas opciones por sketch. Compruébalas antes de cada flasheo:')}</div>
    <div class="kv">${Object.entries(P.opciones_ide).map(([k,v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join('')}</div>
    ${P.nota_ide ? `<div class="regla">${esc(t(P.nota_ide))}</div>` : ''}`);

  /* quitar el nodo: al final, lejos de lo que se toca a menudo */
  if (multi && E.iNodo > 0)
    h += `<button class="btn quitar-nodo" id="delNodo">${t('Quitar el nodo')} ${esc(nomNodo(n))}</button>`;
  h += `</div>`;
  return h;
}

const pinesElegibles = P => [...new Set([...P.libres, ...Object.keys(P.recuperables||{}).map(Number),
  ...P.adc1, ...Object.keys(P.pines).map(Number)])].sort((a,b)=>a-b);

/* Como se etiqueta un pin en el desplegable cuando lo que se pide es una
   entrada analogica.
 *
 * No se esconde ninguno. Esconder un pin es decidir por el que programa,
 * y el catalogo de la placa puede estar incompleto: si a un perfil le
 * falta un canal, filtrando desaparece sin dejar rastro y no hay forma
 * de saber que existia. Etiquetado, el que sabe lo que hace lo elige
 * igual, y el que no sabe lee por que no deberia. */
const etiquetaAdc = (P, x) =>
    P.adc1.includes(x)            ? ' — ADC1'
  : (P.adc2 || []).includes(x)    ? ' — ' + t('ADC2, sólo con la radio apagada')
  :                                 ' — ' + t('sin convertidor');

/* ---------- Manifiesto ---------- */
function panelManifiesto(){
  const col = esc(manifiesto())
    .replace(/^(\s*)(#.*)$/gm, '$1<span class="c">$2</span>')
    .replace(/^(\s*)([a-z_][\w-]*)(:)/gm, '$1<span class="k">$2</span>$3')
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="n">$1</span>');
  return `<div class="bloque"><h3>${t('telar.yaml')}</h3>
    <div class="nota info">${t('manif:intro')}</div>
    <pre>${col}</pre>
    <button class="btn" id="copiarManif" style="width:100%;margin-top:10px">${t('Copiar al portapapeles')}</button></div>`;
}

/* =====================================================================
 * EVENTOS
 * ===================================================================== */
function conectarPanel(){
  if (E.pestana === 'logica'){ conectarLogica(); return; }
  const $ = s => document.getElementById(s);
  const on = (id,ev,fn) => { const n = $(id); if (n) n.addEventListener(ev, fn); };
  const w = widgetSel();

  on('fProyecto','input', e => { E.proyecto = e.target.value.trim() || 'mi-proyecto'; pintarCabecera(); });
  on('fPlaca','change',     e => cambiarPlaca(nodoHMI(), e.target.value));

  /* --- pantalla a medida --- */
  on('nuevaPantalla',  'click', () => { E.pantallaEdit = plantillaPantalla(); pintar(); });
  on('editarPantalla', 'click', () => {
    const id = nodoHMI().pantalla_externa?.controlador;
    E.pantallaEdit = JSON.parse(JSON.stringify((E.pantallas_propias || {})[id] || plantillaPantalla()));
    pintar();
  });
  on('pnCancelar', 'click', () => { E.pantallaEdit = null; pintar(); });
  on('pnGuardar',  'click', () => guardarPantallaPropia());
  document.querySelectorAll('[data-pn]').forEach(el =>
    el.addEventListener('change', ev => ponEnFormPantalla(ev.target.dataset.pn, ev.target.value)));

  /* Los campos de la pantalla enchufada: todos con la misma ruta dentro
     de la ficha, asi que un solo manejador para todos. */
  document.querySelectorAll('[data-pan]').forEach(el => {
    el.addEventListener('change', ev => {
      HIST.iniciar();
      const v = ev.target.type === 'number' ? parseInt(ev.target.value, 10) : ev.target.value;
      ponEnPantalla(ev.target.dataset.pan, ev.target.type === 'number' ? (isNaN(v) ? -1 : v)
                    : (['rotacion', 'uart.baudios'].includes(ev.target.dataset.pan) ? parseInt(v, 10) : v));
    });
  });
  on('fRefresco','change',  e => { HIST.iniciar(); E.refresco_ms = parseInt(e.target.value) || 100; });
  on('fPlacaNodo','change', e => cambiarPlaca(nodo(), e.target.value));
  /* a la lista de Diseño › Proyecto, con la seccion abierta y la lista a la vista */
  on('irPlacaPantalla','click', () => {
    SEC_CERRADAS.delete('proyecto'); SEC_CERRADAS.delete('proyecto-sel');
    document.querySelector('.pestanas button[data-t="diseno"]').click();
    const sel = document.getElementById('fPlaca');
    if (!sel) return;
    sel.scrollIntoView({ block: 'center', behavior: 'smooth' });
    sel.focus({ preventScroll: true });
    sel.classList.remove('resalta'); void sel.offsetWidth; sel.classList.add('resalta');
  });
  on('fEnlaceAvr','change', e => { HIST.iniciar(); nodo().enlace_usb = e.target.value === 'usb'; pintar(); });
  on('fSimular','change', e => { HIST.iniciar(); if (e.target.checked) delete nodo().simular; else nodo().simular = false; pintar(); });

  /* --- componentes: unidad y formato --- */
  on('wUnidad',  'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    const v = e.target.value.trim(); if (v) w2.unidad = v; else delete w2.unidad; pintar(); });
  on('wFormato', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    if (e.target.value) w2.formato = e.target.value; else delete w2.formato; pintar(); });
  /* un campo de texto o numero del componente: en blanco, se borra */
  const campoComp = (id, k, num) => on(id, 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    const v = e.target.value.trim(); if (v === '') delete w2[k]; else w2[k] = num ? Number(v) : v; pintar(); });
  campoComp('wConsigna', 'consigna'); campoComp('wSerie2', 'serie2'); campoComp('wConsignaValor', 'consignaValor', true);
  campoComp('wUnidadPos', 'unidadPos'); campoComp('wRotuloDx', 'rotuloDx', true); campoComp('wRotuloDy', 'rotuloDy', true);
  /* la letra y el tamano de una parte: van en el estilo (tipo_rot, fuente_uni...) */
  document.querySelectorAll('[data-letraparte]').forEach(i => i.addEventListener('change', () => {
    const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    const k = i.dataset.letraparte, v = i.value.trim();
    w2.estilo = w2.estilo || {};
    if (v === '') delete w2.estilo[k]; else w2.estilo[k] = k.startsWith('fuente_') ? Math.max(8, Math.min(360, +v)) : v;
    if (!Object.keys(w2.estilo).length) delete w2.estilo;
    if (w2.auto) normalizarAuto();
    pintar();
  }));
  on('wTasa', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    if (e.target.value) w2.tasa = true; else delete w2.tasa; if (w2.auto) normalizarAuto(); pintar(); }); campoComp('wUnidadDx', 'unidadDx', true); campoComp('wUnidadDy', 'unidadDy', true); campoComp('wGrosor', 'grosor', true);
  on('wRadio', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    const v = e.target.value.trim();
    w2.estilo = w2.estilo || {};
    if (v === '') delete w2.estilo.radio; else w2.estilo.radio = Math.max(0, +v);
    if (!Object.keys(w2.estilo).length) delete w2.estilo;
    pintar(); });
  campoComp('wVentana', 'ventana', true); campoComp('wMin', 'min', true); campoComp('wMax', 'max', true);

  /* --- placa a medida --- */
  on('nuevaPlaca','click',  () => { E.placaEdit = plantillaPlaca(); pintar(); });
  on('editarPlaca','click', () => { E.placaEdit = JSON.parse(JSON.stringify(placaDe(nodo()))); pintar(); });
  on('pfCancelar','click',  () => { E.placaEdit = null; pintar(); });
  on('pfGuardar','click',   () => guardarPlacaPropia());
  /* la familia cambia qué campos tienen sentido: se repinta al vuelo */
  on('pfFamilia','change', e => {
    const f = E.placaEdit;
    f.familia = e.target.value;
    if (f.familia === 'avr'){ f.bits_adc = 10; f.bits_pwm = 8; }
    else if (f.familia === 'esp32'){ f.bits_adc = 12; f.bits_pwm = 13; }
    pintar();
  });

  on('quitarTildes','click', () => {
    HIST.iniciar();
    for (const sc of E.pantallas) for (const wd of sc.widgets)
      if (wd.texto) wd.texto = quitarTildes(wd.texto);
    E.estados = E.estados.map(quitarTildes);
    pintar();
  });

  document.querySelectorAll('[data-add]').forEach(b => {
    b.addEventListener('click', () => anadirWidget(b.dataset.add));
    /* arrastrar al lienzo: se apunta que tipo va, para dibujar su hueco */
    b.addEventListener('dragstart', e => {
      arrastrandoTipo = b.dataset.add;
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', b.dataset.add);
    });
    b.addEventListener('dragend', () => { arrastrandoTipo = null; quitarFantasma(); });
  });
  /* Capas: clic selecciona, Ctrl/Mayús+clic añade o quita. Es un clic en
     el panel, no en el lienzo: repintar aqui no rompe ningun arrastre. */
  document.querySelectorAll('[data-capa]').forEach(b => b.addEventListener('click', e => {
    seleccionar(b.dataset.capa, e.ctrlKey || e.metaKey || e.shiftKey); pintar();
  }));
  /* Buscar en la paleta: solo esconde botones, no repinta (el foco sigue en la casilla) */
  on('buscarWidget', 'input', e => {
    const q = e.target.value.trim().toLowerCase();
    let hay = 0;
    document.querySelectorAll('.paleta.tiles .wbtn').forEach(b => { const si = !q || b.dataset.buscar.includes(q); b.hidden = !si; if (si) hay++; });
    document.querySelectorAll('.grupo-pal').forEach(g => { const pal = g.nextElementSibling; g.hidden = !!q && ![...pal.children].some(b => !b.hidden); });
    const v = document.getElementById('palVacia'); if (v) v.hidden = hay > 0;
  });

  if (w){
    on('wNombre','input', e => { w.nombre = e.target.value.replace(/\s+/g,'_'); pintarLienzo(); });
    on('wBind','change',  e => {
      w.bind = e.target.value;
      /* un contador cuenta enteros: el numero sale sin decimales (se pueden
         poner a mano despues) */
      const lv = varsLogica().find(x => x.nombre === w.bind);
      if (lv && lv.tipoLogica === 'counter' && w.decimales === undefined){ HIST.iniciar(); w.decimales = 0; }
      pintarLienzo(); pintarPanel();
    });
    /* botón que sube o baja un valor: acción, paso y repetición */
    const ponOrden = (k, val) => { HIST.iniciar(); w.orden = { ...(w.orden || {}), [k]: val }; pintarLienzo(); };
    on('wOrdenAccion','change', e => ponOrden('accion', e.target.value));
    on('wOrdenPaso','change', e => ponOrden('paso', Math.abs(parseFloat(e.target.value)) || pasoPorDefecto(variables().find(v => v.nombre === w.bind) || {})));
    on('wOrdenRepite','change', e => ponOrden('repite', e.target.checked));
    on('wTexto','input',  e => { w.texto = e.target.value; pintarLienzo(); });
    on('wElementos','input', e => { w.elementos = e.target.value; pintarLienzo(); });
    on('wCampo','change', e => { HIST.iniciar(); w.campo = e.target.value; pintarLienzo(); });
    on('wIcono','click', async () => {
      const k = await elegirIcono(w.icono || '', w.tipo === 'button');
      if (k === null) return;
      HIST.iniciar(); if (k) w.icono = k; else delete w.icono; pintar();
    });
    /* pintar() y no pintarLienzo(): al cargar cambia tambien el panel,
       que pasa a mostrar el tamano y el peso. Es seguro porque aqui la
       interaccion con el selector de fichero ya ha terminado. */
    on('wImagen','change', e => { const f = e.target.files[0]; if (f) cargarImagen(w, f, pintar); });
    on('wDecimales','change', e => { HIST.iniciar(); w.decimales = +e.target.value; pintar(); });
    on('wEjemplo','input',    e => { w.ejemplo = w.tipo === 'tiempo' ? Math.max(0, Math.round(+e.target.value || 0)) : (parseFloat(e.target.value) || 0); if (w.auto) normalizarAuto(); pintarLienzo(); });
    on('wEvento','input', e => { w.evento = e.target.value.trim(); });
    on('wDestino','change', e => { w.destino = e.target.value; });
    for (const k of ['X','Y','W','H']) on('w'+k,'input', e => { w[k.toLowerCase()] = parseInt(e.target.value)||0;
      /* proporción fija: al escribir un lado, el otro le sigue */
      const R = PROPORCION[w.tipo];
      if (R && k === 'W'){ w.h = Math.round(w.w / R); const o = document.getElementById('wH'); if (o) o.value = w.h; }
      if (R && k === 'H'){ w.w = Math.round(w.h * R); const o = document.getElementById('wW'); if (o) o.value = w.w; }
      pintarLienzo(); });
    document.querySelectorAll('[data-serie]').forEach(c => c.addEventListener('change', () => {
      w.series = [...document.querySelectorAll('[data-serie]:checked')].map(x => x.dataset.serie); pintarLienzo(); }));
  }

  document.querySelectorAll('[data-alinea]').forEach(b =>
    b.addEventListener('click', () => alinear(b.dataset.alinea)));
  document.querySelectorAll('[data-distrib]').forEach(b =>
    b.addEventListener('click', () => distribuir(b.dataset.distrib)));
  document.querySelectorAll('[data-todos]').forEach(i => i.addEventListener('input', () => {
    for (const x of widgetsSel()) aplicarEstilo(x, i.dataset.todos, i.value);
  }));

  document.querySelectorAll('[data-pant]').forEach(n => n.addEventListener('click', e => {
    if (e.target.dataset.delpant) return; E.iPantalla = +n.dataset.pant; limpiarSeleccion(); pintar(); }));
  document.querySelectorAll('[data-delpant]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); E.pantallas.splice(+b.dataset.delpant,1);
    E.iPantalla = Math.min(E.iPantalla, E.pantallas.length-1); limpiarSeleccion(); pintar(); }));
  document.querySelectorAll('[data-plantilla]').forEach(b => b.addEventListener('click', () => aplicarPlantilla(b.dataset.plantilla)));
  on('wEscalaFija', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    if (e.target.checked) w2.escalaFija = true; else delete w2.escalaFija; pintar(); });
  on('wPlano', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    if (e.target.checked) w2.plano = true; else delete w2.plano; pintar(); });
  on('wEscala', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    if (e.target.checked) delete w2.escala; else w2.escala = false; pintar(); });
  on('wApertura', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    if (Number(e.target.value) === 180) w2.apertura = 180; else delete w2.apertura; pintar(); });
  on('wTarjeta', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    if (e.target.checked) w2.tarjeta = true; else delete w2.tarjeta;
    /* la letra se recalcula sola salvo que se haya fijado a mano */
    pintar(); });
  on('wMarca', 'change', e => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    if (e.target.checked) delete w2.marca; else w2.marca = false; pintar(); });
  on('irEstilo', 'click', () => {
    E.pestana = 'estilo';
    document.querySelectorAll('.pestanas button').forEach(x => x.classList.toggle('activa', x.dataset.t === 'estilo'));
    pintarPanel(); document.getElementById('panel').scrollTop = 0;
  });
  on('addPant','click', () => {
    let i = E.pantallas.length+1, n;
    do { n = 'pantalla'+i++; } while (E.pantallas.some(s => s.nombre === n));
    E.pantallas.push({nombre:n, widgets:[]}); E.iPantalla = E.pantallas.length-1; limpiarSeleccion(); pintar(); });

  document.querySelectorAll('[data-nodo]').forEach(b => b.addEventListener('click', () => {
    E.iNodo = +b.dataset.nodo; HW.vista = 'nodo'; accAbierto = null;
    pintarPanel(); document.getElementById('panel').scrollTop = 0; }));
  document.querySelectorAll('[data-hwvista]').forEach(b => b.addEventListener('click', () => {
    HW.vista = b.dataset.hwvista; pintarPanel(); document.getElementById('panel').scrollTop = 0; }));
  on('addNodo','click', anadirNodo);
  document.querySelectorAll('[data-addnodo]').forEach(b => b.addEventListener('click', () => { HW.vista = 'nodo'; anadirNodo(); }));
  on('delNodo','click', () => {
    HIST.iniciar(); HW.vista = 'nodo';
    E.nodos.splice(E.iNodo,1); E.iNodo = 0;
    if (E.nodos.length === 1) E.enlace = null;
    limpiarEnlacesRotos(); pintar(); });
  on('fEnlace','change', e => {
    E.enlace = { tipo:e.target.value, baudios: ENLACES[e.target.value].baudios }; pintarPanel(); });
  on('fBaud','input', e => { E.enlace.baudios = parseInt(e.target.value)||ENLACES[E.enlace.tipo].baudios; });
  on('fClave','change', e => { HIST.iniciar();
    const v = e.target.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 8);
    if (v) E.enlace.clave = v; else delete E.enlace.clave;
    pintar(); });

  on('addConex','change', e => { if (e.target.value){ anadirPieza(e.target.value); e.target.value=''; } });
  /* Renombrar una pieza.
   *
   * El repintado va en 'change' (al salir de la casilla), NUNCA en
   * 'input': pintarPanel() destruye el <input> vivo y el alumno se queda
   * escribiendo sobre un elemento que ya no esta en el documento. Es el
   * mismo fallo que ya aparecio con el selector de color y con el doble
   * clic para editar textos.
   *
   * El nombre acaba siendo un identificador de C, asi que se limpia:
   * minusculas, sin espacios ni tildes. Mejor arreglarlo aqui que
   * explicar mas tarde por que no compila. */
  document.querySelectorAll('[data-renombrar]').forEach(inp => {
    inp.addEventListener('change', e => {
      const [lista, i] = inp.dataset.renombrar.split('|');
      const pieza = nodo()[lista][+i];
      if (!pieza) return;

      let nuevo = e.target.value.trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '')
        .replace(/^(\d)/, '_$1');
      if (!nuevo) { pintarPanel(); return; }        /* vacio: se deja como estaba */

      const otras = E.nodos.flatMap(x => x.conexiones)
                           .filter(x => x !== pieza);
      if (otras.some(x => x.clave === nuevo)) { pintarPanel(); return; }   /* repetido */

      HIST.iniciar();
      const antes = pieza.clave;
      pieza.clave = nuevo;
      /* Los widgets enlazados apuntan a la variable por nombre: si no se
         arrastra el cambio, el enlace se rompe en silencio. */
      for (const p of E.pantallas) for (const w of p.widgets){
        if (w.bind === antes) w.bind = nuevo;
        if (w.series) w.series = w.series.map(x => x === antes ? nuevo : x);
      }
      pintar();
    });
  });

  document.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', () => {
    /* Uno abierto cada vez: con cinco piezas desplegadas vuelve el
       problema que veniamos a resolver. Volver a pulsar lo cierra. */
    accAbierto = (accAbierto === b.dataset.acc) ? null : b.dataset.acc;
    pintarPanel();
  }));

  document.querySelectorAll('[data-delconex]').forEach(b => b.addEventListener('click', () => quitarPieza('conexiones',  +b.dataset.delconex)));

  document.querySelectorAll('[data-forzar]').forEach(s => s.addEventListener('change', e => {
    const clave = s.dataset.forzar;
    const p = nodo().conexiones.find(x => x.clave === clave);
    if (p) p.pinForzado = e.target.value ? +e.target.value : null;
    pintarPanel(); }));
  document.querySelectorAll('[data-par]').forEach(i => i.addEventListener('change', e => {
    const [clave,k] = i.dataset.par.split('|');
    const c = nodo().conexiones.find(x => x.clave === clave);
    if (c){ c.params = c.params || {};
            c.params[k] = i.type === 'number' ? (parseFloat(e.target.value)||0) : e.target.value; }
    pintarPanel(); }));

  /* Un <input type="color"> dispara 'input' sin parar mientras arrastras
     por el selector del sistema. Aqui NO se puede llamar a pintarPanel():
     reconstruiria el panel y destruiria el input que tienes cogido, y el
     arrastre se quedaria a medias sin aplicar nada. Solo lienzo y previo. */
  document.querySelectorAll('[data-tema]').forEach(i => {
    i.addEventListener('change', () => { HIST.confirmar(); pintarPanel(); });
    i.addEventListener('input', () => {
    HIST.iniciar();
    const k = i.dataset.tema;
    temaPon(k, i.value);
    const hex = document.querySelector(`[data-temahex="${k}"]`);
    if (hex) hex.value = i.value;
    document.querySelectorAll(`.sw[data-swk="${k}"]`).forEach(c => c.style.background = i.value);
    pintarLienzo(); refrescarPrevio();
  });});

  /* Escribir el hexadecimal a mano, para pegar un color de marca */
  document.querySelectorAll('[data-temahex]').forEach(i => i.addEventListener('change', () => {
    const k = i.dataset.temahex, v = i.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)){
      HIST.iniciar();
      temaPon(k, v.toLowerCase());
      const col = document.querySelector(`[data-tema="${k}"]`);
      if (col) col.value = temaLee(k);
      pintar();
    } else i.value = temaLee(k);      // no era un color: deshacer
  }));
  on('temaFuente','change', e => { E.tema.fuente = +e.target.value; pintarLienzo(); pintarPanel(); });
  /* Volver a los colores de origen: los del tema de fabrica del que se
     partio (el Aula, si no se sabe), sin tocar la tipografia elegida. */
  on('temaReset','click', () => {
    HIST.iniciar();
    const base = TEMAS[E.tema.base] ? E.tema.base : (E.tema._partida && TEMAS[E.tema._partida] ? E.tema._partida : 'aula');
    const tip = E.tema.tipografia, fu = E.tema.fuente, co = E.tema.coma;
    E.tema = { ...JSON.parse(JSON.stringify(TEMAS[base])), tipografia: tip, fuente: fu, coma: co, base, _partida: base };
    pintar(); });

  /* Un tema de fabrica, de un clic: colores, botones y tipografia */
  document.querySelectorAll('[data-tema-base]').forEach(b => b.addEventListener('click', () => {
    HIST.iniciar();
    const id = b.dataset.temaBase;
    E.tema = { ...JSON.parse(JSON.stringify(TEMAS[id])), base: id, _partida: id };
    delete E.tema.nombre; delete E.tema.desc;
    pintar();
  }));
  Object.keys(PAPELES_TEXTO).forEach(p => on('temaTipo_' + p, 'change', e => {
    HIST.iniciar(); E.tema.tipografia = { ...(E.tema.tipografia || {}), [p]: e.target.value }; E.tema.base = null; pintar(); }));
  on('temaComa',  'change', e => { HIST.iniciar(); E.tema.coma = e.target.checked; pintar(); });
  on('temaRadio', 'change', e => { HIST.iniciar(); E.tema.radio = Math.max(0, Math.min(24, +e.target.value || 0)); pintar(); });

  /* Elegir que color se edita: un circulo de la paleta o una parte de la
     vista previa. No se repinta el panel: cambia que ficha se ve y que
     parte se marca, y la vista previa se rehace sola (no tiene campos). */
  const elegirColor = k => {
    if (!COLORES_TEMA.some(([c]) => c === k)) return;
    ESTILO_UI.color = k; ESTILO_UI.ultimo = 'color';
    document.querySelectorAll('.sw[data-swk]').forEach(c => c.classList.toggle('on', c.dataset.swk === k));
    document.querySelectorAll('[data-fc]').forEach(f => f.classList.toggle('elegida', f.dataset.fc === k));
    refrescarPrevio();
  };
  /* Abrir una clase de boton (una sola a la vez). Desde la vista previa
     siempre abre, y abre tambien la seccion si estaba plegada. */
  const elegirBoton = (k, abrir) => {
    ESTILO_UI.boton = (!abrir && ESTILO_UI.boton === k) ? null : k;
    ESTILO_UI.ultimo = ESTILO_UI.boton ? 'boton' : 'color';
    document.querySelectorAll('[data-cb]').forEach(c => {
      const ab = c.dataset.cb === ESTILO_UI.boton;
      c.classList.toggle('elegida', ab);
      c.querySelector('[data-cbsel]')?.setAttribute('aria-expanded', ab);
    });
    refrescarPrevio();
  };
  document.querySelectorAll('.sw[data-swk]').forEach(b => b.addEventListener('click', () => elegirColor(b.dataset.swk)));
  document.querySelectorAll('[data-cbsel]').forEach(b => b.addEventListener('click', () => elegirBoton(b.dataset.cbsel, false)));
  document.getElementById('previoTema')?.addEventListener('click', ev => {
    const b = ev.target.closest('[data-swbtn]');
    if (b){
      elegirBoton(b.dataset.swbtn, true);
      const dt = document.querySelector('details[data-sec="est-botones"]');
      if (dt && !dt.open) dt.open = true;
      document.querySelector(`[data-cb="${b.dataset.swbtn}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return;
    }
    const c = ev.target.closest('[data-swk]');
    if (c){
      elegirColor(c.dataset.swk);
      document.querySelector('.ficha-colores')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  });
  /* los colores del widget seleccionado: igual, un circulo y su ficha */
  document.querySelectorAll('.sw[data-swwest]').forEach(b => b.addEventListener('click', () => {
    ESTILO_UI.wcolor = b.dataset.swwest;
    document.querySelectorAll('.sw[data-swwest]').forEach(c => c.classList.toggle('on', c === b));
    document.querySelectorAll('[data-fcw]').forEach(f => f.classList.toggle('elegida', f.dataset.fcw === b.dataset.swwest));
  }));

  /* Igual que arriba: mientras se arrastra por el selector de color solo
     se refresca el lienzo. El panel se reconstruye al soltar ('change'),
     que es cuando hay que mostrar el boton de "volver a heredar". */
  document.querySelectorAll('[data-west]').forEach(i => {
    const aplicar = () => {
      if (!w) return;
      w.estilo = w.estilo || {};
      const k = i.dataset.west, v = i.value;
      if (k === 'fuente'){ if (v) w.estilo.fuente = +v; else delete w.estilo.fuente; }
      /* un desplegable en blanco es "el del tema": se borra y vuelve a heredar */
      else if (v === '' && (k === 'tipo' || k === 'clase')) delete w.estilo[k];
      else w.estilo[k] = v;
      if (!Object.keys(w.estilo).length) delete w.estilo;
      const hex = document.querySelector(`[data-westhex="${k}"]`);
      if (hex) hex.value = v;
      if (i.type === 'color') document.querySelectorAll(`.sw[data-swwest="${k}"]`).forEach(c => { c.style.background = v; c.classList.remove('hereda'); });
      pintarLienzo();
    };
    i.addEventListener('input', aplicar);
    if (i.type === 'color') i.addEventListener('change', () => { aplicar(); pintarPanel(); });
    if (i.tagName === 'SELECT') i.addEventListener('change', () => { HIST.iniciar(); aplicar(); pintarPanel(); });
    if (i.type === 'number')    i.addEventListener('change', () => { HIST.iniciar(); aplicar(); pintarPanel(); });
  });

  document.querySelectorAll('[data-westhex]').forEach(i => i.addEventListener('change', () => {
    if (!w) return;
    const k = i.dataset.westhex, v = i.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)){
      w.estilo = w.estilo || {}; w.estilo[k] = v.toLowerCase();
      pintarLienzo(); pintarPanel();
    } else i.value = (w.estilo && w.estilo[k]) || '';
  }));
  on('westReset','click', () => { if (w){ delete w.estilo; pintar(); } });
  on('ajustarTexto','click', () => { if (w){ HIST.iniciar(); ajustarAlTexto(w); pintar(); } });
  /* Estilo del texto. Lo que se apaga se borra: un estilo vacío vuelve a heredar */
  const ponEstiloTexto = (k, v) => { if (!w) return; HIST.iniciar(); w.estilo = w.estilo || {};
    if (v === false || v === 0 || v === '' || v == null) delete w.estilo[k]; else w.estilo[k] = v;
    if (!Object.keys(w.estilo).length) delete w.estilo;
    pintar(); };
  document.querySelectorAll('[data-wtxt]').forEach(b => b.addEventListener('click', () =>
    ponEstiloTexto(b.dataset.wtxt, !(w && w.estilo && w.estilo[b.dataset.wtxt]))));
  document.querySelectorAll('[data-wtxtnum]').forEach(i => i.addEventListener('change', () =>
    ponEstiloTexto(i.dataset.wtxtnum, Math.round(parseFloat(i.value) || 0))));
  document.querySelectorAll('[data-wtxtsel]').forEach(s => s.addEventListener('change', () =>
    ponEstiloTexto(s.dataset.wtxtsel, s.value)));

  on('wAuto','change', e => { if (w){ HIST.iniciar();
    /* Al cenir la caja manda la letra: si no habia una elegida, se fija la
       que tiene ahora. Al soltarla se conserva, para que no salte. */
    if (!(w.estilo && w.estilo.fuente)){
      const px = COMPONENTES[w.tipo] ? fuenteAutoComponente(w) : fuenteEfectiva(w);
      if (px){ w.estilo = w.estilo || {}; w.estilo.fuente = px; }
    }
    w.auto = e.target.checked;
    pintar(); } });
  const ponFuente = v => { const w2 = widgetSel(); if (!w2) return; HIST.iniciar();
    w2.estilo = w2.estilo || {};
    if (v) w2.estilo.fuente = +v; else delete w2.estilo.fuente;   /* en blanco: la deduce de su caja */
    if (!Object.keys(w2.estilo).length) delete w2.estilo;
    pintar(); };
  on('wFuente','change',     e => ponFuente(e.target.value));
  on('wFuenteLibre','change', e => ponFuente(e.target.value));

  on('copiarManif','click', e => navigator.clipboard.writeText(manifiesto()).then(() => {
    e.target.textContent = '✓ Copiado'; setTimeout(() => e.target.textContent='Copiar al portapapeles', 1400); }));
}
